syntax = "proto3";

package synctv.client;

import "proto/common.proto";

// ==================== Auth Service ====================
// Authentication: None (public access)
// Routes: /api/auth/*
//
// SECURITY: All RPCs that transmit passwords (Register, Login) send credentials
// as plaintext in the protobuf payload. Deployments MUST use TLS to protect
// credentials in transit. Never expose this service over an unencrypted channel.
service AuthService {
    rpc Register(RegisterRequest) returns (RegisterResponse);
    rpc Login(LoginRequest) returns (LoginResponse);
    rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
}

// ==================== User Service ====================
// Authentication: JWT Authorization header (user_id)
// Routes: /api/user/*
service UserService {
    // Profile Management
    rpc Logout(LogoutRequest) returns (LogoutResponse);
    rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
    rpc SetUsername(SetUsernameRequest) returns (SetUsernameResponse);
    rpc SetPassword(SetPasswordRequest) returns (SetPasswordResponse);

    // User-initiated room resource operations (room_id in payload when targeting an existing room)
    rpc CreateRoom(CreateRoomRequest) returns (CreateRoomResponse);
    rpc GetRoom(GetRoomRequest) returns (GetRoomResponse);
    rpc JoinRoom(JoinRoomRequest) returns (JoinRoomResponse);
    rpc LeaveRoom(LeaveRoomRequest) returns (LeaveRoomResponse);
    rpc DeleteRoom(DeleteRoomRequest) returns (DeleteRoomResponse);
    rpc CheckRoomPassword(CheckRoomPasswordRequest) returns (CheckRoomPasswordResponse);
    rpc ListCreatedRooms(ListCreatedRoomsRequest) returns (ListCreatedRoomsResponse);
    rpc ListParticipatedRooms(ListParticipatedRoomsRequest) returns (ListParticipatedRoomsResponse);
}

// ==================== Room Service ====================
// Authentication: JWT Authorization header (user_id) + x-room-id metadata (room context)
// Routes: /api/room/*
service RoomService {
    // Room Settings Management
    rpc GetRoomSettings(GetRoomSettingsRequest) returns (GetRoomSettingsResponse);
    rpc UpdateRoomSettings(UpdateRoomSettingsRequest) returns (UpdateRoomSettingsResponse);
    rpc ResetRoomSettings(ResetRoomSettingsRequest) returns (ResetRoomSettingsResponse);

    // Room Password Management
    rpc SetRoomPassword(SetRoomPasswordRequest) returns (SetRoomPasswordResponse);

    // Member Management (room-scoped operations)
    rpc GetRoomMembers(GetRoomMembersRequest) returns (GetRoomMembersResponse);
    rpc UpdateMemberPermissions(UpdateMemberPermissionsRequest) returns (UpdateMemberPermissionsResponse);
    rpc KickMember(KickMemberRequest) returns (KickMemberResponse);
    rpc BanMember(BanMemberRequest) returns (BanMemberResponse);
    rpc UnbanMember(UnbanMemberRequest) returns (UnbanMemberResponse);

    // Real-time Messaging (room-scoped)
    rpc MessageStream(stream ClientMessage) returns (stream ServerMessage);
    rpc GetChatHistory(GetChatHistoryRequest) returns (GetChatHistoryResponse);

    // WebRTC ICE Servers Configuration
    rpc GetIceServers(GetIceServersRequest) returns (GetIceServersResponse);

    // WebRTC Network Quality Monitoring
    rpc GetNetworkQuality(GetNetworkQualityRequest) returns (GetNetworkQualityResponse);

    // Playlist Management (room-scoped operations)
    rpc CreatePlaylist(CreatePlaylistRequest) returns (CreatePlaylistResponse);
    rpc GetPlaylist(GetPlaylistRequest) returns (GetPlaylistResponse);
    rpc UpdatePlaylist(UpdatePlaylistRequest) returns (UpdatePlaylistResponse);
    rpc DeletePlaylist(DeletePlaylistRequest) returns (DeletePlaylistResponse);
    rpc ListPlaylists(ListPlaylistsRequest) returns (ListPlaylistsResponse);

    // Media Management (room-scoped operations)
    rpc AddMedia(AddMediaRequest) returns (AddMediaResponse);
    rpc DeleteMedia(DeleteMediaRequest) returns (DeleteMediaResponse);
    rpc DeleteEntries(DeleteEntriesRequest) returns (DeleteEntriesResponse);
    rpc EditMedia(EditMediaRequest) returns (EditMediaResponse);
    rpc ListPlaylist(ListPlaylistRequest) returns (ListPlaylistResponse);
    rpc ListPlaylistItems(ListPlaylistItemsRequest) returns (ListPlaylistItemsResponse); // List dynamic playlist items
    rpc SwapMedia(SwapMediaRequest) returns (SwapMediaResponse);
    rpc ClearPlaylist(ClearPlaylistRequest) returns (ClearPlaylistResponse);

    // Batch Operations (room-scoped)
    rpc AddMediaBatch(AddMediaBatchRequest) returns (AddMediaBatchResponse);
    rpc ReorderMediaBatch(ReorderMediaBatchRequest) returns (ReorderMediaBatchResponse);

    // Playback Control (room-scoped operations)
    // Note: Real-time playback commands (play/pause/seek/speed) are sent via WebSocket ClientMessage
    rpc StartPlayback(StartPlaybackRequest) returns (StartPlaybackResponse); // Start playing a media or a dynamic-playlist item
    rpc StopPlayback(StopPlaybackRequest) returns (StopPlaybackResponse); // Stop current playback
    rpc GetPlayback(GetPlaybackRequest) returns (GetPlaybackResponse); // Get current playback state and info

    // Live Streaming (room-scoped)
    rpc CreatePublishKey(CreatePublishKeyRequest) returns (CreatePublishKeyResponse);
    rpc GetStreamInfo(GetStreamInfoRequest) returns (GetStreamInfoResponse);
    rpc ListRoomStreams(ListRoomStreamsRequest) returns (ListRoomStreamsResponse);
}

// ==================== Public Service ====================
// Authentication: None (public access)
// Routes: /api/public/*
service PublicService {
    rpc CheckRoom(CheckRoomRequest) returns (CheckRoomResponse);
    rpc ListRooms(ListRoomsRequest) returns (ListRoomsResponse);
    rpc GetHotRooms(GetHotRoomsRequest) returns (GetHotRoomsResponse);
    rpc GetPublicSettings(GetPublicSettingsRequest) returns (GetPublicSettingsResponse);
}

// ==================== Email Service ====================
// Authentication: None for sending codes, JWT for confirmation
// Routes: /api/email/*
service EmailService {
    // Email verification
    rpc SendVerificationEmail(SendVerificationEmailRequest) returns (SendVerificationEmailResponse);
    rpc ConfirmEmail(ConfirmEmailRequest) returns (ConfirmEmailResponse);

    // Password reset
    rpc RequestPasswordReset(RequestPasswordResetRequest) returns (RequestPasswordResetResponse);
    rpc ConfirmPasswordReset(ConfirmPasswordResetRequest) returns (ConfirmPasswordResetResponse);
}

// ==================== Notification Service ====================
// Authentication: JWT Authorization header (user_id)
// Routes: /api/notifications/*
service NotificationService {
    rpc ListNotifications(ListNotificationsRequest) returns (ListNotificationsResponse);
    rpc GetNotification(GetNotificationRequest) returns (GetNotificationResponse);
    rpc MarkAsRead(MarkAsReadRequest) returns (MarkAsReadResponse);
    rpc MarkAllAsRead(MarkAllAsReadRequest) returns (MarkAllAsReadResponse);
    rpc DeleteNotification(DeleteNotificationRequest) returns (DeleteNotificationResponse);
    rpc DeleteAllRead(DeleteAllReadRequest) returns (DeleteAllReadResponse);
}

// Common Types

// Full user profile - only returned to the authenticated user themselves (e.g., GetProfile, Register, Login).
// SECURITY: Contains PII (email). Never return this message for other users.
message User {
    string id = 1;
    string username = 2;
    string email = 3;                    // PII - only visible to the user themselves or admins
    synctv.common.UserRole role = 4;     // Global RBAC role
    synctv.common.UserStatus status = 5; // Account status
    int64 created_at = 6;
    bool email_verified = 7; // Whether email has been verified
}

// Public user view - safe to return in any context (room member lists, chat, etc.).
// Does not contain email or other PII.
message UserPublicView {
    string id = 1;
    string username = 2;
    synctv.common.UserRole role = 3;     // Global RBAC role
    int64 created_at = 4;
}

message Room {
    string id = 1;
    string name = 2;
    string created_by = 3;
    synctv.common.RoomStatus status = 4; // Room lifecycle status (Active/Pending/Closed)
    bytes settings = 5; // JSON settings
    int64 created_at = 6;
    int32 member_count = 7;
    string description = 8; // Room description
    int64 updated_at = 9; // Last updated timestamp
    bool is_banned = 10; // Ban flag set by global admin only
}

message Media {
    string id = 1;
    string room_id = 2;
    string provider = 4; // bilibili, alist, emby, direct (also known as source_provider)
    string title = 5; // Also known as name
    bytes metadata = 6; // JSON metadata
    int32 position = 7; // Position in playlist
    int64 added_at = 8;
    string added_by = 9; // Also known as creator_id
    string provider_instance_name = 10; // e.g., "bilibili_main", "alist_company"
    bytes source_config = 11; // JSON source config (replaces url for flexibility)
}

message Playlist {
    string id = 1;
    string room_id = 2;
    string name = 3;
    string parent_id = 4; // Parent playlist ID for nested playlists (null for root)
    int32 position = 5; // Position among sibling playlists
    bool is_folder = 6; // True if this is a folder (can contain other playlists)
    bool is_dynamic = 7; // True if this is a dynamic playlist (provider-based)
    int32 item_count = 8; // Number of items in this playlist
    int64 created_at = 9;
    int64 updated_at = 10;
}

message PlaybackState {
    string room_id = 1;
    string playing_media_id = 2;
    double current_time = 3; // playback position in seconds
    double speed = 4;
    bool is_playing = 5;
    int64 updated_at = 6;
    int64 version = 7; // For optimistic locking
    string playing_playlist_id = 8; // Currently playing playlist
    string relative_path = 9; // Relative path within dynamic folder (empty for static playlists)
}

// Authentication Messages
// SECURITY: password is transmitted as plaintext. TLS MUST be used.
message RegisterRequest {
    string username = 1; // Validation: min 3, max 32 chars, pattern: [\p{L}\p{N}_-]+
    string password = 2; // SECURITY: Plaintext credential - requires TLS in transit. Validation: min 8, max 128 chars, rejects common weak passwords
    string email = 3; // Validation: max 254 chars, email format required
}

message RegisterResponse {
    User user = 1;
    string access_token = 2;
    string refresh_token = 3;
}

// SECURITY: password is transmitted as plaintext. TLS MUST be used.
message LoginRequest {
    string username = 1; // Validation: min 3, max 32 chars
    string password = 2; // SECURITY: Plaintext credential - requires TLS in transit. Validation: min 8, max 128 chars
}

message LoginResponse {
    User user = 1;
    string access_token = 2;
    string refresh_token = 3;
}

message RefreshTokenRequest {
    string refresh_token = 1;
}

message RefreshTokenResponse {
    string access_token = 1;
    string refresh_token = 2;
}

message GetProfileRequest {}

message GetProfileResponse {
    User user = 1;
}

// Room Management Messages
message CreateRoomRequest {
    string name = 1; // Validation: max 100 chars, no HTML tags
    string password = 2; // Optional room password
    bytes settings = 3; // JSON settings
    string description = 4; // Validation: max 500 chars, no HTML tags
}

message CreateRoomResponse {
    Room room = 1;
}

// Note: UserService room-scoped resource request; room_id is carried in payload.
message GetRoomRequest {
    string room_id = 1;
}

message GetRoomResponse {
    Room room = 1;
    PlaybackState playback_state = 2;
}

message JoinRoomRequest {
    string password = 1; // Optional room password
    string room_id = 2; // Target room, carried in payload because this RPC is outside RoomService context
}

message JoinRoomResponse {
    Room room = 1;
    PlaybackState playback_state = 2;
    repeated synctv.common.RoomMember members = 3;
}

message LeaveRoomRequest {
    string room_id = 1; // Target room, carried in payload because this RPC is outside RoomService context
}

message LeaveRoomResponse {
    bool success = 1;
}

message ListRoomsRequest {
    int32 page = 1; // Validation: >= 1
    int32 page_size = 2; // Validation: max 100, default 20
    string search = 3; // Optional search by name/description
}

message ListRoomsResponse {
    repeated Room rooms = 1;
    int32 total = 2;
}

message DeleteRoomRequest {
    string room_id = 1; // Target room, carried in payload because this RPC is outside RoomService context
}

message DeleteRoomResponse {
    bool success = 1;
}

message UpdateRoomSettingsRequest {
    bytes settings = 1; // JSON settings (partial or complete update)
}

message UpdateRoomSettingsResponse {
    Room room = 1;
}

// Get room settings
message GetRoomSettingsRequest {}

message GetRoomSettingsResponse {
    bytes settings = 1; // JSON settings
}

// Reset room settings to default
message ResetRoomSettingsRequest {}

message ResetRoomSettingsResponse {
    bytes settings = 1; // Reset settings (default values)
}

// Room Password Messages
message SetRoomPasswordRequest {
    string password = 1;  // empty = remove password
}
message SetRoomPasswordResponse {
    bool success = 1;
}

message CheckRoomPasswordRequest {
    string password = 1;
    string room_id = 2; // Target room, carried in payload because this RPC is outside RoomService context
}
message CheckRoomPasswordResponse {
    bool valid = 1;
}

// Room Members Messages
// Note: room_id extracted from x-room-id metadata
message GetRoomMembersRequest {
    int32 page = 1;      // Page number (default 1). Validation: >= 1
    int32 page_size = 2;  // Items per page (default 50). Validation: max 100
}

message GetRoomMembersResponse {
    repeated synctv.common.RoomMember members = 1;
    int32 total = 2;
}

message UpdateMemberPermissionsRequest {
    string user_id = 1;           // Target user
    synctv.common.RoomMemberRole role = 2; // New role (optional)

    // Allow/Deny permission pattern fields
    // Only set the fields you want to update
    // For member role: use added_permissions/removed_permissions
    // For admin role: use admin_added_permissions/admin_removed_permissions
    uint64 added_permissions = 3;
    uint64 removed_permissions = 4;
    uint64 admin_added_permissions = 5;
    uint64 admin_removed_permissions = 6;
}

message UpdateMemberPermissionsResponse {
    synctv.common.RoomMember member = 1;
}

message KickMemberRequest {
    string user_id = 1;  // Target user to kick
}

message KickMemberResponse {
    bool success = 1;
}

message BanMemberRequest {
    string user_id = 1;   // Target user to ban
    string reason = 2;    // Optional ban reason
}

message BanMemberResponse {
    bool success = 1;
}

message UnbanMemberRequest {
    string user_id = 1;  // Target user to unban
}

message UnbanMemberResponse {
    bool success = 1;
}

// Playlist Management Messages
// Note: room_id extracted from x-room-id metadata

message CreatePlaylistRequest {
    string name = 1;
    string parent_id = 2; // Optional parent playlist ID for nested playlists
    bool is_folder = 3; // True if creating a folder (can contain other playlists)
}

message CreatePlaylistResponse {
    Playlist playlist = 1;
}

message UpdatePlaylistRequest {
    string playlist_id = 1;
    string name = 2; // Optional new name
    int32 position = 3; // Optional new position
}

message UpdatePlaylistResponse {
    Playlist playlist = 1;
}

message DeletePlaylistRequest {
    string playlist_id = 1;
    bool force = 2;
}

message DeletePlaylistResponse {
    bool success = 1;
}

// Get single playlist info
message GetPlaylistRequest {
    string playlist_id = 1; // Playlist ID. Validation: required, max 64 chars
}

message GetPlaylistResponse {
    Playlist playlist = 1;
    int32 child_folder_count = 2; // Number of child playlists (folders)
    int32 media_count = 3; // Number of media items (files)
}

// List playlists (folders) in a room or under a parent
message ListPlaylistsRequest {
    string parent_id = 1; // Optional parent ID to get children of specific playlist
    int32 page = 2;       // Page number (default 1). Validation: >= 1
    int32 page_size = 3;  // Items per page (default 50). Validation: max 100
}

message ListPlaylistsResponse {
    repeated Playlist playlists = 1;
    int32 total = 2; // Total number of playlists matching filter
}

// HTTP API: Start playback of either:
// 1. A concrete media item (`media_id`)
// 2. A dynamic playlist item (`playlist_id` + `relative_path`)
message StartPlaybackRequest {
    string media_id = 1; // Static media ID. Mutually exclusive with playlist_id.
    string playlist_id = 2; // Dynamic playlist ID. Requires relative_path. Mutually exclusive with media_id.
    string relative_path = 3; // Relative path within dynamic playlist. Empty for static media playback.
}

message StartPlaybackResponse {
    // Empty: playback started successfully
    // Use GetPlayback to retrieve current state and info
}

// HTTP API: Stop current playback
message StopPlaybackRequest {}

message StopPlaybackResponse {
    // Empty: playback stopped successfully
    // Use GetPlayback to retrieve updated state
}

// Media Management Messages
// Note: room_id extracted from x-room-id metadata

message AddMediaRequest {
    optional string playlist_id = 1; // Target playlist ID. Omit for room-root media
    string provider = 2; // Optional, provider type name (e.g., "bilibili", "alist")
    string provider_instance_name = 3; // Optional, specific provider instance (e.g., "bilibili_main")
    bytes source_config = 4; // JSON source config (e.g., {"url": "...", "path": "..."})
    string title = 5; // Optional media title. Validation: max 500 chars, no HTML tags
}

message AddMediaResponse {
    Media media = 1;
}

message DeleteMediaRequest {
    string media_id = 1;
    bool force = 2;
}

message DeleteMediaResponse {
    bool success = 1;
}

message DeleteEntriesRequest {
    repeated string playlist_ids = 1;
    repeated string media_ids = 2;
    bool force = 3;
}

message DeleteEntriesResponse {
    int32 deleted_playlists = 1;
    int32 deleted_media = 2;
}

message ListPlaylistRequest {
    int32 page = 1; // Page number (default 1). Validation: >= 1
    int32 page_size = 2; // Items per page (default 50). Validation: max 100
}

message ListPlaylistResponse {
    Playlist playlist = 1;
    repeated Media media = 2;
    int32 total = 3; // Total number of items in playlist
}

message ListPlaylistItemsRequest {
    string playlist_id = 1; // Playlist ID. Validation: required, max 64 chars
    string relative_path = 2; // Relative path within dynamic folder (empty for root, only for dynamic playlists)
    int32 page = 3; // Page number (default 1). Validation: >= 1
    int32 page_size = 4; // Items per page (default 50). Validation: max 100
}

message ListPlaylistItemsResponse {
    repeated Playlist playlists = 1; // Child playlists (folders, listed first)
    repeated Media media = 2; // Media items (files, listed after folders)
    int32 total = 3; // Total number of items (playlists + media)
    int32 folder_count = 4; // Number of playlists (folders)
    int32 file_count = 5; // Number of media items (files)

    // For dynamic playlists only
    repeated PlaylistItem dynamic_items = 6; // Remote provider items (used when browsing dynamic folders)
}

enum ItemType {
    ITEM_TYPE_UNSPECIFIED = 0;
    ITEM_TYPE_PLAYLIST = 1; // Folder/directory (playlist)
    ITEM_TYPE_MEDIA = 2; // File (video/audio/live stream)
}

message PlaylistItem {
    string name = 1; // Item name
    ItemType item_type = 2; // Item type (PLAYLIST or MEDIA)
    string path = 3; // Full path from root
    optional int64 size = 4; // File size in bytes (for files)
    optional string thumbnail = 5; // Thumbnail URL
    optional int64 modified_at = 6; // Modified time (Unix timestamp)
}

message SwapMediaRequest {
    string media_id1 = 1;
    string media_id2 = 2;
}

message SwapMediaResponse {
    bool success = 1;
}

// Edit Media
message EditMediaRequest {
    string media_id = 1;
    string title = 2;
}
message EditMediaResponse {
    Media media = 1;
}

// Clear Playlist
message ClearPlaylistRequest {}
message ClearPlaylistResponse {
    bool success = 1;
    int32 deleted_count = 2;
}

// Batch Media Operations
message AddMediaBatchRequest {
    repeated AddMediaRequest items = 1; // Validation: max 50 items
}
message AddMediaBatchResponse {
    repeated AddMediaResponse results = 1;
}

message MediaReorderUpdate {
    string media_id = 1;
    int32 position = 2;
}
message ReorderMediaBatchRequest {
    repeated MediaReorderUpdate updates = 1;
}
message ReorderMediaBatchResponse {
    bool success = 1;
}

// Playback Control Messages
// Note: room_id extracted from x-room-id metadata
// Client -> Server: Real-time playback control commands (sent via WebSocket)
// Server broadcasts playback state changes to all room members via ServerMessage.PlaybackStateChanged

message PlayCommand {
    // Empty: just resume playback
}

message PauseCommand {
    // Empty: just pause playback
}

message SeekCommand {
    double current_time = 1; // Playback position in seconds. Validation: >= 0, max 86400, must be finite
}

message SetPlaybackSpeedCommand {
    double speed = 1; // Validation: 0.25 to 4.0, must be finite
}

message GetPlaybackRequest {}

message GetPlaybackResponse {
    // Playback state (current time, speed, is_playing, etc.)
    PlaybackState playback_state = 1;
    // Complete playback information for currently playing media
    // Includes URLs, subtitles, danmakus, etc.
    PlaybackResult playback_result = 2;
}

// ==================== Playback Information Structures ====================

// Complete playback information (returned by provider's generate_playback)
message PlaybackResult {
    string media_id = 1; // Media ID
    string playlist_id = 2; // Playlist ID
    string room_id = 3; // Room ID
    string name = 4; // Media name
    int32 position = 5; // Position in playlist

    // Multiple playback modes (e.g., "direct", "proxied", "cdn1", "cdn2")
    // Provider can define arbitrary mode names
    map<string, PlaybackInfo> playback_infos = 6;

    // Default mode name (must be a key in playback_infos)
    string default_mode = 7;

    // Media-level metadata (duration, thumbnail, title, author, etc.)
    map<string, string> metadata = 8;
}

// Playback information for a single mode
message PlaybackInfo {
    // List of playback URLs (different qualities, codecs)
    repeated PlaybackUrl urls = 1;

    // Default URL index
    int32 default_url_index = 2;

    // Subtitle list
    repeated Subtitle subtitles = 3;

    // Default subtitle index (optional)
    optional int32 default_subtitle_index = 4;

    // Danmaku list
    repeated Danmaku danmakus = 5;

    // Format type (e.g., "m3u8", "mp4", "flv")
    string format = 6;
}

// Playback URL (represents a quality/codec option)
message PlaybackUrl {
    // Display name (e.g., "1080P", "HEVC 4K", "720P")
    string name = 1;

    // Complete URL
    string url = 2;

    // Request headers (if needed)
    map<string, string> headers = 3;

    // Expiration time (Unix timestamp, optional)
    optional int64 expire_at = 4;

    // URL-level metadata (resolution, codec, bitrate, fps, etc.)
    optional PlaybackUrlMetadata metadata = 5;
}

// URL-level metadata
message PlaybackUrlMetadata {
    // Resolution (e.g., "1920x1080", "1280x720")
    optional string resolution = 1;

    // Bitrate in bps
    optional int64 bitrate = 2;

    // Video codec (e.g., "avc", "hevc", "av1")
    optional string codec = 3;

    // Frame rate
    optional int32 fps = 4;

    // Additional metadata
    map<string, string> extra = 5;
}

// Subtitle information
message Subtitle {
    // Display name (e.g., "简体中文", "English")
    string name = 1;

    // Language code (e.g., "zh-CN", "en-US")
    string language = 2;

    // Subtitle URL list (multiple sources/formats)
    repeated SubtitleUrl urls = 3;

    // Default URL index
    int32 default_url_index = 4;
}

// Subtitle URL
message SubtitleUrl {
    // Display name (e.g., "原始", "AI翻译")
    string name = 1;

    // Subtitle file URL
    string url = 2;

    // Request headers (if needed)
    map<string, string> headers = 3;

    // Format (e.g., "json", "srt", "vtt")
    string format = 4;
}

// Danmaku (bullet comments) information
message Danmaku {
    // Display name (e.g., "Bilibili弹幕", "本地弹幕")
    string name = 1;

    // Danmaku API URL or file URL
    string url = 2;

    // Format type (e.g., "bilibili", "ass", "xml")
    optional string format = 3;

    // Request headers (if needed)
    map<string, string> headers = 4;
}

// Real-time Messaging
message ClientMessage {
    oneof message {
        ChatMessageSend chat = 1;
        HeartbeatMessage heartbeat = 2;
        // WebRTC signaling messages (P2P and SFU modes)
        WebRTCOffer webrtc_offer = 3;
        WebRTCAnswer webrtc_answer = 4;
        WebRTCIceCandidate webrtc_ice_candidate = 5;
        WebRTCJoin webrtc_join = 6;
        WebRTCLeave webrtc_leave = 7;
        // SFU migration: client responds to server's migration offer
        SfuMigrationAnswer sfu_migration_answer = 8;
        // Playback progress heartbeat: client periodically reports current position
        PlaybackProgressReport playback_progress = 9;
        // Playback control commands (real-time)
        PlayCommand play_command = 10;
        PauseCommand pause_command = 11;
        SeekCommand seek_command = 12;
        SetPlaybackSpeedCommand set_speed_command = 13;
    }
}

// Client -> Server: periodic playback progress heartbeat
// Sent every few seconds by clients that are actively playing media.
// The server uses these reports to track actual client playback positions,
// detect drift between clients, and provide accurate positions to new joiners.
message PlaybackProgressReport {
    double current_time = 1;  // Current playback position in seconds
    bool is_playing = 2;      // Whether the client is currently playing
}

message ServerMessage {
    oneof message {
        ChatMessageReceive chat = 1;
        PlaybackStateChanged playback_state = 2;
        UserJoinedRoom user_joined = 3;
        UserLeftRoom user_left = 4;
        RoomSettingsChanged room_settings = 5;
        HeartbeatAck heartbeat_ack = 6;
        ErrorMessage error = 7;
        MediaAdded media_added = 8;
        MediaRemoved media_removed = 9;
        MediaRemovedBatch media_removed_batch = 25;
        PermissionChanged permission_changed = 10;
        PlaylistCreated playlist_created = 11;
        PlaylistUpdated playlist_updated = 12;
        PlaylistDeleted playlist_deleted = 13;
        PlayingChanged playing_changed = 14;
        // WebRTC signaling messages (forwarded from other peers)
        WebRTCOffer webrtc_offer = 15;
        WebRTCAnswer webrtc_answer = 16;
        WebRTCIceCandidate webrtc_ice_candidate = 17;
        WebRTCJoin webrtc_join = 18;
        WebRTCLeave webrtc_leave = 19;
        // SFU migration: server requests existing P2P peer to renegotiate via SFU
        SfuMigrationOffer sfu_migration_offer = 20;
        SfuMigrationStatus sfu_migration_status = 21;
        // User notification push (replaces NOTIFICATION_PUSH error code abuse)
        UserNotification notification = 22;
        MediaUpdated media_updated = 23;
        PlaylistReordered playlist_reordered = 24;
    }
}


// Note: room_id extracted from x-room-id metadata in MessageStream context
// If position is set, client may display this as a danmaku (bullet comment)
message ChatMessageSend {
    string content = 1; // Validation: required, max 5000 chars, HTML tags stripped
    optional double position = 2; // Video position in seconds (for danmaku display). Validation: >= 0, max 86400
    optional string color = 3; // Hex color (e.g., "#FFFFFF") for danmaku
}

message ChatMessageReceive {
    string id = 1;
    string room_id = 2;
    string user_id = 3;
    string username = 4;
    string content = 5;
    int64 timestamp = 6; // Unix timestamp (seconds)
    optional double position = 7; // Video position in seconds (for danmaku display)
    optional string color = 8; // Hex color for danmaku
}

message HeartbeatMessage {
    int64 timestamp = 1; // Unix timestamp (seconds)
}

message HeartbeatAck {
    int64 timestamp = 1; // Unix timestamp (seconds)
}

message PlaybackStateChanged {
    string room_id = 1;
    PlaybackState state = 2;
}

message UserJoinedRoom {
    string room_id = 1;
    synctv.common.RoomMember member = 2;
}

message UserLeftRoom {
    string room_id = 1;
    string user_id = 2;
}

message RoomSettingsChanged {
    string room_id = 1;
    bytes settings = 2; // JSON settings
}

message ErrorMessage {
    string message = 1;
    synctv.common.ErrorCode code = 2; // Application-level error code for programmatic handling
    string detail = 3; // Optional detailed/debug info (may be empty in production)
}

// User Notification
// Push notification delivered to user's WebSocket connection.
//
// This message type replaces the historical abuse of ErrorMessage with code 5000
// (NOTIFICATION_PUSH). Clients should handle this variant separately from errors.
//
// The notification is pushed in real-time when a database-backed notification is
// created via UserNotificationService. The notification_id allows clients to
// deduplicate notifications if they receive them multiple times (e.g., during
// reconnection).
//
// Example notification types:
// - "room_invitation": User invited to join a room
// - "system": System-wide announcement
// - "room_event": Room-specific event (e.g., room closed, settings changed)
message UserNotification {
    string notification_id = 1; // Unique notification ID (UUID string) for client-side deduplication
    string notification_type = 2; // Notification type (e.g., "room_invitation", "system", "room_event")
    string title = 3; // Notification title for display
    string content = 4; // Notification content for display
    string data = 5; // JSON-encoded additional data (e.g., room_id, inviter_name for invitations)
    int64 timestamp = 6; // Unix timestamp (seconds) when notification was created
}

// Chat History
// Note: room_id extracted from x-room-id metadata
message GetChatHistoryRequest {
    int32 limit = 1;  // Max page size (clamped to 100 server-side). Default: 50.
    string cursor = 2; // Opaque keyset cursor returned by the server as "<rfc3339_created_at>|<message_id>".
}

message GetChatHistoryResponse {
    repeated ChatMessageReceive messages = 1;
    string next_cursor = 2; // Pass this as cursor in the next request. Empty when no more messages.
}

// User Profile Management
message LogoutRequest {}

message LogoutResponse {
