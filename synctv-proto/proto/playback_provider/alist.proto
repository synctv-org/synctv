syntax = "proto3";

package synctv.playback_provider.alist;

import "proto/buf/validate/validate.proto";
import "proto/playback_provider/common.proto";

enum AlistHlsResourceKind {
  ALIST_HLS_RESOURCE_KIND_UNSPECIFIED = 0;
  ALIST_HLS_RESOURCE_KIND_MEDIA = 1;
  ALIST_HLS_RESOURCE_KIND_MANIFEST = 2;
}

message GetAlistFileStreamRequest {
  string version = 1 [(buf.validate.field).string.min_len = 1];
  string mode_name = 2 [(buf.validate.field).string.min_len = 1];
  uint32 url_index = 3;
  string sig = 4 [(buf.validate.field).string.min_len = 1];
  string uid = 5 [(buf.validate.field).string.min_len = 1];
  string rid = 6 [(buf.validate.field).string.min_len = 1];
  int64 exp = 7;
  optional string range = 8;
  bool head = 9;
}

message AlistFileStreamResponse {
  synctv.playback_provider.common.StreamChunk chunk = 1;
}

message GetAlistTranscodedHlsManifestRequest {
  string version = 1 [(buf.validate.field).string.min_len = 1];
  string mode_name = 2 [(buf.validate.field).string.min_len = 1];
  uint32 url_index = 3;
  string sig = 4 [(buf.validate.field).string.min_len = 1];
  string uid = 5 [(buf.validate.field).string.min_len = 1];
  string rid = 6 [(buf.validate.field).string.min_len = 1];
  int64 exp = 7;
}

message AlistTranscodedHlsManifestResponse {
  synctv.playback_provider.common.StreamChunk chunk = 1;
}

message GetAlistTranscodedHlsResourceRequest {
  string version = 1 [(buf.validate.field).string.min_len = 1];
  string target_url = 2 [(buf.validate.field).string.min_len = 1];
  string sig = 3 [(buf.validate.field).string.min_len = 1];
  string uid = 4 [(buf.validate.field).string.min_len = 1];
  string rid = 5 [(buf.validate.field).string.min_len = 1];
  int64 exp = 6;
  optional string range = 7;
  bool head = 8;
  string mode_name = 9 [(buf.validate.field).string.min_len = 1];
  uint32 media_index = 10;
  AlistHlsResourceKind resource_kind = 11 [(buf.validate.field).enum.defined_only = true];
}

message AlistTranscodedHlsResourceResponse {
  synctv.playback_provider.common.StreamChunk chunk = 1;
}

message GetAlistSubtitleRequest {
  string version = 1 [(buf.validate.field).string.min_len = 1];
  string mode_name = 2 [(buf.validate.field).string.min_len = 1];
  uint32 subtitle_index = 3;
  string sig = 4 [(buf.validate.field).string.min_len = 1];
  string uid = 5 [(buf.validate.field).string.min_len = 1];
  string rid = 6 [(buf.validate.field).string.min_len = 1];
  int64 exp = 7;
}

message AlistSubtitleResponse {
  synctv.playback_provider.common.StreamChunk chunk = 1;
}

message GetAlistThumbnailRequest {
  string version = 1 [(buf.validate.field).string.min_len = 1];
  string sig = 2 [(buf.validate.field).string.min_len = 1];
  string uid = 3 [(buf.validate.field).string.min_len = 1];
  string rid = 4 [(buf.validate.field).string.min_len = 1];
  int64 exp = 5;
}

message AlistThumbnailResponse {
  synctv.playback_provider.common.StreamChunk chunk = 1;
}

service AlistPlaybackProviderService {
  rpc GetFileStream(GetAlistFileStreamRequest) returns (stream AlistFileStreamResponse);
  rpc GetTranscodedHlsManifest(GetAlistTranscodedHlsManifestRequest) returns (stream AlistTranscodedHlsManifestResponse);
  rpc GetTranscodedHlsResource(GetAlistTranscodedHlsResourceRequest) returns (stream AlistTranscodedHlsResourceResponse);
  rpc GetSubtitle(GetAlistSubtitleRequest) returns (stream AlistSubtitleResponse);
  rpc GetThumbnail(GetAlistThumbnailRequest) returns (stream AlistThumbnailResponse);
}
