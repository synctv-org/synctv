syntax = "proto3";

package synctv.cluster;

// Cluster coordination service for multi-replica deployment
//
// Architecture Overview:
// - Redis is the SOLE discovery mechanism for this cluster
// - Nodes self-register in Redis via NodeRegistry::register() on startup
// - Heartbeats are sent directly to Redis via NodeRegistry::heartbeat()
// - Events are broadcast via Redis Pub/Sub through ClusterManager
//
// Endpoint Usage:
// - GetNodes: ACTIVE - returns all known nodes from Redis registry
// - GetUserOnlineStatus: ACTIVE - fan-out query for user presence
// - GetRoomConnections: ACTIVE - fan-out query for room participants
//
service ClusterService {
    // Node discovery
    rpc GetNodes(GetNodesRequest) returns (GetNodesResponse);

    // User connection tracking - ACTIVE endpoints for fan-out queries
    rpc GetUserOnlineStatus(GetUserOnlineStatusRequest) returns (GetUserOnlineStatusResponse);
    rpc GetRoomConnections(GetRoomConnectionsRequest) returns (GetRoomConnectionsResponse);

    // Proxy slice cache management - ACTIVE endpoints for management fan-out
    rpc GetSliceCacheStats(GetSliceCacheStatsRequest) returns (SliceCacheStatsResponse);
    rpc PurgeSliceCache(PurgeSliceCacheRequest) returns (PurgeSliceCacheResponse);
    rpc EvictExpiredSliceCache(EvictExpiredSliceCacheRequest) returns (EvictExpiredSliceCacheResponse);
}

// Node information
message NodeInfo {
    string node_id = 1;
    string address = 2; // gRPC address (host:port)
    int64 last_heartbeat = 3;
    uint64 epoch = 4; // Fencing token epoch for stale-registration protection
}

message GetNodesRequest {}

message GetNodesResponse {
    repeated NodeInfo nodes = 1;
}

// User connection tracking
message GetUserOnlineStatusRequest {
    repeated int64 user_ids = 1;
}

message GetUserOnlineStatusResponse {
    repeated UserOnlineStatus statuses = 1;
}

message UserOnlineStatus {
    int64 user_id = 1;
    bool is_online = 2;
    repeated int64 room_ids = 3; // Rooms user is currently in
    string node_id = 4; // Node where user is connected
}

message GetRoomConnectionsRequest {
    int64 room_id = 1;
}

message GetRoomConnectionsResponse {
    repeated RoomConnection connections = 1;
}

message RoomConnection {
    int64 user_id = 1;
    string node_id = 2;
    int64 connected_at = 3;
    int64 last_activity = 4;
}

message GetSliceCacheStatsRequest {}

message PurgeSliceCacheRequest {}

message EvictExpiredSliceCacheRequest {}

message SliceCacheConfigInfo {
    bool engine_enabled = 1;
    string backend = 3;
    string file_cache_dir = 4;
    uint64 slice_size = 5;
    uint64 max_cache_size = 6;
    uint64 max_cacheable_body = 7;
    uint64 manifest_ttl_secs = 8;
    uint64 segment_ttl_secs = 9;
    uint64 stale_max_age_secs = 10;
    bool stale_while_revalidate = 11;
    uint64 eviction_interval_secs = 12;
    double watermark_ratio = 13;
}

message SliceCacheStatsResponse {
    string node_id = 1;
    SliceCacheConfigInfo config = 2;
    uint64 current_size_bytes = 3;
    uint64 entry_count = 4;
    uint64 metadata_entries = 5;
    uint64 updating_entries = 6;
    uint64 lock_count = 7;
    double usage_ratio = 8;
}

message PurgeSliceCacheResponse {
    string node_id = 1;
    bool success = 2;
    uint64 removed_entries = 3;
    uint64 freed_bytes = 4;
    SliceCacheStatsResponse stats = 5;
}

message EvictExpiredSliceCacheResponse {
    string node_id = 1;
    bool success = 2;
    uint64 removed_expired_entries = 3;
    SliceCacheStatsResponse stats = 4;
}
