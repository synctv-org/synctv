{{- if and (not .Values.existingSecret) .Values.secretBootstrap.enabled -}}
{{- $hookAnnotations := dict
  "helm.sh/hook" "pre-install,pre-upgrade"
  "helm.sh/hook-delete-policy" "before-hook-creation,hook-succeeded"
-}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "synctv.fullname" . }}-secret-bootstrap
  labels:
    {{- include "synctv.labels" . | nindent 4 }}
    app.kubernetes.io/component: secret-bootstrap
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-30") $hookAnnotations) | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "synctv.fullname" . }}-secret-bootstrap
  labels:
    {{- include "synctv.labels" . | nindent 4 }}
    app.kubernetes.io/component: secret-bootstrap
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-29") $hookAnnotations) | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ include "synctv.secretName" . | quote }}]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "synctv.fullname" . }}-secret-bootstrap
  labels:
    {{- include "synctv.labels" . | nindent 4 }}
    app.kubernetes.io/component: secret-bootstrap
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-28") $hookAnnotations) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "synctv.fullname" . }}-secret-bootstrap
subjects:
  - kind: ServiceAccount
    name: {{ include "synctv.fullname" . }}-secret-bootstrap
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "synctv.fullname" . }}-secret-bootstrap
  labels:
    {{- include "synctv.labels" . | nindent 4 }}
    app.kubernetes.io/component: secret-bootstrap
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-20") $hookAnnotations) | nindent 4 }}
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "synctv.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: secret-bootstrap
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "synctv.fullname" . }}-secret-bootstrap
      {{- with (.Values.imagePullSecrets | default .Values.global.imagePullSecrets) }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: secret-bootstrap
          image: "{{ .Values.secretBootstrap.image.repository }}:{{ .Values.secretBootstrap.image.tag }}"
          imagePullPolicy: {{ .Values.secretBootstrap.image.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              random_alnum() {
                tr -dc 'A-Za-z0-9' </dev/urandom | head -c "$1"
              }
              random_hex() {
                od -An -N32 -tx1 /dev/urandom | tr -d ' \n'
              }
              ensure_key() {
                key="$1"
                value="$2"
                encoded_value="$(printf '%s' "$value" | base64 | tr -d '\n')"
                attempt=1

                while [ "$attempt" -le 5 ]; do
                  resource_version="$(kubectl get secret "$SECRET_NAME" -o jsonpath='{.metadata.resourceVersion}')"
                  current_value="$(kubectl get secret "$SECRET_NAME" -o "jsonpath={.data.$key}")"
                  if [ -n "$current_value" ]; then
                    return 0
                  fi

                  data="$(kubectl get secret "$SECRET_NAME" -o jsonpath='{.data}')"
                  if [ -n "$data" ]; then
                    patch="$(printf '[{"op":"test","path":"/metadata/resourceVersion","value":"%s"},{"op":"add","path":"/data/%s","value":"%s"}]' "$resource_version" "$key" "$encoded_value")"
                  else
                    patch="$(printf '[{"op":"test","path":"/metadata/resourceVersion","value":"%s"},{"op":"add","path":"/data","value":{"%s":"%s"}}]' "$resource_version" "$key" "$encoded_value")"
                  fi
                  if kubectl patch secret "$SECRET_NAME" --type=json -p="$patch" >/dev/null; then
                    echo "Initialized Secret key $key."
                    return 0
                  fi
                  attempt=$((attempt + 1))
                done

                echo "Failed to initialize Secret key $key after concurrent updates." >&2
                return 1
              }

              database_password="${DATABASE_PASSWORD:-$(random_alnum 32)}"
              jwt_secret="${JWT_SECRET:-$(random_alnum 64)}"
              cluster_secret="${CLUSTER_SECRET:-$(random_alnum 64)}"
              credential_key="${CREDENTIAL_KEY:-$(random_hex)}"
              totp_key="${TOTP_KEY:-$(random_hex)}"
              email_outbox_key="${EMAIL_OUTBOX_KEY:-$(random_hex)}"
              opaque_secret="${OPAQUE_SECRET:-$(random_alnum 64)}"
              proxy_key="${PROXY_KEY:-$(random_alnum 64)}"
              media_swarm_key="${MEDIA_SWARM_KEY:-$(random_alnum 64)}"
              provider_session_key="${PROVIDER_SESSION_KEY:-$(random_alnum 64)}"
              login_discovery_key="${LOGIN_DISCOVERY_KEY:-$(random_alnum 64)}"
              webauthn_enumeration_key="${WEBAUTHN_ENUMERATION_KEY:-$(random_alnum 64)}"
              file_upload_key="${FILE_UPLOAD_KEY:-$(random_alnum 64)}"
              root_password="${ROOT_PASSWORD:-Root$(random_alnum 20)1}"

              created=false
              if kubectl create secret generic "$SECRET_NAME"; then
                created=true
              else
                kubectl get secret "$SECRET_NAME" >/dev/null
              fi

              ensure_key SYNCTV_DATABASE_PASSWORD "$database_password"
              ensure_key SYNCTV_JWT_SECRET "$jwt_secret"
              ensure_key SYNCTV_CLUSTER_SECRET "$cluster_secret"
              ensure_key SYNCTV_SECURITY_CREDENTIAL_ENCRYPTION_KEY "$credential_key"
              ensure_key SYNCTV_SECURITY_TOTP_ENCRYPTION_KEY "$totp_key"
              ensure_key SYNCTV_SECURITY_EMAIL_OUTBOX_ENCRYPTION_KEY "$email_outbox_key"
              ensure_key SYNCTV_SECURITY_OPAQUE_SERVER_SETUP_SECRET "$opaque_secret"
              ensure_key SYNCTV_SECURITY_PROXY_SIGNING_KEY "$proxy_key"
              ensure_key SYNCTV_SECURITY_MEDIA_SWARM_SIGNING_KEY "$media_swarm_key"
              ensure_key SYNCTV_SECURITY_PROVIDER_SESSION_ENCRYPTION_KEY "$provider_session_key"
              ensure_key SYNCTV_SECURITY_LOGIN_DISCOVERY_KEY "$login_discovery_key"
              ensure_key SYNCTV_SECURITY_WEBAUTHN_ENUMERATION_KEY "$webauthn_enumeration_key"
              ensure_key SYNCTV_FILE_UPLOAD_TOKEN_SECRET "$file_upload_key"
              ensure_key SYNCTV_BOOTSTRAP_ROOT_PASSWORD "$root_password"

              if [ -n "$DATABASE_READ_URL" ]; then
                ensure_key SYNCTV_DATABASE_READ_URL "$DATABASE_READ_URL"
              fi
              case "$REDIS_MODE" in
                standard)
                  redis_password="${REDIS_PASSWORD:-$(random_alnum 32)}"
                  ensure_key SYNCTV_REDIS_PASSWORD "$redis_password"
                  ;;
                external)
                  if [ -n "$REDIS_PASSWORD" ]; then
                    ensure_key SYNCTV_REDIS_PASSWORD "$REDIS_PASSWORD"
                  fi
                  ;;
              esac
              case "$METRICS_AUTH_MODE" in
                bearer_token)
                  metrics_bearer_token="${METRICS_BEARER_TOKEN:-$(random_alnum 32)}"
                  ensure_key SYNCTV_METRICS_AUTH_BEARER_TOKEN "$metrics_bearer_token"
                  ;;
                basic)
                  metrics_basic_password="${METRICS_BASIC_PASSWORD:-$(random_alnum 32)}"
                  ensure_key SYNCTV_METRICS_AUTH_BASIC_USERNAME "$METRICS_BASIC_USERNAME"
                  ensure_key SYNCTV_METRICS_AUTH_BASIC_PASSWORD "$metrics_basic_password"
                  ;;
              esac
              if [ "$MANAGEMENT_TRANSPORT" = "tcp" ] || [ -n "$MANAGEMENT_AUTH_TOKEN" ]; then
                management_auth_token="${MANAGEMENT_AUTH_TOKEN:-$(random_alnum 32)}"
                ensure_key SYNCTV_MANAGEMENT_AUTH_TOKEN "$management_auth_token"
              fi
              if [ "$HLS_STORAGE_TYPE" = "oss" ]; then
                ensure_key SYNCTV_LIVESTREAM_HLS_STORAGE_ACCESS_KEY_ID "$HLS_ACCESS_KEY_ID"
                ensure_key SYNCTV_LIVESTREAM_HLS_STORAGE_SECRET_ACCESS_KEY "$HLS_SECRET_ACCESS_KEY"
              fi

              kubectl label secret "$SECRET_NAME" \
                app.kubernetes.io/name={{ include "synctv.name" . | quote }} \
                app.kubernetes.io/instance={{ .Release.Name | quote }} \
                app.kubernetes.io/managed-by=synctv-secret-bootstrap \
                --overwrite
              if [ "$created" = true ]; then
                echo "Created SyncTV Secret $SECRET_NAME."
              else
                echo "Reconciled SyncTV Secret $SECRET_NAME."
              fi
          env:
            - name: SECRET_NAME
              value: {{ include "synctv.secretName" . | quote }}
            - name: DATABASE_PASSWORD
              value: {{ .Values.secrets.database.password | default "" | quote }}
            - name: DATABASE_READ_URL
              value: {{ .Values.secrets.database.readUrl | default "" | quote }}
            - name: REDIS_MODE
              value: {{ include "synctv.redis.mode" . | quote }}
            - name: REDIS_PASSWORD
              value: {{ .Values.secrets.redis.password | default "" | quote }}
            - name: JWT_SECRET
              value: {{ .Values.secrets.jwt.secret | default "" | quote }}
            - name: CLUSTER_SECRET
              value: {{ .Values.secrets.cluster.grpcSecret | default "" | quote }}
            - name: CREDENTIAL_KEY
              value: {{ .Values.secrets.security.credentialEncryptionKey | default "" | quote }}
            - name: TOTP_KEY
              value: {{ .Values.secrets.security.totpEncryptionKey | default "" | quote }}
            - name: EMAIL_OUTBOX_KEY
              value: {{ .Values.secrets.security.emailOutboxEncryptionKey | default "" | quote }}
            - name: OPAQUE_SECRET
              value: {{ .Values.secrets.security.opaqueServerSetupSecret | default "" | quote }}
            - name: PROXY_KEY
              value: {{ .Values.secrets.security.proxySigningKey | default "" | quote }}
            - name: MEDIA_SWARM_KEY
              value: {{ .Values.secrets.security.mediaSwarmSigningKey | default "" | quote }}
            - name: PROVIDER_SESSION_KEY
              value: {{ .Values.secrets.security.providerSessionEncryptionKey | default "" | quote }}
            - name: LOGIN_DISCOVERY_KEY
              value: {{ .Values.secrets.security.loginDiscoveryKey | default "" | quote }}
            - name: WEBAUTHN_ENUMERATION_KEY
              value: {{ .Values.secrets.security.webauthnEnumerationKey | default "" | quote }}
            - name: FILE_UPLOAD_KEY
              value: {{ .Values.secrets.security.fileUploadTokenSecret | default "" | quote }}
            - name: ROOT_PASSWORD
              value: {{ .Values.secrets.bootstrap.rootPassword | default "" | quote }}
            - name: METRICS_AUTH_MODE
              value: {{ .Values.metrics.auth.mode | default "bearer_token" | quote }}
            - name: METRICS_BEARER_TOKEN
              value: {{ .Values.secrets.metrics.bearerToken | default "" | quote }}
            - name: METRICS_BASIC_USERNAME
              value: {{ .Values.secrets.metrics.basicUsername | default "metrics" | quote }}
            - name: METRICS_BASIC_PASSWORD
              value: {{ .Values.secrets.metrics.basicPassword | default "" | quote }}
            - name: MANAGEMENT_TRANSPORT
              value: {{ .Values.config.management.transport | default "unix" | quote }}
            - name: MANAGEMENT_AUTH_TOKEN
              value: {{ .Values.secrets.management.authToken | default "" | quote }}
            - name: HLS_STORAGE_TYPE
              value: {{ .Values.config.livestream.hlsStorage.type | default "memory" | quote }}
            - name: HLS_ACCESS_KEY_ID
              value: {{ .Values.secrets.livestream.hlsStorage.accessKeyId | default "" | quote }}
            - name: HLS_SECRET_ACCESS_KEY
              value: {{ .Values.secrets.livestream.hlsStorage.secretAccessKey | default "" | quote }}
          resources:
            {{- toYaml .Values.secretBootstrap.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
{{- end }}
