[package]
name = "synctv-cluster"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = ["k8s"]
k8s = ["kube", "k8s-openapi"]

[dependencies]
# Internal
synctv-core.workspace = true
synctv-common.workspace = true

# Async
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
futures.workspace = true

# gRPC
tonic.workspace = true
tonic-prost.workspace = true
prost.workspace = true
prost-types.workspace = true

# Redis
redis.workspace = true

# Kubernetes (in-cluster leader election & service discovery)
# Optional: only needed for k8s_dns discovery and k8s_lease leader election
kube = { workspace = true, optional = true }
k8s-openapi = { workspace = true, optional = true }

# Caching
dashmap.workspace = true
moka.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Time
chrono.workspace = true

# Utilities
anyhow.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
rand.workspace = true

# Security
subtle.workspace = true

# Resilience
failsafe.workspace = true

# Logging
tracing.workspace = true

[lints]
workspace = true

[build-dependencies]
tonic-prost-build.workspace = true
protoc-bin-vendored.workspace = true

[dev-dependencies]
criterion.workspace = true
mockall.workspace = true
synctv-core-testing.workspace = true
testcontainers.workspace = true
testcontainers-modules.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[[bench]]
name = "connection_manager_ttl_refresh"
harness = false
