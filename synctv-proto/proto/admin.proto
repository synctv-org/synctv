syntax = "proto3";

package synctv.admin;

import "proto/common.proto";

// Admin API for SyncTV - Requires admin or root permissions
//
// SECURITY: Several RPCs (CreateUser, UpdateUserPassword) transmit passwords as
// plaintext. Deployments MUST use TLS. UpdateUserPassword operations should be
// logged for audit compliance.
service AdminService {
    // =========================
    // System Settings Management
    // =========================
    rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse);
    rpc GetSettingsGroup(GetSettingsGroupRequest) returns (GetSettingsGroupResponse);
    rpc UpdateSettings(UpdateSettingsRequest) returns (UpdateSettingsResponse);
    rpc SendTestEmail(SendTestEmailRequest) returns (SendTestEmailResponse);

    // =========================
    // Media Provider Instance Management
    // =========================
    rpc ListProviderInstances(ListProviderInstancesRequest) returns (ListProviderInstancesResponse);
    rpc AddProviderInstance(AddProviderInstanceRequest) returns (AddProviderInstanceResponse);
    rpc UpdateProviderInstance(UpdateProviderInstanceRequest) returns (UpdateProviderInstanceResponse);
    rpc DeleteProviderInstance(DeleteProviderInstanceRequest) returns (DeleteProviderInstanceResponse);
    rpc ReconnectProviderInstance(ReconnectProviderInstanceRequest) returns (ReconnectProviderInstanceResponse);
    rpc EnableProviderInstance(EnableProviderInstanceRequest) returns (EnableProviderInstanceResponse);
    rpc DisableProviderInstance(DisableProviderInstanceRequest) returns (DisableProviderInstanceResponse);

    // =========================
    // User Management
    // =========================
    rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
    rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
    rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
    rpc GetUser(GetUserRequest) returns (GetUserResponse);
    rpc UpdateUserPassword(UpdateUserPasswordRequest) returns (UpdateUserPasswordResponse);
    rpc UpdateUserUsername(UpdateUserUsernameRequest) returns (UpdateUserUsernameResponse);
    rpc UpdateUserRole(UpdateUserRoleRequest) returns (UpdateUserRoleResponse);
    rpc BanUser(BanUserRequest) returns (BanUserResponse);
    rpc UnbanUser(UnbanUserRequest) returns (UnbanUserResponse);
    rpc GetUserRooms(GetUserRoomsRequest) returns (GetUserRoomsResponse);
    rpc ApproveUser(ApproveUserRequest) returns (ApproveUserResponse);

    // =========================
    // Batch Operations
    // =========================
    rpc BatchBanUsers(BatchBanUsersRequest) returns (BatchBanUsersResponse);
    rpc BatchDeleteUsers(BatchDeleteUsersRequest) returns (BatchDeleteUsersResponse);
    rpc BatchBanRooms(BatchBanRoomsRequest) returns (BatchBanRoomsResponse);
    rpc BatchDeleteRooms(BatchDeleteRoomsRequest) returns (BatchDeleteRoomsResponse);

    // =========================
    // Room Management
    // =========================
    rpc ListRooms(ListRoomsRequest) returns (ListRoomsResponse);
    rpc GetRoom(GetRoomRequest) returns (GetRoomResponse);
    rpc GetRoomSettings(GetRoomSettingsRequest) returns (GetRoomSettingsResponse);
    rpc UpdateRoomSettings(UpdateRoomSettingsRequest) returns (UpdateRoomSettingsResponse);
    rpc ResetRoomSettings(ResetRoomSettingsRequest) returns (ResetRoomSettingsResponse);
    rpc UpdateRoomPassword(UpdateRoomPasswordRequest) returns (UpdateRoomPasswordResponse);
    rpc DeleteRoom(DeleteRoomRequest) returns (DeleteRoomResponse);
    rpc BanRoom(BanRoomRequest) returns (BanRoomResponse);
    rpc UnbanRoom(UnbanRoomRequest) returns (UnbanRoomResponse);
    rpc ApproveRoom(ApproveRoomRequest) returns (ApproveRoomResponse);
    rpc GetRoomMembers(GetRoomMembersRequest) returns (GetRoomMembersResponse);

    // =========================
    // Admin Management (Root Only)
    // =========================
    rpc AddAdmin(AddAdminRequest) returns (AddAdminResponse);
    rpc RemoveAdmin(RemoveAdminRequest) returns (RemoveAdminResponse);
    rpc ListAdmins(ListAdminsRequest) returns (ListAdminsResponse);

    // =========================
    // System Statistics
    // =========================
    rpc GetSystemStats(GetSystemStatsRequest) returns (GetSystemStatsResponse);

    // =========================
    // Livestream Management
    // =========================
    rpc ListActiveStreams(ListActiveStreamsRequest) returns (ListActiveStreamsResponse);
    rpc KickStream(KickStreamRequest) returns (KickStreamResponse);
}

// =========================
// Common Types
// =========================

message AdminUser {
    string id = 1;
    string username = 2;
    string email = 3;
    synctv.common.UserRole role = 4; // RBAC role
    synctv.common.UserStatus status = 5; // Account status
    int64 created_at = 6;
    int64 updated_at = 7;
}

message AdminRoom {
    string id = 1;
    string name = 2;
    string creator_id = 3;
    string creator_username = 4;
    synctv.common.RoomStatus status = 5; // Room lifecycle status (Active/Pending/Closed)
    bytes settings = 6;
    int32 member_count = 7;
    int64 created_at = 8;
    int64 updated_at = 9;
    string description = 10; // Room description
    bool is_banned = 11; // Ban flag set by global admin only
}

// Connection status for a media provider instance
enum ProviderInstanceStatus {
    PROVIDER_INSTANCE_STATUS_UNSPECIFIED = 0;
    PROVIDER_INSTANCE_STATUS_CONNECTED = 1;
    PROVIDER_INSTANCE_STATUS_DISCONNECTED = 2;
    PROVIDER_INSTANCE_STATUS_ERROR = 3;
}

message ProviderInstance {
    string name = 1; // Instance name (primary key)
    string endpoint = 2; // gRPC service endpoint
    string comment = 3; // Human-readable description
    uint32 timeout_seconds = 4; // Request timeout in seconds
    bool tls = 5; // Enable TLS
    bool insecure_tls = 6; // Skip TLS certificate verification (UNSAFE, dev/test only)
    repeated string providers = 7; // Supported media provider types (e.g., ["bilibili", "alist", "emby"])
    bool enabled = 8; // Whether this instance is enabled
    ProviderInstanceStatus status = 9; // Connection status
    int64 created_at = 10;
    int64 updated_at = 11;
}

message SettingsGroup {
    string name = 1;
    bytes settings = 2; // JSON settings
}

// =========================
// Settings Management
// =========================

message GetSettingsRequest {}

message GetSettingsResponse {
    repeated SettingsGroup groups = 1;
}

message GetSettingsGroupRequest {
    string group = 1; // e.g., "server", "email", "oauth"
}

message GetSettingsGroupResponse {
    SettingsGroup group = 1;
}

message UpdateSettingsRequest {
    string group = 1;
    map<string, string> settings = 2;
}

message UpdateSettingsResponse {
    // Empty response - success is indicated by no error
}

message SendTestEmailRequest {
    string to = 1;
}

message SendTestEmailResponse {
    bool success = 1;
    string message = 2;
}

// =========================
// Media Provider Instance Management
// =========================

message ListProviderInstancesRequest {
    int32 page = 1;
    int32 page_size = 2;
    string provider_type = 3; // Optional filter by media provider type
    string search = 4;
    optional bool enabled = 5;
    optional bool tls = 6;
    ProviderInstanceListSortBy sort_by = 7;
    SortDirection sort_direction = 8;
}

message ListProviderInstancesResponse {
    repeated ProviderInstance instances = 1;
}

message AddProviderInstanceRequest {
    string name = 1; // Instance name (unique identifier)
    string endpoint = 2; // gRPC service endpoint
    string comment = 3; // Optional description
    uint32 timeout_seconds = 4; // Request timeout in seconds
    bool tls = 5; // Enable TLS
    bool insecure_tls = 6; // Skip TLS certificate verification
    repeated string providers = 7; // Supported media provider types
    bytes config = 8; // Additional JSON config (jwt_secret, custom_ca, etc.)
}

message AddProviderInstanceResponse {
    ProviderInstance instance = 1;
}

message UpdateProviderInstanceRequest {
    string name = 1; // Instance name (cannot be changed)
    optional string endpoint = 2; // New endpoint
    optional string comment = 3; // New description
    optional uint32 timeout_seconds = 4; // New timeout in seconds
    optional bool tls = 5; // New TLS setting
    optional bool insecure_tls = 6; // New insecure_tls setting
    repeated string providers = 7; // New media provider list (empty = no change)
    bytes config = 8; // Additional config
}

message UpdateProviderInstanceResponse {
    ProviderInstance instance = 1;
}

message DeleteProviderInstanceRequest {
    string name = 1; // Instance name
}

message DeleteProviderInstanceResponse {
    bool success = 1;
}

message ReconnectProviderInstanceRequest {
    string name = 1; // Instance name
}

message ReconnectProviderInstanceResponse {
    ProviderInstance instance = 1;
}

message EnableProviderInstanceRequest {
    string name = 1; // Instance name
}

message EnableProviderInstanceResponse {
    ProviderInstance instance = 1;
}

message DisableProviderInstanceRequest {
    string name = 1; // Instance name
}

message DisableProviderInstanceResponse {
    ProviderInstance instance = 1;
}

// =========================
// User Management
// =========================

// SECURITY: password is transmitted as plaintext. TLS MUST be used.
message CreateUserRequest {
    string username = 1; // Validation: min 3, max 32 chars, pattern: [\p{L}\p{N}_-]+
    string password = 2; // SECURITY: Plaintext credential - requires TLS in transit. Validation: min 8, max 128 chars
    string email = 3; // Validation: max 254 chars, email format when non-empty
    synctv.common.UserRole role = 4; // Default: USER_ROLE_USER
    synctv.common.UserStatus status = 5; // Optional explicit initial status
}

message CreateUserResponse {
    AdminUser user = 1;
}

message DeleteUserRequest {
    string user_id = 1;
}

message DeleteUserResponse {
    bool success = 1;
}

message ListUsersRequest {
    int32 page = 1; // Validation: >= 1
    int32 page_size = 2; // Validation: max 100, default 20
    synctv.common.UserStatus status = 3; // Optional filter (UNSPECIFIED = show all)
    synctv.common.UserRole role = 4; // Optional filter (UNSPECIFIED = show all)
    string search = 5; // Search by username or email
    UserListSortBy sort_by = 6;
    SortDirection sort_direction = 7;
}

message ListUsersResponse {
    repeated AdminUser users = 1;
    int32 total = 2;
}

message GetUserRequest {
    string user_id = 1;
}

message GetUserResponse {
    AdminUser user = 1;
}

// SECURITY: Admin password reset is a privileged operation. The reason field
// provides an audit trail for compliance.
message UpdateUserPasswordRequest {
    string user_id = 1; // Validation: required
    string new_password = 2;   // SECURITY: Plaintext credential - requires TLS in transit. Validation: min 8, max 128 chars
    string reason = 3;         // Audit trail: why the password was reset. Validation: max 500 chars
}

message UpdateUserPasswordResponse {
    bool success = 1;
}

message UpdateUserUsernameRequest {
    string user_id = 1; // Validation: required
    string new_username = 2; // Validation: min 3, max 32 chars, pattern: [\p{L}\p{N}_-]+
}

message UpdateUserUsernameResponse {
    AdminUser user = 1;
}

message UpdateUserRoleRequest {
    string user_id = 1;
    synctv.common.UserRole role = 2; // New role
}

message UpdateUserRoleResponse {
    AdminUser user = 1;
}

message BanUserRequest {
    string user_id = 1;
    string reason = 2; // Optional
}

message BanUserResponse {
    AdminUser user = 1;
}

message UnbanUserRequest {
    string user_id = 1;
}

message UnbanUserResponse {
    AdminUser user = 1;
}

message GetUserRoomsRequest {
    string user_id = 1; // Validation: required
    int32 page = 2;       // Page number (default 1). Validation: >= 1
    int32 page_size = 3;  // Items per page (default 50). Validation: max 100
    synctv.common.RoomStatus status = 4;
    string search = 5;
    optional bool is_banned = 6;
    RoomListSortBy sort_by = 7;
    SortDirection sort_direction = 8;
}

message GetUserRoomsResponse {
    repeated AdminRoom rooms = 1;
    int32 total = 2; // Total number of rooms for this user
}

enum SortDirection {
    SORT_DIRECTION_UNSPECIFIED = 0;
    SORT_DIRECTION_ASC = 1;
    SORT_DIRECTION_DESC = 2;
}

enum UserListSortBy {
    USER_LIST_SORT_BY_UNSPECIFIED = 0;
    USER_LIST_SORT_BY_CREATED_AT = 1;
    USER_LIST_SORT_BY_UPDATED_AT = 2;
    USER_LIST_SORT_BY_USERNAME = 3;
    USER_LIST_SORT_BY_EMAIL = 4;
    USER_LIST_SORT_BY_STATUS = 5;
    USER_LIST_SORT_BY_ROLE = 6;
}

enum RoomListSortBy {
    ROOM_LIST_SORT_BY_UNSPECIFIED = 0;
    ROOM_LIST_SORT_BY_CREATED_AT = 1;
    ROOM_LIST_SORT_BY_UPDATED_AT = 2;
    ROOM_LIST_SORT_BY_LAST_ACTIVITY_AT = 3;
    ROOM_LIST_SORT_BY_NAME = 4;
}

enum RoomMemberListSortBy {
    ROOM_MEMBER_LIST_SORT_BY_UNSPECIFIED = 0;
    ROOM_MEMBER_LIST_SORT_BY_JOINED_AT = 1;
    ROOM_MEMBER_LIST_SORT_BY_USERNAME = 2;
    ROOM_MEMBER_LIST_SORT_BY_ROLE = 3;
    ROOM_MEMBER_LIST_SORT_BY_STATUS = 4;
}

enum ProviderInstanceListSortBy {
    PROVIDER_INSTANCE_LIST_SORT_BY_UNSPECIFIED = 0;
    PROVIDER_INSTANCE_LIST_SORT_BY_NAME = 1;
    PROVIDER_INSTANCE_LIST_SORT_BY_ENDPOINT = 2;
    PROVIDER_INSTANCE_LIST_SORT_BY_CREATED_AT = 3;
    PROVIDER_INSTANCE_LIST_SORT_BY_UPDATED_AT = 4;
}

enum ActiveStreamListSortBy {
    ACTIVE_STREAM_LIST_SORT_BY_UNSPECIFIED = 0;
    ACTIVE_STREAM_LIST_SORT_BY_STARTED_AT = 1;
    ACTIVE_STREAM_LIST_SORT_BY_ROOM_ID = 2;
    ACTIVE_STREAM_LIST_SORT_BY_MEDIA_ID = 3;
    ACTIVE_STREAM_LIST_SORT_BY_USER_ID = 4;
    ACTIVE_STREAM_LIST_SORT_BY_NODE_ID = 5;
}

message ApproveUserRequest {
    string user_id = 1;
}

message ApproveUserResponse {
    AdminUser user = 1;
}

// =========================
// Room Management
// =========================

message ListRoomsRequest {
    int32 page = 1; // Validation: >= 1
    int32 page_size = 2; // Validation: max 100, default 20
    synctv.common.RoomStatus status = 3; // Optional filter: active, closed, pending (use is_banned for ban filter)
    string search = 4; // Search by name
    string creator_id = 5; // Optional filter by creator
    optional bool is_banned = 6; // Optional filter by ban status (true = banned only, false = not banned, absent = all)
    RoomListSortBy sort_by = 7;
    SortDirection sort_direction = 8;
}

message ListRoomsResponse {
    repeated AdminRoom rooms = 1;
    int32 total = 2;
}

message GetRoomRequest {
    string room_id = 1;
}

message GetRoomResponse {
    AdminRoom room = 1;
}

message GetRoomSettingsRequest {
    string room_id = 1;
}

message GetRoomSettingsResponse {
    bytes settings = 1; // JSON settings
}

message UpdateRoomSettingsRequest {
    string room_id = 1;
    bytes settings = 2; // JSON settings
}

message UpdateRoomSettingsResponse {
    AdminRoom room = 1;
}

message ResetRoomSettingsRequest {
    string room_id = 1;
}

message ResetRoomSettingsResponse {
    AdminRoom room = 1;
}

message UpdateRoomPasswordRequest {
    string room_id = 1;
    string new_password = 2; // Empty to remove password. SECURITY: Plaintext - requires TLS.
}

message UpdateRoomPasswordResponse {
    bool success = 1;
}

message DeleteRoomRequest {
    string room_id = 1;
}

message DeleteRoomResponse {
    bool success = 1;
}

message BanRoomRequest {
    string room_id = 1;
    string reason = 2; // Optional
}

message BanRoomResponse {
    AdminRoom room = 1;
}

message UnbanRoomRequest {
    string room_id = 1;
}

message UnbanRoomResponse {
    AdminRoom room = 1;
}

message ApproveRoomRequest {
    string room_id = 1;
}

message ApproveRoomResponse {
    AdminRoom room = 1;
}

message GetRoomMembersRequest {
    string room_id = 1; // Validation: required
    int32 page = 2;      // Page number (default 1). Validation: >= 1
    int32 page_size = 3;  // Items per page (default 50). Validation: max 100
    string search = 4;
    synctv.common.RoomMemberRole role = 5;
    synctv.common.MemberStatus status = 6;
    RoomMemberListSortBy sort_by = 7;
    SortDirection sort_direction = 8;
}

message GetRoomMembersResponse {
    repeated synctv.common.RoomMember members = 1;
    int32 total = 2;
}

// =========================
// Admin Management (Root Only)
// =========================

message AddAdminRequest {
    string user_id = 1;
}

message AddAdminResponse {
    AdminUser user = 1;
}

message RemoveAdminRequest {
    string user_id = 1;
}

message RemoveAdminResponse {
    bool success = 1;
}

message ListAdminsRequest {
    int32 page = 1;
    int32 page_size = 2;
    string search = 3;
    UserListSortBy sort_by = 4;
    SortDirection sort_direction = 5;
}

message ListAdminsResponse {
    repeated AdminUser admins = 1;
}

// =========================
// System Statistics
// =========================

message GetSystemStatsRequest {}

message GetSystemStatsResponse {
    int32 total_users = 1;
    int32 active_users = 2;
    int32 banned_users = 3;
    int32 total_rooms = 4;
    int32 active_rooms = 5;
    int32 banned_rooms = 6;
    int32 total_media = 7;
    int32 provider_instances = 8; // Total media provider instances
    bytes additional_stats = 9; // JSON for extensibility
}

// =========================
// Livestream Management
// =========================

message ListActiveStreamsRequest {
    int32 page = 1;
    int32 page_size = 2;
    string room_id = 3; // optional filter by room
    string user_id = 4;
    string node_id = 5;
    string search = 6;
    ActiveStreamListSortBy sort_by = 7;
    SortDirection sort_direction = 8;
}

message ActiveStreamInfo {
    string room_id = 1;
    string media_id = 2;
    string user_id = 3;
    string node_id = 4;
    int64 started_at = 5; // Unix epoch timestamp
}

message ListActiveStreamsResponse {
    repeated ActiveStreamInfo streams = 1;
}

message KickStreamRequest {
    string room_id = 1;
    string media_id = 2;
    string reason = 3;
}

message KickStreamResponse {}

// =========================
// Batch Operations
// =========================

// Batch result for a single item
message BatchResultItem {
    string id = 1;          // User ID or Room ID
    bool success = 2;       // Whether the operation succeeded
    string error = 3;       // Error message if success is false
}

// Batch ban users request
message BatchBanUsersRequest {
    repeated string user_ids = 1; // Max 100 items. Validation: max 100
    string reason = 2;            // Optional reason for the ban
}

// Batch ban users response
message BatchBanUsersResponse {
    repeated BatchResultItem results = 1; // Per-user results
    int32 succeeded = 2;                   // Count of successful operations
    int32 failed = 3;                      // Count of failed operations
}

// Batch delete users request
message BatchDeleteUsersRequest {
    repeated string user_ids = 1; // Max 100 items. Validation: max 100
}

// Batch delete users response
message BatchDeleteUsersResponse {
    repeated BatchResultItem results = 1; // Per-user results
    int32 succeeded = 2;                   // Count of successful operations
    int32 failed = 3;                      // Count of failed operations
}

// Batch ban rooms request
message BatchBanRoomsRequest {
    repeated string room_ids = 1; // Max 100 items. Validation: max 100
    string reason = 2;            // Optional reason for the ban
}

// Batch ban rooms response
message BatchBanRoomsResponse {
    repeated BatchResultItem results = 1; // Per-room results
    int32 succeeded = 2;                   // Count of successful operations
    int32 failed = 3;                      // Count of failed operations
}

// Batch delete rooms request
message BatchDeleteRoomsRequest {
    repeated string room_ids = 1; // Max 100 items. Validation: max 100
}

// Batch delete rooms response
message BatchDeleteRoomsResponse {
    repeated BatchResultItem results = 1; // Per-room results
    int32 succeeded = 2;                   // Count of successful operations
    int32 failed = 3;                      // Count of failed operations
}
