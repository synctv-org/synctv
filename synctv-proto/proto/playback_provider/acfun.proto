syntax = "proto3";

package synctv.playback_provider.acfun;

import "proto/buf/validate/validate.proto";
import "proto/playback_provider/common.proto";

message GetAcFunResourceRequest {
  string version = 1 [(buf.validate.field).string.min_len = 1];
  string mode_name = 2 [(buf.validate.field).string.min_len = 1];
  uint32 media_index = 3;
  string sig = 4 [(buf.validate.field).string.min_len = 1];
  string uid = 5 [(buf.validate.field).string.min_len = 1];
  string rid = 6 [(buf.validate.field).string.min_len = 1];
  int64 exp = 7;
  optional string range = 8;
  bool head = 9;
}

message AcFunResourceResponse {
  synctv.playback_provider.common.StreamChunk chunk = 1;
}

enum AcFunHlsResourceKind {
  AC_FUN_HLS_RESOURCE_KIND_UNSPECIFIED = 0;
  AC_FUN_HLS_RESOURCE_KIND_MEDIA = 1;
  AC_FUN_HLS_RESOURCE_KIND_MANIFEST = 2;
}

message GetAcFunHlsResourceRequest {
  string version = 1 [(buf.validate.field).string.min_len = 1];
  string target_url = 2 [(buf.validate.field).string.min_len = 1];
  string sig = 3 [(buf.validate.field).string.min_len = 1];
  string uid = 4 [(buf.validate.field).string.min_len = 1];
  string rid = 5 [(buf.validate.field).string.min_len = 1];
  int64 exp = 6;
  optional string range = 7;
  bool head = 8;
  string mode_name = 9 [(buf.validate.field).string.min_len = 1];
  uint32 media_index = 10;
  AcFunHlsResourceKind resource_kind = 11 [(buf.validate.field).enum.defined_only = true];
}

message AcFunHlsResourceResponse {
  synctv.playback_provider.common.StreamChunk chunk = 1;
}

message GetAcFunDanmakuFileRequest {
  string version = 1 [(buf.validate.field).string.min_len = 1];
  string mode_name = 2 [(buf.validate.field).string.min_len = 1];
  uint32 media_index = 3;
  string sig = 4 [(buf.validate.field).string.min_len = 1];
  string uid = 5 [(buf.validate.field).string.min_len = 1];
  string rid = 6 [(buf.validate.field).string.min_len = 1];
  int64 exp = 7;
  bool head = 8;
}

message AcFunDanmakuFileResponse {
  synctv.playback_provider.common.StreamChunk chunk = 1;
}

message WatchAcFunDanmakuRequest {
  string version = 1 [(buf.validate.field).string.min_len = 1];
  string mode_name = 2 [(buf.validate.field).string.min_len = 1];
  uint32 media_index = 3;
  string sig = 4 [(buf.validate.field).string.min_len = 1];
  string uid = 5 [(buf.validate.field).string.min_len = 1];
  string rid = 6 [(buf.validate.field).string.min_len = 1];
  int64 exp = 7;
}

message AcFunDanmakuEvent {
  string id = 1;
  string user_id = 2;
  string user_name = 3;
  optional string avatar_url = 4;
  string text = 5;
  optional string color = 6;
  optional string badge_name = 7;
  optional uint32 badge_level = 8;
  optional uint64 sent_at_ms = 9;
}

service AcFunPlaybackProviderService {
  rpc GetResource(GetAcFunResourceRequest) returns (stream AcFunResourceResponse);
  rpc GetHlsResource(GetAcFunHlsResourceRequest) returns (stream AcFunHlsResourceResponse);
  rpc GetDanmakuFile(GetAcFunDanmakuFileRequest) returns (stream AcFunDanmakuFileResponse);
  rpc WatchDanmaku(WatchAcFunDanmakuRequest) returns (stream AcFunDanmakuEvent);
}
