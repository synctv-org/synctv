syntax = "proto3";

package synctv.playback_provider.tiktok;

import "proto/buf/validate/validate.proto";
import "proto/playback_provider/common.proto";

message GetTikTokResourceRequest {
  string version = 1 [(buf.validate.field).string.min_len = 1];
  string mode_name = 2 [(buf.validate.field).string.min_len = 1];
  uint32 media_index = 3;
  string sig = 4 [(buf.validate.field).string.min_len = 1];
  string uid = 5 [(buf.validate.field).string.min_len = 1];
  string rid = 6 [(buf.validate.field).string.min_len = 1];
  int64 exp = 7;
  optional string range = 8;
  bool head = 9;
}

message TikTokResourceResponse {
  synctv.playback_provider.common.StreamChunk chunk = 1;
}

enum TikTokHlsResourceKind {
  TIK_TOK_HLS_RESOURCE_KIND_UNSPECIFIED = 0;
  TIK_TOK_HLS_RESOURCE_KIND_MEDIA = 1;
  TIK_TOK_HLS_RESOURCE_KIND_MANIFEST = 2;
}

message GetTikTokHlsResourceRequest {
  string version = 1 [(buf.validate.field).string.min_len = 1];
  string target_url = 2 [(buf.validate.field).string.min_len = 1];
  string sig = 3 [(buf.validate.field).string.min_len = 1];
  string uid = 4 [(buf.validate.field).string.min_len = 1];
  string rid = 5 [(buf.validate.field).string.min_len = 1];
  int64 exp = 6;
  optional string range = 7;
  bool head = 8;
  string mode_name = 9 [(buf.validate.field).string.min_len = 1];
  uint32 media_index = 10;
  TikTokHlsResourceKind resource_kind = 11 [(buf.validate.field).enum.defined_only = true];
}

message TikTokHlsResourceResponse {
  synctv.playback_provider.common.StreamChunk chunk = 1;
}

message GetTikTokSubtitleRequest {
  string version = 1 [(buf.validate.field).string.min_len = 1];
  string mode_name = 2 [(buf.validate.field).string.min_len = 1];
  uint32 subtitle_index = 3;
  string sig = 4 [(buf.validate.field).string.min_len = 1];
  string uid = 5 [(buf.validate.field).string.min_len = 1];
  string rid = 6 [(buf.validate.field).string.min_len = 1];
  int64 exp = 7;
  optional string range = 8;
  bool head = 9;
}

message TikTokSubtitleResponse {
  synctv.playback_provider.common.StreamChunk chunk = 1;
}

service TikTokPlaybackProviderService {
  rpc GetResource(GetTikTokResourceRequest) returns (stream TikTokResourceResponse);
  rpc GetHlsResource(GetTikTokHlsResourceRequest) returns (stream TikTokHlsResourceResponse);
  rpc GetSubtitle(GetTikTokSubtitleRequest) returns (stream TikTokSubtitleResponse);
}
