// Alist Provider Client API
//
// This is the client-facing gRPC API for Alist provider
//
// SECURITY: Login transmits credentials (password or hashed_password) as plaintext
// in the protobuf payload. Deployments MUST use TLS for all connections to this service.

syntax = "proto3";

package synctv.provider.alist;

// Alist Provider Service
//
// Client-facing API for Alist network storage access
service AlistProviderService {
  // Login to Alist server (persist credential)
  rpc Login(LoginRequest) returns (LoginResponse);

  // List directory contents (uses stored credential via server_id)
  rpc List(ListRequest) returns (ListResponse);

  // Get current user info (uses stored credential via server_id)
  rpc GetMe(GetMeRequest) returns (GetMeResponse);

  // Logout from Alist (delete stored credential)
  rpc Logout(LogoutRequest) returns (LogoutResponse);

  // Get saved credentials (binds)
  rpc GetBinds(GetBindsRequest) returns (GetBindsResponse);
}

// Login request
// SECURITY: Prefer hashed_password over password when possible to reduce plaintext exposure.
message LoginRequest {
  string host = 1;
  string username = 2;
  string password = 3; // SECURITY: Plaintext credential - requires TLS in transit. Prefer hashed_password.
  string hashed_password = 4; // Hashed password (if provided, password is ignored)
  string instance_name = 5; // Optional provider instance name
}

// Login response
message LoginResponse {
  string token = 1;
  string server_id = 2; // SHA-256(host) identifier for stored credential
}

// List directory request
message ListRequest {
  string server_id = 1;    // Stored credential identifier
  string path = 2;
  string password = 3; // Directory password (optional)
  uint64 page = 4;
  uint64 per_page = 5;
  bool refresh = 6;
  string instance_name = 7; // Optional provider instance name
}

// List directory response
message ListResponse {
  repeated FileItem content = 1;
  uint64 total = 2;
}

// File/directory item
message FileItem {
  string name = 1;
  uint64 size = 2;
  bool is_dir = 3;
  uint64 modified = 4;
  string sign = 5;
  string thumb = 6;
  uint64 type = 7;
}

// Get user info request
message GetMeRequest {
  string server_id = 1;    // Stored credential identifier
  string instance_name = 2; // Optional provider instance name
}

// Get user info response
message GetMeResponse {
  string username = 1;
  string base_path = 2;
}

// Logout request
message LogoutRequest {
  string server_id = 1;     // Which credential to unbind
  string instance_name = 2; // Optional provider instance name
}

// Logout response
message LogoutResponse {
  string message = 1;
}

// Get binds request
message GetBindsRequest {
  string instance_name = 1; // Optional provider instance name
}

// Get binds response
message GetBindsResponse {
  repeated BindInfo binds = 1;
}

// Saved credential information
message BindInfo {
  string id = 1;
  string host = 2;
  string username = 3;
  int64 created_at = 4; // Unix epoch timestamp
}
