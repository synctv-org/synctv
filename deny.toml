[advisories]
unmaintained = "all"
unsound = "all"
yanked = "warn"
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa 0.9.10 (jsonwebtoken 11 and direct provider use) has no patched 0.9.x release - the fix (>=0.10.0) covers the final 0.10 line only; moving to 0.10 is blocked because crypto-glue 0.2.2 (webauthn-rs, latest upstream) still requires the rc-only rsa `sha2` feature and cannot unify with jsonwebtoken 12's rsa ^0.10, so the webauthn chain keeps an rc copy that the advisory flags on version ordering alone - drop this ignore once crypto-glue ships on rsa 0.10 final and jsonwebtoken can be bumped to 12" },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml is only reached through the intentionally pinned serde_yaml and has no maintained drop-in replacement" },
    { id = "RUSTSEC-2025-0141", reason = "bincode 2 is still required by the on-disk cache format and the advisory is maintenance-only with no fixed successor release" },
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 is reached via elliptic-curve 0.13.8 through both p256 0.13 (jsonwebtoken 11 chain) and opaque-ke 4.1.0-pre.2 -> voprf 0.5; the fix (>=0.7.6) needs elliptic-curve 0.14 on every chain, which is blocked by crypto-glue (see RUSTSEC-2023-0071) and by opaque-ke having no release on elliptic-curve 0.14, and the timing side channel requires co-located measurement of the OPAQUE/JWT operations - drop this ignore when both chains move to elliptic-curve >=0.14" },
    { id = "RUSTSEC-2026-0440", reason = "astral-tokio-tar is unmaintained with no safe upgrade; dev-only chain through testcontainers 0.27 (testcontainers-modules 0.15 still requires ^0.27) - drop this ignore when testcontainers moves off the crate" },
    { id = "RUSTSEC-2026-0542", reason = "humantime is unmaintained with no safe upgrade; used only for duration formatting - drop this ignore when the workspace migrates to a maintained formatter" },
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained with no fixed successor release; used pervasively for wall-clock timestamps and also pulled in transitively (cel, codegen) - drop this ignore when the workspace migrates to jiff or time" },
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz is unmaintained with no safe upgrade (announced alongside chrono); timezone database for chrono - drop together with RUSTSEC-2026-0543" },
]

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "OpenSSL",
    "NCSA",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "allow"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
