}

// Playback Control Messages
// Note: room_id extracted from x-room-id metadata
// Client -> Server: Real-time playback control commands (sent via WebSocket)
// Server broadcasts playback state changes to all room members via ServerMessage.PlaybackStateChanged

enum PlaybackUpdateType {
    PLAYBACK_UPDATE_TYPE_UNSPECIFIED = 0;
    PLAYBACK_UPDATE_TYPE_PLAY = 1;
    PLAYBACK_UPDATE_TYPE_PAUSE = 2;
    PLAYBACK_UPDATE_TYPE_SEEK = 3;
    PLAYBACK_UPDATE_TYPE_SPEED = 4;
}

message UpdatePlayback {
    option (buf.validate.message).cel = {
        id: "update_playback.type_required"
        message: "playback update type is required"
        expression: "this.type != 0"
    };
    PlaybackUpdateType type = 1 [(buf.validate.field).enum.defined_only = true];
    optional bool playing = 2;
    optional double position = 3;
    optional double speed = 4;
    optional int64 version = 5;
}

enum PlaybackDeliveryPreference {
    PLAYBACK_DELIVERY_PREFERENCE_UNSPECIFIED = 0;
    PLAYBACK_DELIVERY_PREFERENCE_AUTO = 1;
    PLAYBACK_DELIVERY_PREFERENCE_DIRECT_PLAY = 2;
    PLAYBACK_DELIVERY_PREFERENCE_TRANSCODE = 3;
}

enum PlaybackSubtitlePreference {
    PLAYBACK_SUBTITLE_PREFERENCE_UNSPECIFIED = 0;
    PLAYBACK_SUBTITLE_PREFERENCE_EXTERNAL = 1;
    PLAYBACK_SUBTITLE_PREFERENCE_EMBEDDED_OR_EXTERNAL = 2;
    PLAYBACK_SUBTITLE_PREFERENCE_NONE = 3;
}

enum PlaybackVideoCodec {
    PLAYBACK_VIDEO_CODEC_UNSPECIFIED = 0;
    PLAYBACK_VIDEO_CODEC_H264 = 1;
    PLAYBACK_VIDEO_CODEC_HEVC = 2;
    PLAYBACK_VIDEO_CODEC_VP9 = 3;
    PLAYBACK_VIDEO_CODEC_AV1 = 4;
}

enum PlaybackContainer {
    PLAYBACK_CONTAINER_UNSPECIFIED = 0;
    PLAYBACK_CONTAINER_MP4 = 1;
    PLAYBACK_CONTAINER_MKV = 2;
    PLAYBACK_CONTAINER_WEBM = 3;
}

enum PlaybackAudioCapability {
    PLAYBACK_AUDIO_CAPABILITY_UNSPECIFIED = 0;
    PLAYBACK_AUDIO_CAPABILITY_STEREO = 1;
    PLAYBACK_AUDIO_CAPABILITY_SURROUND = 2;
    PLAYBACK_AUDIO_CAPABILITY_LOSSLESS_SURROUND = 3;
}

message PlaybackClientProfile {
    PlaybackDeliveryPreference delivery_preference = 1 [(buf.validate.field).enum.defined_only = true];
    optional int64 max_streaming_bitrate = 2 [(buf.validate.field).int64.gt = 0];
    optional int32 max_audio_channels = 3 [(buf.validate.field).int32.gt = 0];
    repeated PlaybackVideoCodec supported_video_codecs = 4 [(buf.validate.field).repeated.items.enum.defined_only = true];
    repeated PlaybackContainer supported_containers = 5 [(buf.validate.field).repeated.items.enum.defined_only = true];
    PlaybackAudioCapability audio_capability = 6 [(buf.validate.field).enum.defined_only = true];
    PlaybackSubtitlePreference subtitle_preference = 7 [(buf.validate.field).enum.defined_only = true];
}

message GetPlaybackRequest {
    PlaybackClientProfile playback_client_profile = 1;
}

message GetPlaybackResponse {
    // Playback state (current time, speed, is_playing, etc.)
    PlaybackState playback_state = 1;
    // Versioned playback snapshot for the current source.
    PlaybackSnapshot playback_snapshot = 2;
}

// ==================== Playback Information Structures ====================

// Versioned playback information for the current source.
message PlaybackSnapshot {
    string media_id = 1; // Media ID
    string playlist_id = 2; // Playlist ID
    string room_id = 3; // Room ID
    string name = 4; // Media name
    double position = 5; // Order position in playlist

    // Multiple playback modes (e.g., "direct", "proxied", "cdn1", "cdn2")
    // Provider can define arbitrary mode names
    map<string, PlaybackInfo> playback_infos = 6;

    // Default mode name (must be a key in playback_infos)
    string default_mode = 7;

    // Media-level metadata (duration, thumbnail, title, author, etc.)
    map<string, string> metadata = 8;
    // Version scoped to playback snapshots.
    string version = 9;
    // Earliest URL expiration across the snapshot, if any.
    optional int64 expires_at = 10;
}

// Playback information for a single mode
message PlaybackInfo {
    // List of playback URLs (different qualities, codecs)
    repeated PlaybackUrl urls = 1;

    // Default URL index
    int32 default_url_index = 2;

    // Subtitle list
    repeated Subtitle subtitles = 3;

    // Default subtitle index (optional)
    optional int32 default_subtitle_index = 4;

    // Danmaku list
    repeated Danmaku danmakus = 5;

    // Format type (e.g., "m3u8", "mp4", "flv")
    string format = 6;
}

// Playback URL (represents a quality/codec option)
message PlaybackUrl {
    // Display name (e.g., "1080P", "HEVC 4K", "720P")
    string name = 1;

    // Complete URL
    string url = 2;

    // Request headers (if needed)
    map<string, string> headers = 3;

    // Expiration time (Unix timestamp, optional)
    optional int64 expire_at = 4;

    // URL-level metadata (resolution, codec, bitrate, fps, etc.)
    optional PlaybackUrlMetadata metadata = 5;
}

// URL-level metadata
message PlaybackUrlMetadata {
    // Resolution (e.g., "1920x1080", "1280x720")
    optional string resolution = 1;

    // Bitrate in bps
    optional int64 bitrate = 2;

    // Video codec (e.g., "avc", "hevc", "av1")
    optional string codec = 3;

    // Frame rate
    optional int32 fps = 4;

    // Additional metadata
    map<string, string> extra = 5;
}

// Subtitle information
message Subtitle {
    // Display name (e.g., "Chinese (Simplified)", "English")
    string name = 1;

    // Language code (e.g., "zh-CN", "en-US")
    string language = 2;

    // Subtitle URL list (multiple sources/formats)
    repeated SubtitleUrl urls = 3;

    // Default URL index
    int32 default_url_index = 4;
}

// Subtitle URL
message SubtitleUrl {
    // Display name (e.g., "Original", "AI Translation")
    string name = 1;

    // Subtitle file URL
    string url = 2;

    // Request headers (if needed)
    map<string, string> headers = 3;

    // Format (e.g., "json", "srt", "vtt")
    string format = 4;
}

// Danmaku (bullet comments) information
message Danmaku {
    // Display name (e.g., "Bilibili Danmaku", "Local Danmaku")
    string name = 1;

    // Danmaku API URL or file URL
    string url = 2;

    // Format type (e.g., "bilibili", "ass", "xml")
    optional string format = 3;

    // Request headers (if needed)
    map<string, string> headers = 4;
}

// Real-time Messaging
message ClientMessage {
    oneof message {
        ChatMessageSend chat = 1;
        HeartbeatMessage heartbeat = 2;
        // Playback progress heartbeat: client periodically reports current position
        PlaybackProgressReport playback_progress = 3;
        // Playback state update command (real-time)
        UpdatePlayback playback_update = 4;
        ObserveResource observe_resource = 5;
        UnobserveResource unobserve_resource = 6;
        // WebRTC signaling messages (P2P and SFU modes)
        WebRTCOffer webrtc_offer = 7;
        WebRTCAnswer webrtc_answer = 8;
        WebRTCIceCandidate webrtc_ice_candidate = 9;
        WebRTCJoin webrtc_join = 10;
        WebRTCLeave webrtc_leave = 11;
        // SFU migration: client responds to server's migration offer
        SfuMigrationAnswer sfu_migration_answer = 12;
    }
}

enum ResourceDeliveryMode {
    RESOURCE_DELIVERY_MODE_UNSPECIFIED = 0;
    RESOURCE_DELIVERY_MODE_NOTIFY_ONLY = 1;
    RESOURCE_DELIVERY_MODE_PUSH_SNAPSHOT = 2;
}

message ObserveResource {
    string observe_id = 1 [(buf.validate.field).string = {
        min_len: 1,
        max_len: 128
    }];
    // Empty means the client has no local version yet.
    string version = 2;
    ResourceDeliveryMode delivery_mode = 3 [(buf.validate.field).enum.defined_only = true];
    oneof resource {
        ObservePlaybackState playback_state = 4;
        ObservePlaybackSnapshot playback_snapshot = 5;
        ObserveRoomSettings room_settings = 6;
        ObservePlaylistItems playlist_items = 7;
        ObserveRoomMembers room_members = 8;
    }
}

message UnobserveResource {
    string observe_id = 1 [(buf.validate.field).string = {
        min_len: 1,
        max_len: 128
    }];
}

message ObservePlaybackState {}

message ObservePlaybackSnapshot {
    // Client-side cached playback source identity. Used together with `version`
    // so reconnects don't suppress required refreshes when the source changed
    // but the DB-derived version collided.
    string media_id = 1;
    string playlist_id = 2;
    bytes target = 3;
    PlaybackClientProfile playback_client_profile = 4;
}

message ObserveRoomSettings {}

message ObservePlaylistItems {
    ListPlaylistItemsRequest request = 1;
}

message ObserveRoomMembers {
    GetRoomMembersRequest request = 1;
}

// Client -> Server: periodic playback progress heartbeat
// Sent every few seconds by clients that are actively playing media.
// The server uses these reports to track actual client playback positions,
// detect drift between clients, and provide accurate positions to new joiners.
message PlaybackProgressReport {
    double current_time = 1;  // Current playback position in seconds
    bool is_playing = 2;      // Whether the client is currently playing
}

message ServerMessage {
    oneof message {
        ChatMessageReceive chat = 1;
        PlaybackStateChanged playback_state = 2;
        UserJoinedRoom user_joined = 3;
        UserLeftRoom user_left = 4;
        RoomSettingsChanged room_settings = 5;
        HeartbeatAck heartbeat_ack = 6;
        ErrorMessage error = 7;
        MediaAdded media_added = 8;
        MediaRemoved media_removed = 9;
        MediaRemovedBatch media_removed_batch = 10;
        PermissionChanged permission_changed = 11;
        PlaylistCreated playlist_created = 12;
        PlaylistUpdated playlist_updated = 13;
        PlaylistDeleted playlist_deleted = 14;
        PlaylistReordered playlist_reordered = 15;
        PlayingChanged playing_changed = 16;
        // WebRTC signaling messages (forwarded from other peers)
        WebRTCOffer webrtc_offer = 17;
        WebRTCAnswer webrtc_answer = 18;
        WebRTCIceCandidate webrtc_ice_candidate = 19;
        WebRTCJoin webrtc_join = 20;
        WebRTCLeave webrtc_leave = 21;
        // SFU migration: server requests existing P2P peer to renegotiate via SFU
        SfuMigrationOffer sfu_migration_offer = 22;
        SfuMigrationStatus sfu_migration_status = 23;
        // User notification push (replaces NOTIFICATION_PUSH error code abuse)
        UserNotification notification = 24;
        MediaUpdated media_updated = 25;
        PlaybackSnapshotChanged playback_snapshot = 26;
        PlaylistItemsChanged playlist_items = 27;
        RoomMembersChanged room_members = 28;
        ResourceObserved resource_observed = 29;
        ResourceChanged resource_changed = 30;
        ResourceObserveError resource_observe_error = 31;
    }
}

message ResourceObserved {
    string observe_id = 1;
    string version = 2;
    bool changed = 3;
}

message ResourceChangedOnly {}

message ResourceChanged {
    string observe_id = 1;
    string version = 2;
    oneof payload {
        ResourceChangedOnly changed_only = 3;
        PlaybackState playback_state = 4;
        PlaybackSnapshot playback_snapshot = 5;
        RoomSettingsChanged room_settings = 6;
        ListPlaylistItemsResponse playlist_items = 7;
        GetRoomMembersResponse room_members = 8;
    }
}

message ResourceObserveError {
    string observe_id = 1;
    ErrorMessage error = 2;
}

message PlaylistItemsChanged {
    string room_id = 1;
    ListPlaylistItemsResponse snapshot = 2;
}

message RoomMembersChanged {
    string room_id = 1;
    GetRoomMembersResponse snapshot = 2;
}


// Note: room_id extracted from x-room-id metadata in MessageStream context
// If position is set, client may display this as a danmaku (bullet comment)
message ChatMessageSend {
    string content = 1; // Validation: required, max 5000 chars, HTML tags stripped
    optional double position = 2; // Video position in seconds (for danmaku display). Validation: >= 0, max 86400
    optional string color = 3; // Hex color (e.g., "#FFFFFF") for danmaku
}

message ChatMessageReceive {
    string id = 1;
    string room_id = 2;
    string user_id = 3;
    string username = 4;
    string content = 5;
    int64 timestamp = 6; // Unix timestamp (seconds)
    optional double position = 7; // Video position in seconds (for danmaku display)
    optional string color = 8; // Hex color for danmaku
}

message HeartbeatMessage {
    int64 timestamp = 1; // Unix timestamp (seconds)
}

message HeartbeatAck {
    int64 timestamp = 1; // Unix timestamp (seconds)
}

message PlaybackStateChanged {
    string room_id = 1;
    PlaybackState state = 2;
}

message PlaybackSnapshotChanged {
    string room_id = 1;
    PlaybackSnapshot snapshot = 2;
}

message UserJoinedRoom {
    string room_id = 1;
    synctv.common.RoomMember member = 2;
}

message UserLeftRoom {
    string room_id = 1;
    string user_id = 2;
}

message RoomSettingsChanged {
    string room_id = 1;
    bytes settings = 2; // JSON settings
    int64 version = 3;
}

message ErrorMessage {
    string message = 1;
    synctv.common.ErrorCode code = 2; // Application-level error code for programmatic handling
    string detail = 3; // Optional detailed/debug info (may be empty in production)
}

// User Notification
// Push notification delivered to user's WebSocket connection.
//
// This message type replaces the historical abuse of ErrorMessage with code 5000
// (NOTIFICATION_PUSH). Clients should handle this variant separately from errors.
//
// The notification is pushed in real-time when a database-backed notification is
// created via UserNotificationService. The notification_id allows clients to
// deduplicate notifications if they receive them multiple times (e.g., during
// reconnection).
//
// Example notification types:
// - "room_invitation": User invited to join a room
// - "system": System-wide announcement
// - "room_event": Room-specific event (e.g., room closed, settings changed)
message UserNotification {
    string notification_id = 1; // Unique notification ID (UUID string) for client-side deduplication
    string notification_type = 2; // Notification type (e.g., "room_invitation", "system", "room_event")
    string title = 3; // Notification title for display
    string content = 4; // Notification content for display
    string data = 5; // JSON-encoded additional data (e.g., room_id, inviter_name for invitations)
    int64 timestamp = 6; // Unix timestamp (seconds) when notification was created
}

// Chat History
// Note: room_id extracted from x-room-id metadata
message GetChatHistoryRequest {
    option (buf.validate.message).cel = {
        id: "get_chat_history.limit"
        message: "limit must be 0 (use default) or between 1 and 100"
        expression: "this.limit == 0 || (this.limit >= 1 && this.limit <= 100)"
    };
    int32 limit = 1;  // Max page size (clamped to 100 server-side). Default: 50.
    string cursor = 2; // Opaque keyset cursor returned by the server as "<rfc3339_created_at>|<message_id>".
}

message GetChatHistoryResponse {
    repeated ChatMessageReceive messages = 1;
    string next_cursor = 2; // Pass this as cursor in the next request. Empty when no more messages.
}

