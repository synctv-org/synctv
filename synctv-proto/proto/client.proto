}

// SECURITY: passwords are transmitted as plaintext. TLS MUST be used.
message SetPasswordRequest {
    string old_password = 1; // SECURITY: Plaintext credential - requires TLS in transit. Validation: required
    string new_password = 2; // SECURITY: Plaintext credential - requires TLS in transit. Validation: min 8, max 128 chars, rejects common weak passwords
}

message SetPasswordResponse {
    bool success = 1;
}

