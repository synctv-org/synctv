{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "synctv.fullname" . }}
  labels:
    {{- include "synctv.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "synctv.selectorLabels" . | nindent 6 }}
  policyTypes:
    {{- toYaml .Values.networkPolicy.policyTypes | nindent 4 }}
  {{- if has "Ingress" .Values.networkPolicy.policyTypes }}
  ingress:
    # Allow ingress controller (API + WebSocket)
    {{- if and .Values.ingress.enabled .Values.networkPolicy.ingressControllerNamespaces }}
    - from:
        {{- range .Values.networkPolicy.ingressControllerNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.config.server.port }}
    {{- end }}
    # Allow internal cluster API traffic (inter-node communication)
    - from:
        - podSelector:
            matchLabels:
              {{- include "synctv.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.config.server.port }}
    # Allow RTMP ingest (external publishers)
    - from:
        {{- if .Values.networkPolicy.rtmpSourceCIDRs }}
        {{- range .Values.networkPolicy.rtmpSourceCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
        {{- else }}
        - ipBlock:
            cidr: 0.0.0.0/0
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.config.livestream.rtmpPort }}
    # Allow STUN traffic (WebRTC NAT traversal, UDP)
    {{- if .Values.config.webrtc.enableBuiltinStun }}
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: UDP
          port: {{ .Values.config.webrtc.stunPort }}
    {{- end }}
    # Allow Prometheus scraping
    {{- if and .Values.metrics.enabled .Values.networkPolicy.metricsSourceNamespaces }}
    - from:
        {{- range .Values.networkPolicy.metricsSourceNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.metrics.port | default 9090 }}
    {{- end }}
  {{- end }}
  {{- if has "Egress" .Values.networkPolicy.policyTypes }}
  egress:
    # Allow DNS (TCP and UDP)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              {{- if eq (include "synctv.postgresql.mode" .) "kubeblocks" }}
              app.kubernetes.io/instance: {{ include "synctv.postgresql.kubeblocks.clusterName" . | quote }}
              apps.kubeblocks.io/component-name: "postgresql"
              kubeblocks.io/role: "primary"
              {{- else }}
              app.kubernetes.io/instance: {{ .Release.Name | quote }}
              app.kubernetes.io/name: {{ include "synctv.name" . | quote }}
              app.kubernetes.io/component: "postgresql"
              {{- end }}
      ports:
        - protocol: TCP
          port: {{ include "synctv.postgresql.port" . }}
    # Allow Redis
    - to:
        - podSelector:
            matchLabels:
              {{- if eq (include "synctv.redis.mode" .) "kubeblocks" }}
              app.kubernetes.io/instance: {{ include "synctv.redis.kubeblocks.clusterName" . | quote }}
              apps.kubeblocks.io/component-name: "redis"
              {{- else }}
              app.kubernetes.io/instance: {{ .Release.Name | quote }}
              app.kubernetes.io/name: {{ include "synctv.name" . | quote }}
              app.kubernetes.io/component: "redis"
              {{- end }}
      ports:
        - protocol: TCP
          port: {{ include "synctv.redis.port" . }}
    # Allow internal cluster traffic (shared API port)
    - to:
        - podSelector:
            matchLabels:
              {{- include "synctv.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.config.server.port }}
    # Allow external HTTPS (for OAuth2, media providers)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
  {{- end }}
{{- end }}
