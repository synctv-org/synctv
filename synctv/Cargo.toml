[package]
name = "synctv"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "synctv"
path = "src/main.rs"

[features]
default = ["k8s", "mimalloc", "openapi"]
# Enable Kubernetes support (K8s DNS discovery, K8s Lease leader election).
# Disable to reduce binary size for non-K8s deployments:
#   cargo build --no-default-features
k8s = ["synctv-cluster/k8s", "synctv-core/k8s", "synctv-api/k8s"]
# Allocator selection (mutually exclusive — enable at most one):
#   mimalloc (default) — fast, works on all platforms
#   jemalloc           — excellent for long-running servers, unix only
mimalloc = ["dep:mimalloc"]
jemalloc = ["dep:tikv-jemallocator"]
openapi = ["synctv-api/openapi"]

[lints]
workspace = true

[dependencies]
# Internal workspace libraries
synctv-core.workspace = true
synctv-api.workspace = true
synctv-livestream.workspace = true
synctv-cluster = { workspace = true, default-features = false }
synctv-proxy.workspace = true
synctv-proto.workspace = true
synctv-management.workspace = true
synctv-common.workspace = true

# Async
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true

# HTTP Framework
axum.workspace = true
tonic.workspace = true
hyper.workspace = true

# Database
sqlx.workspace = true

# Redis
redis.workspace = true

# Utilities
anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
chrono.workspace = true
dashmap.workspace = true
dotenvy.workspace = true
hostname.workspace = true
parking_lot.workspace = true
percent-encoding.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
toml.workspace = true
serde.workspace = true
url.workspace = true
rustls-pemfile.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true
tower.workspace = true
hyper-util.workspace = true
tokio-rustls.workspace = true
rustls.workspace = true

mimalloc = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
tikv-jemallocator = { workspace = true, optional = true }

[dev-dependencies]
synctv-media-providers.workspace = true
synctv-common.workspace = true
synctv-core-testing.workspace = true
tonic-health.workspace = true
tokio = { workspace = true, features = ["test-util"] }
testcontainers.workspace = true
testcontainers-modules.workspace = true
futures.workspace = true
futures-util.workspace = true
async-trait.workspace = true
tempfile.workspace = true
reqwest.workspace = true
tokio-tungstenite.workspace = true
prost.workspace = true
clap = { workspace = true, features = ["derive"] }
clap_complete.workspace = true
tokio-stream.workspace = true
