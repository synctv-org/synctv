syntax = "proto3";

package synctv.playback_provider.twitch;

import "proto/buf/validate/validate.proto";
import "proto/playback_provider/common.proto";

message GetTwitchResourceRequest {
  string version = 1 [(buf.validate.field).string.min_len = 1];
  string mode_name = 2 [(buf.validate.field).string.min_len = 1];
  uint32 media_index = 3;
  string sig = 4 [(buf.validate.field).string.min_len = 1];
  string uid = 5 [(buf.validate.field).string.min_len = 1];
  string rid = 6 [(buf.validate.field).string.min_len = 1];
  int64 exp = 7;
  optional string range = 8;
  bool head = 9;
}

message TwitchResourceResponse {
  synctv.playback_provider.common.StreamChunk chunk = 1;
}

message GetTwitchSegmentRequest {
  string version = 1 [(buf.validate.field).string.min_len = 1];
  string target_url = 2 [(buf.validate.field).string.min_len = 1];
  string sig = 3 [(buf.validate.field).string.min_len = 1];
  string uid = 4 [(buf.validate.field).string.min_len = 1];
  string rid = 5 [(buf.validate.field).string.min_len = 1];
  int64 exp = 6;
  optional string range = 7;
  bool head = 8;
}

message TwitchSegmentResponse {
  synctv.playback_provider.common.StreamChunk chunk = 1;
}

message WatchTwitchChatRequest {
  string version = 1 [(buf.validate.field).string.min_len = 1];
  string mode_name = 2 [(buf.validate.field).string.min_len = 1];
  uint32 media_index = 3;
  string sig = 4 [(buf.validate.field).string.min_len = 1];
  string uid = 5 [(buf.validate.field).string.min_len = 1];
  string rid = 6 [(buf.validate.field).string.min_len = 1];
  int64 exp = 7;
}

message TwitchChatEvent {
  string id = 1;
  string user_name = 2;
  string text = 3;
  optional string color = 4;
  repeated string badges = 5;
  optional uint64 sent_at_ms = 6;
}

service TwitchPlaybackProviderService {
  rpc GetResource(GetTwitchResourceRequest) returns (stream TwitchResourceResponse);
  rpc GetSegment(GetTwitchSegmentRequest) returns (stream TwitchSegmentResponse);
  rpc WatchChat(WatchTwitchChatRequest) returns (stream TwitchChatEvent);
}
