syntax = "proto3";

package synctv.playback_provider.truenas;

import "proto/buf/validate/validate.proto";
import "proto/playback_provider/common.proto";

enum TrueNasHlsResourceKind {
  TRUE_NAS_HLS_RESOURCE_KIND_UNSPECIFIED = 0;
  TRUE_NAS_HLS_RESOURCE_KIND_MEDIA = 1;
  TRUE_NAS_HLS_RESOURCE_KIND_MANIFEST = 2;
}

message GetTrueNasResourceRequest {
  string version = 1 [(buf.validate.field).string.min_len = 1];
  string mode_name = 2 [(buf.validate.field).string.min_len = 1];
  uint32 media_index = 3;
  string sig = 4 [(buf.validate.field).string.min_len = 1];
  string uid = 5 [(buf.validate.field).string.min_len = 1];
  string rid = 6 [(buf.validate.field).string.min_len = 1];
  int64 exp = 7;
  optional string range = 8;
  bool head = 9;
}

message TrueNasResourceResponse {
  synctv.playback_provider.common.StreamChunk chunk = 1;
}

message GetTrueNasHlsManifestRequest {
  string version = 1 [(buf.validate.field).string.min_len = 1];
  string mode_name = 2 [(buf.validate.field).string.min_len = 1];
  uint32 media_index = 3;
  string sig = 4 [(buf.validate.field).string.min_len = 1];
  string uid = 5 [(buf.validate.field).string.min_len = 1];
  string rid = 6 [(buf.validate.field).string.min_len = 1];
  int64 exp = 7;
  bool head = 8;
}

message TrueNasHlsManifestResponse {
  synctv.playback_provider.common.StreamChunk chunk = 1;
}

message GetTrueNasHlsResourceRequest {
  string version = 1 [(buf.validate.field).string.min_len = 1];
  string target_url = 2 [(buf.validate.field).string.min_len = 1];
  string sig = 3 [(buf.validate.field).string.min_len = 1];
  string uid = 4 [(buf.validate.field).string.min_len = 1];
  string rid = 5 [(buf.validate.field).string.min_len = 1];
  int64 exp = 6;
  optional string range = 7;
  bool head = 8;
  string mode_name = 9 [(buf.validate.field).string.min_len = 1];
  uint32 media_index = 10;
  TrueNasHlsResourceKind resource_kind = 11 [(buf.validate.field).enum.defined_only = true];
}

message TrueNasHlsResourceResponse {
  synctv.playback_provider.common.StreamChunk chunk = 1;
}

message GetTrueNasSubtitleRequest {
  string version = 1 [(buf.validate.field).string.min_len = 1];
  string mode_name = 2 [(buf.validate.field).string.min_len = 1];
  uint32 subtitle_index = 3;
  string sig = 4 [(buf.validate.field).string.min_len = 1];
  string uid = 5 [(buf.validate.field).string.min_len = 1];
  string rid = 6 [(buf.validate.field).string.min_len = 1];
  int64 exp = 7;
}

message TrueNasSubtitleResponse {
  synctv.playback_provider.common.StreamChunk chunk = 1;
}

service TrueNasPlaybackProviderService {
  rpc GetResource(GetTrueNasResourceRequest) returns (stream TrueNasResourceResponse);
  rpc GetHlsManifest(GetTrueNasHlsManifestRequest) returns (stream TrueNasHlsManifestResponse);
  rpc GetHlsResource(GetTrueNasHlsResourceRequest) returns (stream TrueNasHlsResourceResponse);
  rpc GetSubtitle(GetTrueNasSubtitleRequest) returns (stream TrueNasSubtitleResponse);
}
