    max_len: 64
    pattern: "^room_[A-Za-z0-9]+$"
  }];
  string request_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
    pattern: "^rev_[A-Za-z0-9]+$"
  }];
}

message RoomPathRequest {
  string room_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
    pattern: "^room_[A-Za-z0-9]+$"
  }];
}

message RoomMediaTargetPathRequest {
