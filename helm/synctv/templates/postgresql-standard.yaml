{{- if eq (include "synctv.postgresql.mode" .) "standard" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "synctv.postgresql.fullname" . }}
  labels:
    {{- include "synctv.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  type: ClusterIP
  ports:
    - name: postgresql
      port: {{ .Values.postgresql.standard.service.port | default 5432 }}
      targetPort: postgresql
      protocol: TCP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: {{ include "synctv.name" . }}
    app.kubernetes.io/component: postgresql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "synctv.postgresql.fullname" . }}
  labels:
    {{- include "synctv.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  serviceName: {{ include "synctv.postgresql.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: {{ include "synctv.name" . }}
      app.kubernetes.io/component: postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: {{ include "synctv.name" . }}
        app.kubernetes.io/component: postgresql
    spec:
      containers:
        - name: postgresql
          image: "{{ .Values.postgresql.standard.image.repository | default "postgres" }}:{{ .Values.postgresql.standard.image.tag | default "18.1-bookworm" }}"
          imagePullPolicy: {{ .Values.postgresql.standard.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: postgresql
              containerPort: {{ .Values.postgresql.standard.service.port | default 5432 }}
              protocol: TCP
          env:
            - name: POSTGRES_USER
              value: {{ include "synctv.postgresql.appUsername" . | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "synctv.secretName" . }}
                  key: SYNCTV_DATABASE_PASSWORD
            - name: POSTGRES_DB
              value: {{ include "synctv.postgresql.database" . | quote }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
          livenessProbe:
            exec:
              command: ["sh", "-ec", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["sh", "-ec", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
          {{- with .Values.postgresql.standard.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with (.Values.postgresql.standard.persistence.storageClass | default .Values.global.storageClass) }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.standard.persistence.size | default "20Gi" }}
{{- end }}
