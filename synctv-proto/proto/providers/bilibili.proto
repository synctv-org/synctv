// Bilibili Provider Client API
//
// This is the client-facing gRPC API for Bilibili provider
//
// SECURITY: This service transmits Bilibili session cookies as plaintext
// map<string,string> fields. These cookies grant full access to the user's
// Bilibili account. Deployments MUST:
//   - Use TLS for all connections to this service.
//   - Never log request/response payloads containing cookie fields.
//   - Treat cookie fields as sensitive credentials in observability pipelines.

syntax = "proto3";

package synctv.provider.bilibili;

// Bilibili Provider Service
//
// Client-facing API for Bilibili video parsing, login, and user management
service BilibiliProviderService {
  // Parse Bilibili URL (video, anime, live)
  rpc Parse(ParseRequest) returns (ParseResponse);

  // Generate QR code for login
  rpc LoginQR(LoginQRRequest) returns (QRCodeResponse);

  // Check QR code login status
  rpc CheckQR(CheckQRRequest) returns (QRStatusResponse);

  // Get captcha for SMS login
  rpc GetCaptcha(GetCaptchaRequest) returns (CaptchaResponse);

  // Send SMS verification code
  rpc SendSMS(SendSMSRequest) returns (SendSMSResponse);

  // Login with SMS code
  rpc LoginSMS(LoginSMSRequest) returns (LoginSMSResponse);

  // Get user info
  rpc GetUserInfo(UserInfoRequest) returns (UserInfoResponse);

  // Logout
  rpc Logout(LogoutRequest) returns (LogoutResponse);
}

// Parse video URL request
message ParseRequest {
  string url = 1;
  map<string, string> cookies = 2; // SENSITIVE: Session cookies - do not log
  string instance_name = 3; // Optional provider instance name
}

// Parse video URL response
message ParseResponse {
  string title = 1;
  repeated string actors = 2;
  repeated VideoInfo videos = 3;
}

// Video information
message VideoInfo {
  string bvid = 1;
  int64 cid = 2;
  int64 epid = 3;
  string name = 4;
  string cover = 5;
  bool is_live = 6;
}

// QR code login request
message LoginQRRequest {
  string instance_name = 1; // Optional provider instance name
}

// QR code response
message QRCodeResponse {
  string url = 1;
  string key = 2;
}

// Check QR status request
message CheckQRRequest {
  string key = 1;
  string instance_name = 2; // Optional provider instance name
}

// QR status response
message QRStatusResponse {
  int32 status = 1; // 0=success, 1=expired, 2=not_scanned, 3=scanned_not_confirmed
  map<string, string> cookies = 2; // SENSITIVE: Session cookies - do not log
}

// Get captcha request
message GetCaptchaRequest {
  string instance_name = 1; // Optional provider instance name
}

// Captcha response
message CaptchaResponse {
  string token = 1;
  string gt = 2;
  string challenge = 3;
}

// Send SMS request
message SendSMSRequest {
  string phone = 1;
  string token = 2;
  string challenge = 3;
  string validate = 4;
  string instance_name = 5; // Optional provider instance name
}

// Send SMS response
message SendSMSResponse {
  string captcha_key = 1;
}

// Login with SMS request
message LoginSMSRequest {
  string phone = 1;
  string code = 2;
  string captcha_key = 3;
  string instance_name = 4; // Optional provider instance name
}

// Login with SMS response
message LoginSMSResponse {
  map<string, string> cookies = 1; // SENSITIVE: Session cookies - do not log
}

// User info request
message UserInfoRequest {
  map<string, string> cookies = 1; // SENSITIVE: Session cookies - do not log
  string instance_name = 2; // Optional provider instance name
}

// User info response
message UserInfoResponse {
  bool is_login = 1;
  string username = 2;
  string face = 3;
  bool is_vip = 4;
}

// Logout request
message LogoutRequest {
  string instance_name = 1; // Optional provider instance name
}

// Logout response
message LogoutResponse {
  string message = 1;
}
