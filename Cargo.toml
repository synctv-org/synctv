[workspace]
members = [
    # SyncTV crates
    "synctv-proto",
    "synctv-core",
    "synctv-core/testing",
    "synctv-proxy",
    "synctv-api",
    "synctv-livestream",
    "synctv-cluster",
    "synctv-media-providers",
    "synctv-management",
    "synctv",
    # Shared utilities
    "synctv-common",
    # xiu consolidated crate
    "synctv-xiu",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["SyncTV Contributors"]
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
style = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
todo = "deny"
unwrap_used = "warn"
doc_markdown = "allow"
struct_excessive_bools = "allow"
case_sensitive_file_extension_comparisons = "allow"
missing_fields_in_debug = "allow"
trivially_copy_pass_by_ref = "allow"
default_trait_access = "allow"
match_wildcard_for_single_variants = "allow"
explicit_deref_methods = "allow"
too_many_lines = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
wildcard_imports = "allow"
redundant_pub_crate = "allow"
similar_names = "allow"
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"
needless_for_each = "allow"

[workspace.dependencies]
# Async Runtime
tokio = { version = "1.49", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "time",
    "sync",
    "signal",
    "fs",
] }
tokio-util = { version = "0.7.18", features = ["codec", "io", "rt"] }
tokio-stream = "0.1.18"

# gRPC & Protobuf
tonic = { version = "0.14", default-features = false, features = [
    "transport",
    "tls-native-roots",
    "codegen",
    "server",
    "router",
    "channel",
] }
tonic-web = "0.14.5"
tonic-reflection = "0.14.5"
tonic-health = "0.14.5"
tonic-build = "0.14.5"
tonic-prost = "0.14.5"
tonic-prost-build = "0.14.5"
protoc-bin-vendored = "3.2.0"
prost = "0.14.3"
prost-types = "0.14.3"
prost-reflect = "0.16.3"
prost-reflect-build = "0.16.0"
prost-protovalidate = "0.3.0"

# HTTP Framework
axum = { version = "0.8.9", features = ["macros", "ws"] }
tower = { version = "0.5", features = [
    "util",
    "timeout",
    "limit",
    "load-shed",
] }
tower-http = { version = "0.6", features = [
    "trace",
    "compression-full",
    "limit",
    "timeout",
    "cors",
] }
hyper = { version = "1.8", default-features = false, features = [
    "http1",
    "http2",
    "server",
    "client",
] }
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "cookies",
    "rustls",
    "query",
    "form",
] }

# Database
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "migrate",
    "uuid",
    "chrono",
    "json",
    "macros",
] }

# Redis
redis = { version = "1.0", features = [
    "tokio-comp",
    "connection-manager",
    "streams",
    "cluster",
    "sentinel",
    "tokio-rustls-comp",
    "script",
] }

# Security
argon2 = "0.5.3"
jsonwebtoken = { version = "10.3.0", features = ["aws_lc_rs"] }
oauth2 = "5.0.0"
aes-gcm = "0.10.3"
ammonia = "4.1.2"
http-acl = "0.11.0"
http-acl-reqwest = "0.11.0"
sha1 = "0.11.0"
sha2 = "0.11.0"
md-5 = "0.11.0"
hmac = "0.13.0"
subtle = "2.6.1"

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
serde_ignored = "0.1.14"
toml = "1.1.2"
serde_urlencoded = "0.7.1"
indexmap = "2.14.0"
bincode = { version = "2.0.1", features = ["serde"] }

# Caching
moka = { version = "0.12.15", features = ["future", "sync"] }
dashmap = "6.1.0"
lru = "0.17.0"

# IDs & Crypto
nanoid = "0.5.0"
uuid = { version = "1.23.1", features = ["v4", "serde"] }
rand = "0.10.1"
base64 = "0.22.1"
humantime = "2.3.0"
hex = "0.4.3"
chrono-tz = "0.10.4"
iana-time-zone = "0.1.65"

# WebRTC
webrtc = "0.17.1"

# STUN server (turn-rs, STUN-only mode)
turn-server = { git = "https://github.com/mycrl/turn-rs", default-features = false, features = [
    "udp",
] }

# Streaming (consolidated xiu crate)
synctv-xiu = { path = "synctv-xiu" }

# Object Storage
opendal = { version = "0.55.0", features = ["services-s3"] }

# Logging & Tracing
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "json",
    "fmt",
] }
tracing-appender = "0.2.4"
dotenvy = "0.15.7"

# Configuration
config = "0.15.22"
clap = { version = "4.6.1", features = ["derive", "env"] }
clap_complete = "4.6.2"

# Utilities
anyhow = "1.0.102"
thiserror = "2.0.18"
bytes = "1.11.1"
parking_lot = "0.12.5"
async-trait = "0.1.89"
futures = "0.3.32"
futures-util = "0.3.32"
hostname = "0.4.2"
url = "2.5.8"
percent-encoding = "2.3.2"
urlencoding = "2.1.3"
regex = "1.12.3"
paste = "1.0.15"
byteorder = "1.5.0"
http = "1.4.0"
garde = { version = "0.22.1", features = ["derive"] }

# Monitoring
prometheus = "0.14.0"

# Time
chrono = { version = "0.4.44", features = ["serde"] }


# Kubernetes (in-cluster client for leader election & service discovery)
kube = { version = "3.1.0", features = ["runtime", "client", "derive"] }
k8s-openapi = { version = "0.27.1", features = ["v1_32"] }

# TLS
tokio-rustls = "0.26.4"
rustls = { version = "0.23.38", default-features = false, features = ["std", "ring"] }
rustls-pemfile = "2.2.0"
hyper-util = { version = "0.1.20", features = ["client-legacy", "tokio", "http2"] }

# Networking
ipnet = "2.12.0"

# Email
lettre = { version = "0.11", default-features = false, features = [
    "tokio1-rustls-tls",
    "builder",
    "smtp-transport",
    "hostname",
    "tokio1",
] }
handlebars = "6.4.0"

# Initialization
ctor = "0.10.0"

# Compression
flate2 = "1.1.9"
brotli = "8.0.2"

# Resilience
governor = "0.10.4"
nonzero_ext = "0.3.0"
backon = "1.6.0"
failsafe = "1.3.0"

# Data Structures
async_singleflight = "0.6.2"

# HTTP Body
http-body-util = "0.1.3"
utoipa = { version = "5.4.0", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }

# Testing
mockall = "0.14.0"
wiremock = "0.6.5"
tempfile = "3.27.0"
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["postgres", "redis"] }
tokio-tungstenite = "0.29.0"

# Benchmarking
criterion = { version = "0.8.2", features = ["html_reports", "async_tokio"] }

# Allocators
tikv-jemallocator = "0.6.1"
mimalloc = { version = "0.1.48", features = ["v3"] }

# Internal workspace crates
synctv-proto = { path = "synctv-proto" }
synctv-core = { path = "synctv-core" }
synctv-core-testing = { path = "synctv-core/testing" }
synctv-api = { path = "synctv-api" }
synctv-cluster = { path = "synctv-cluster", default-features = false }
synctv-media-providers = { path = "synctv-media-providers" }
synctv-management = { path = "synctv-management" }
synctv-proxy = { path = "synctv-proxy" }
synctv-livestream = { path = "synctv-livestream" }
synctv-common = { path = "synctv-common" }

[profile.dev]
debug = 0
strip = "symbols"

[profile.release]
opt-level = 3
debug = 0
lto = "fat"
codegen-units = 1
incremental = false
panic = "unwind"
strip = "symbols"
debug-assertions = false
overflow-checks = false
