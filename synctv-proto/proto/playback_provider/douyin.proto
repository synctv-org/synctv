syntax = "proto3";

package synctv.playback_provider.douyin;

import "proto/buf/validate/validate.proto";
import "proto/playback_provider/common.proto";

message GetDouyinResourceRequest {
  string version = 1 [(buf.validate.field).string.min_len = 1];
  string mode_name = 2 [(buf.validate.field).string.min_len = 1];
  uint32 media_index = 3;
  string sig = 4 [(buf.validate.field).string.min_len = 1];
  string uid = 5 [(buf.validate.field).string.min_len = 1];
  string rid = 6 [(buf.validate.field).string.min_len = 1];
  int64 exp = 7;
  optional string range = 8;
  bool head = 9;
}

message DouyinResourceResponse {
  synctv.playback_provider.common.StreamChunk chunk = 1;
}

enum DouyinHlsResourceKind {
  DOUYIN_HLS_RESOURCE_KIND_UNSPECIFIED = 0;
  DOUYIN_HLS_RESOURCE_KIND_MEDIA = 1;
  DOUYIN_HLS_RESOURCE_KIND_MANIFEST = 2;
}

message GetDouyinHlsResourceRequest {
  string version = 1 [(buf.validate.field).string.min_len = 1];
  string target_url = 2 [(buf.validate.field).string.min_len = 1];
  string sig = 3 [(buf.validate.field).string.min_len = 1];
  string uid = 4 [(buf.validate.field).string.min_len = 1];
  string rid = 5 [(buf.validate.field).string.min_len = 1];
  int64 exp = 6;
  optional string range = 7;
  bool head = 8;
  string mode_name = 9 [(buf.validate.field).string.min_len = 1];
  uint32 media_index = 10;
  DouyinHlsResourceKind resource_kind = 11 [(buf.validate.field).enum.defined_only = true];
}

message DouyinHlsResourceResponse {
  synctv.playback_provider.common.StreamChunk chunk = 1;
}

message WatchDouyinDanmakuRequest {
  string version = 1 [(buf.validate.field).string.min_len = 1];
  string mode_name = 2 [(buf.validate.field).string.min_len = 1];
  uint32 media_index = 3;
  string sig = 4 [(buf.validate.field).string.min_len = 1];
  string uid = 5 [(buf.validate.field).string.min_len = 1];
  string rid = 6 [(buf.validate.field).string.min_len = 1];
  int64 exp = 7;
}

message ChatEvent {
  string id = 1;
  string user_id = 2;
  string user_name = 3;
  string text = 4;
  optional string color = 5;
  optional uint64 sent_at_ms = 6;
}

message StreamClosedEvent {
  uint64 action = 1;
  optional string message = 2;
}

message DouyinDanmakuEvent {
  oneof event {
    ChatEvent chat = 1;
    StreamClosedEvent stream_closed = 2;
  }
}

service DouyinPlaybackProviderService {
  rpc GetResource(GetDouyinResourceRequest) returns (stream DouyinResourceResponse);
  rpc GetHlsResource(GetDouyinHlsResourceRequest) returns (stream DouyinHlsResourceResponse);
  rpc WatchDanmaku(WatchDouyinDanmakuRequest) returns (stream DouyinDanmakuEvent);
}
