[advisories]
ignore = [
    "RUSTSEC-2023-0071",
    "RUSTSEC-2024-0436",
    "RUSTSEC-2025-0134",
    "RUSTSEC-2025-0141",
    "RUSTSEC-2026-0097",
    # crypto-bigint 0.5.5 timing side channel (RUSTSEC-2026-0387): reachable
    # only via opaque-ke 4.1.0-pre.2 -> voprf 0.5 -> elliptic-curve 0.13, and
    # the fix (>=0.7.6) has no 0.5.x backport. Ignore until opaque-ke releases
    # against elliptic-curve >=0.14.
    "RUSTSEC-2026-0387",
    # libsqlite3-sys 0.37.0 bundles a SQLite with CVE-2026-119375
    # (RUSTSEC-2026-0459). The crate reaches the tree only through the sqlx
    # 0.9.0 macros chain (sqlx-macros-core -> sqlx-sqlite); the server links
    # no SQLite and runs PostgreSQL exclusively. sqlx pins
    # libsqlite3-sys =0.37.0 and no sqlx release carries >=0.39 yet. Drop
    # this ignore once sqlx ships the bundled-SQLite refresh.
    "RUSTSEC-2026-0459",
]
informational_warnings = ["notice", "unmaintained", "unsound"]

[output]
format = "terminal"
quiet = false
show_tree = true
