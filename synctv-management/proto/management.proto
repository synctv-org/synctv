syntax = "proto3";

package synctv.management;

import "proto/admin.proto";
import "proto/client.proto";
import "proto/common.proto";
import "proto/providers/alist.proto";
import "proto/providers/bilibili.proto";
import "proto/providers/common.proto";
import "proto/providers/emby.proto";
import "proto/providers/rtmp.proto";

service ManagementService {
    // =========================
    // Management commands
    // =========================
    rpc ListUsers(ListUsersRequest) returns (synctv.admin.ListUsersResponse);
    rpc GetUser(GetUserRequest) returns (synctv.admin.GetUserResponse);
    rpc GetUserPreferences(GetUserPreferencesRequest) returns (synctv.admin.GetUserPreferencesResponse);
    rpc UpdateUserPreferences(UpdateUserPreferencesRequest) returns (synctv.admin.UpdateUserPreferencesResponse);
    rpc AddAdmin(AddAdminRequest) returns (synctv.admin.AddAdminResponse);
    rpc RemoveAdmin(RemoveAdminRequest) returns (synctv.admin.RemoveAdminResponse);
    rpc ListAdmins(ListAdminsRequest) returns (synctv.admin.ListAdminsResponse);
    rpc CreateUser(CreateUserRequest) returns (synctv.admin.CreateUserResponse);
    rpc DeleteUser(DeleteUserRequest) returns (synctv.admin.DeleteUserResponse);
    rpc BanUser(BanUserRequest) returns (synctv.admin.BanUserResponse);
    rpc UnbanUser(UnbanUserRequest) returns (synctv.admin.UnbanUserResponse);
    rpc UpdateUserRole(UpdateUserRoleRequest) returns (synctv.admin.UpdateUserRoleResponse);
    rpc SetUserPassword(SetUserPasswordRequest) returns (synctv.admin.SetUserPasswordResponse);
    rpc UpdateUserUsername(UpdateUserUsernameRequest) returns (synctv.admin.UpdateUserUsernameResponse);
    rpc GetUserRooms(GetUserRoomsRequest) returns (synctv.admin.GetUserRoomsResponse);
    rpc BatchBanUsers(BatchBanUsersRequest) returns (synctv.admin.BatchBanUsersResponse);
    rpc BatchDeleteUsers(BatchDeleteUsersRequest) returns (synctv.admin.BatchDeleteUsersResponse);

    rpc CreateRoom(CreateRoomRequest) returns (synctv.client.CreateRoomResponse);
    rpc ListRooms(ListRoomsRequest) returns (synctv.admin.ListRoomsResponse);
    rpc GetRoom(GetRoomRequest) returns (synctv.admin.GetRoomResponse);
    rpc GetRoomMembers(GetRoomMembersRequest) returns (synctv.admin.GetRoomMembersResponse);
    rpc AddMember(AddMemberRequest) returns (synctv.client.AddMemberResponse);
    rpc UpdateMemberPermissions(UpdateMemberPermissionsRequest) returns (synctv.client.UpdateMemberPermissionsResponse);
    rpc KickMember(KickMemberRequest) returns (synctv.client.KickMemberResponse);
    rpc GetRoomSettings(GetRoomSettingsRequest) returns (synctv.admin.GetRoomSettingsResponse);
    rpc UpdateRoomSettings(UpdateRoomSettingsRequest) returns (synctv.admin.UpdateRoomSettingsResponse);
    rpc ResetRoomSettings(ResetRoomSettingsRequest) returns (synctv.admin.ResetRoomSettingsResponse);
    rpc TransferRoomOwnership(TransferRoomOwnershipRequest) returns (synctv.client.TransferRoomOwnershipResponse);
    rpc UpdateRoomPassword(UpdateRoomPasswordRequest) returns (synctv.admin.UpdateRoomPasswordResponse);
    rpc BanRoom(BanRoomRequest) returns (synctv.admin.BanRoomResponse);
    rpc UnbanRoom(UnbanRoomRequest) returns (synctv.admin.UnbanRoomResponse);
    rpc DeleteRoom(DeleteRoomRequest) returns (synctv.admin.DeleteRoomResponse);
    rpc BatchBanRooms(BatchBanRoomsRequest) returns (synctv.admin.BatchBanRoomsResponse);
    rpc BatchDeleteRooms(BatchDeleteRoomsRequest) returns (synctv.admin.BatchDeleteRoomsResponse);
    rpc StartPlayback(StartPlaybackRequest) returns (synctv.client.StartPlaybackResponse);
    rpc StopPlayback(StopPlaybackRequest) returns (synctv.client.StopPlaybackResponse);
    rpc GetPlayback(GetPlaybackRequest) returns (synctv.client.GetPlaybackResponse);
    rpc UpdatePlayback(UpdatePlaybackRequest) returns (synctv.client.GetPlaybackResponse);
    rpc CreatePublishKey(CreatePublishKeyRequest) returns (synctv.provider.rtmp.CreatePublishKeyResponse);
    rpc GetStreamInfo(GetStreamInfoRequest) returns (synctv.provider.rtmp.GetStreamInfoResponse);
    rpc ListRoomStreams(ListRoomStreamsRequest) returns (synctv.client.ListRoomStreamsResponse);
    rpc KickRoomStream(KickRoomStreamRequest) returns (synctv.client.KickRoomStreamResponse);
    rpc AlistLogin(AlistLoginRequest) returns (synctv.provider.alist.LoginResponse);
    rpc AlistList(AlistListRequest) returns (synctv.provider.alist.ListResponse);
    rpc AlistSearch(AlistSearchRequest) returns (synctv.provider.alist.SearchResponse);
    rpc AlistGetMe(AlistGetMeRequest) returns (synctv.provider.alist.GetMeResponse);
    rpc AlistLogout(AlistLogoutRequest) returns (synctv.provider.alist.LogoutResponse);
    rpc AlistGetBinds(AlistGetBindsRequest) returns (synctv.provider.alist.GetBindsResponse);
    rpc EmbyLogin(EmbyLoginRequest) returns (synctv.provider.emby.LoginResponse);
    rpc EmbyList(EmbyListRequest) returns (synctv.provider.emby.ListResponse);
    rpc EmbyGetMe(EmbyGetMeRequest) returns (synctv.provider.emby.GetMeResponse);
    rpc EmbyLogout(EmbyLogoutRequest) returns (synctv.provider.emby.LogoutResponse);
    rpc EmbyGetBinds(EmbyGetBindsRequest) returns (synctv.provider.emby.GetBindsResponse);
    rpc BilibiliParse(BilibiliParseRequest) returns (synctv.provider.bilibili.ParseResponse);
    rpc BilibiliLoginQr(BilibiliLoginQrRequest) returns (synctv.provider.bilibili.QRCodeResponse);
    rpc BilibiliCheckQr(BilibiliCheckQrRequest) returns (synctv.provider.bilibili.QRStatusResponse);
    rpc BilibiliStartSmsLogin(BilibiliStartSmsLoginRequest) returns (synctv.provider.bilibili.StartSMSLoginResponse);
    rpc BilibiliSendSms(BilibiliSendSmsRequest) returns (synctv.provider.bilibili.SendSMSResponse);
    rpc BilibiliLoginSms(BilibiliLoginSmsRequest) returns (synctv.provider.bilibili.LoginSMSResponse);
    rpc BilibiliGetUserInfo(BilibiliGetUserInfoRequest) returns (synctv.provider.bilibili.UserInfoResponse);
    rpc BilibiliLogout(BilibiliLogoutRequest) returns (synctv.provider.bilibili.LogoutResponse);
    rpc BilibiliGetBinds(BilibiliGetBindsRequest) returns (synctv.provider.bilibili.GetBindsResponse);

    rpc ListPlaylists(ListPlaylistsRequest) returns (synctv.client.ListPlaylistsResponse);
    rpc GetPlaylist(GetPlaylistRequest) returns (synctv.client.GetPlaylistResponse);
    rpc CreatePlaylist(CreatePlaylistRequest) returns (synctv.client.CreatePlaylistResponse);
    rpc CreateAlistPlaylist(CreateAlistPlaylistRequest) returns (synctv.client.CreatePlaylistResponse);
    rpc CreateEmbyPlaylist(CreateEmbyPlaylistRequest) returns (synctv.client.CreatePlaylistResponse);
    rpc UpdatePlaylist(UpdatePlaylistRequest) returns (synctv.client.UpdatePlaylistResponse);
    rpc MovePlaylist(MovePlaylistRequest) returns (synctv.client.MovePlaylistResponse);
    rpc DeletePlaylist(DeletePlaylistRequest) returns (synctv.client.DeletePlaylistResponse);

    rpc ListMedia(ListMediaRequest) returns (synctv.client.ListPlaylistItemsResponse);
    rpc AddMedia(AddMediaRequest) returns (synctv.client.AddMediaResponse);
    rpc AddDirectUrlMedia(AddDirectUrlMediaRequest) returns (synctv.client.AddMediaResponse);
    rpc AddAlistMedia(AddAlistMediaRequest) returns (synctv.client.AddMediaResponse);
    rpc AddEmbyMedia(AddEmbyMediaRequest) returns (synctv.client.AddMediaResponse);
    rpc AddBilibiliVideoMedia(AddBilibiliVideoMediaRequest) returns (synctv.client.AddMediaResponse);
    rpc AddBilibiliPgcMedia(AddBilibiliPgcMediaRequest) returns (synctv.client.AddMediaResponse);
    rpc AddBilibiliLiveMedia(AddBilibiliLiveMediaRequest) returns (synctv.client.AddMediaResponse);
    rpc EditMedia(EditMediaRequest) returns (synctv.client.EditMediaResponse);
    rpc MoveMedia(MoveMediaRequest) returns (synctv.client.MoveMediaResponse);
    rpc DeleteMedia(DeleteMediaRequest) returns (synctv.client.DeleteMediaResponse);

    rpc ListAvailableProviderInstances(synctv.provider.common.ListAvailableProviderInstancesRequest) returns (synctv.provider.common.ProviderInstancesResponse);
    rpc ListProviderBackends(synctv.provider.common.ListProviderBackendsRequest) returns (synctv.provider.common.ProviderBackendsResponse);
    rpc ListProviderInstances(synctv.provider.common.ListProviderInstancesRequest) returns (synctv.provider.common.ListProviderInstancesResponse);
    rpc AddProviderInstance(synctv.provider.common.AddProviderInstanceRequest) returns (synctv.provider.common.AddProviderInstanceResponse);
    rpc UpdateProviderInstance(synctv.provider.common.UpdateProviderInstanceRequest) returns (synctv.provider.common.UpdateProviderInstanceResponse);
    rpc DeleteProviderInstance(synctv.provider.common.DeleteProviderInstanceRequest) returns (synctv.provider.common.DeleteProviderInstanceResponse);
    rpc ReconnectProviderInstance(synctv.provider.common.ReconnectProviderInstanceRequest) returns (synctv.provider.common.ReconnectProviderInstanceResponse);
    rpc EnableProviderInstance(synctv.provider.common.EnableProviderInstanceRequest) returns (synctv.provider.common.EnableProviderInstanceResponse);
    rpc DisableProviderInstance(synctv.provider.common.DisableProviderInstanceRequest) returns (synctv.provider.common.DisableProviderInstanceResponse);

    rpc GetSettings(GetSettingsRequest) returns (synctv.admin.GetSettingsResponse);
    rpc GetSettingsGroup(GetSettingsGroupRequest) returns (synctv.admin.GetSettingsGroupResponse);
    rpc UpdateSettings(UpdateSettingsRequest) returns (synctv.admin.UpdateSettingsResponse);
    rpc SendTestEmail(SendTestEmailRequest) returns (synctv.admin.SendTestEmailResponse);
    rpc GetSystemStats(GetSystemStatsRequest) returns (synctv.admin.GetSystemStatsResponse);
    rpc ListActiveStreams(ListActiveStreamsRequest) returns (synctv.admin.ListActiveStreamsResponse);
    rpc KickStream(KickStreamRequest) returns (synctv.admin.KickStreamResponse);
    rpc GetSliceCacheStats(GetSliceCacheStatsRequest) returns (GetSliceCacheStatsResponse);
    rpc PurgeSliceCache(PurgeSliceCacheRequest) returns (PurgeSliceCacheResponse);
    rpc EvictExpiredSliceCache(EvictExpiredSliceCacheRequest) returns (EvictExpiredSliceCacheResponse);
    rpc ListUserRegistrationReviews(ListUserRegistrationReviewsRequest) returns (synctv.admin.ListUserRegistrationReviewsResponse);
    rpc ApproveUserRegistrationReview(ApproveUserRegistrationReviewRequest) returns (synctv.admin.ApproveUserRegistrationReviewResponse);
    rpc RejectUserRegistrationReview(RejectUserRegistrationReviewRequest) returns (synctv.admin.RejectUserRegistrationReviewResponse);
    rpc ListRoomCreationReviews(ListRoomCreationReviewsRequest) returns (synctv.admin.ListRoomCreationReviewsResponse);
    rpc ApproveRoomCreationReview(ApproveRoomCreationReviewRequest) returns (synctv.admin.ApproveRoomCreationReviewResponse);
    rpc RejectRoomCreationReview(RejectRoomCreationReviewRequest) returns (synctv.admin.RejectRoomCreationReviewResponse);
    rpc ListRoomJoinReviews(ListRoomJoinReviewsRequest) returns (synctv.admin.ListRoomJoinReviewsResponse);
    rpc ApproveRoomJoinReview(ApproveRoomJoinReviewRequest) returns (synctv.admin.ApproveRoomJoinReviewResponse);
    rpc RejectRoomJoinReview(RejectRoomJoinReviewRequest) returns (synctv.admin.RejectRoomJoinReviewResponse);
    rpc ListBanRecords(ListBanRecordsRequest) returns (synctv.admin.ListBanRecordsResponse);

    // =========================
    // Lifecycle
    // =========================
    rpc StopServer(StopServerRequest) returns (stream StopServerEvent);
}

enum ShutdownMode {
    SHUTDOWN_MODE_UNSPECIFIED = 0;
    SHUTDOWN_MODE_GRACEFUL = 1;
    SHUTDOWN_MODE_FORCE = 2;
}

enum StopServerStage {
    STOP_SERVER_STAGE_UNSPECIFIED = 0;
    STOP_SERVER_STAGE_READY = 1;
    STOP_SERVER_STAGE_SHUTDOWN_REQUESTED = 2;
    STOP_SERVER_STAGE_RUNTIME_DRAINING = 3;
    STOP_SERVER_STAGE_CONNECTION_DRAINING = 4;
    STOP_SERVER_STAGE_COMPONENTS_SHUTTING_DOWN = 5;
    STOP_SERVER_STAGE_FINALIZING = 6;
    STOP_SERVER_STAGE_COMPLETED = 7;
    STOP_SERVER_STAGE_FAILED = 8;
}

enum SortDirection {
    SORT_DIRECTION_UNSPECIFIED = 0;
    SORT_DIRECTION_ASC = 1;
    SORT_DIRECTION_DESC = 2;
}

enum UserListSortBy {
    USER_LIST_SORT_BY_UNSPECIFIED = 0;
    USER_LIST_SORT_BY_CREATED_AT = 1;
    USER_LIST_SORT_BY_UPDATED_AT = 2;
    USER_LIST_SORT_BY_USERNAME = 3;
    USER_LIST_SORT_BY_EMAIL = 4;
    USER_LIST_SORT_BY_STATUS = 5;
    USER_LIST_SORT_BY_ROLE = 6;
}

enum RoomListSortBy {
    ROOM_LIST_SORT_BY_UNSPECIFIED = 0;
    ROOM_LIST_SORT_BY_CREATED_AT = 1;
    ROOM_LIST_SORT_BY_UPDATED_AT = 2;
    ROOM_LIST_SORT_BY_LAST_ACTIVITY_AT = 3;
    ROOM_LIST_SORT_BY_NAME = 4;
}

enum RoomMemberListSortBy {
    ROOM_MEMBER_LIST_SORT_BY_UNSPECIFIED = 0;
    ROOM_MEMBER_LIST_SORT_BY_JOINED_AT = 1;
    ROOM_MEMBER_LIST_SORT_BY_USERNAME = 2;
    ROOM_MEMBER_LIST_SORT_BY_ROLE = 3;
}

enum PlaylistListSortBy {
    PLAYLIST_LIST_SORT_BY_UNSPECIFIED = 0;
    PLAYLIST_LIST_SORT_BY_POSITION = 1;
    PLAYLIST_LIST_SORT_BY_NAME = 2;
    PLAYLIST_LIST_SORT_BY_CREATED_AT = 3;
    PLAYLIST_LIST_SORT_BY_UPDATED_AT = 4;
}

enum MediaListSortBy {
    MEDIA_LIST_SORT_BY_UNSPECIFIED = 0;
    MEDIA_LIST_SORT_BY_POSITION = 1;
    MEDIA_LIST_SORT_BY_NAME = 2;
    MEDIA_LIST_SORT_BY_ADDED_AT = 3;
    MEDIA_LIST_SORT_BY_UPDATED_AT = 4;
    MEDIA_LIST_SORT_BY_SOURCE_PROVIDER = 5;
    MEDIA_LIST_SORT_BY_PROVIDER_INSTANCE_NAME = 6;
}

enum RelatedRoomListSortBy {
    RELATED_ROOM_LIST_SORT_BY_UNSPECIFIED = 0;
    RELATED_ROOM_LIST_SORT_BY_JOINED_AT = 1;
    RELATED_ROOM_LIST_SORT_BY_CREATED_AT = 2;
    RELATED_ROOM_LIST_SORT_BY_UPDATED_AT = 3;
    RELATED_ROOM_LIST_SORT_BY_LAST_ACTIVITY_AT = 4;
    RELATED_ROOM_LIST_SORT_BY_NAME = 5;
}

enum ActiveStreamListSortBy {
    ACTIVE_STREAM_LIST_SORT_BY_UNSPECIFIED = 0;
    ACTIVE_STREAM_LIST_SORT_BY_STARTED_AT = 1;
    ACTIVE_STREAM_LIST_SORT_BY_ROOM_ID = 2;
    ACTIVE_STREAM_LIST_SORT_BY_MEDIA_ID = 3;
    ACTIVE_STREAM_LIST_SORT_BY_USER_ID = 4;
    ACTIVE_STREAM_LIST_SORT_BY_NODE_ID = 5;
}

enum RoomStreamListSortBy {
    ROOM_STREAM_LIST_SORT_BY_UNSPECIFIED = 0;
    ROOM_STREAM_LIST_SORT_BY_MEDIA_ID = 1;
}

message ListUsersRequest {
    int32 page = 1;
    int32 page_size = 2;
    synctv.common.UserStatus status = 3;
    synctv.common.UserRole role = 4;
    string search = 5;
    UserListSortBy sort_by = 6;
    SortDirection sort_direction = 7;
    optional bool is_banned = 8;
}

message UserRef {
    oneof value {
        string user_id = 1;
        string username = 2;
    }
}

message GetUserRequest {
    UserRef user = 1;
}

message GetUserPreferencesRequest {
    UserRef user = 1;
}

message UpdateUserPreferencesRequest {
    UserRef user = 1;
    optional bool two_factor_enabled = 2;
    synctv.client.UserNotificationPreferences notifications = 4;
}

message AddAdminRequest {
    UserRef user = 1;
}

message RemoveAdminRequest {
    UserRef user = 1;
}

message ListAdminsRequest {
    int32 page = 1;
    int32 page_size = 2;
    string search = 3;
    UserListSortBy sort_by = 4;
    SortDirection sort_direction = 5;
}

message CreateUserRequest {
    string username = 1;
    string email = 2;
    synctv.common.UserRole role = 3;
    synctv.common.UserStatus status = 4;
    string password = 5;
}

message DeleteUserRequest {
    UserRef user = 1;
}

message BanUserRequest {
    UserRef user = 1;
    string reason = 2;
}

message UnbanUserRequest {
    UserRef user = 1;
}

message UpdateUserRoleRequest {
    UserRef user = 1;
    synctv.common.UserRole role = 2;
}

message SetUserPasswordRequest {
    UserRef user = 1;
    string password = 2;
    string reason = 3;
}

message UpdateUserUsernameRequest {
    UserRef user = 1;
    string new_username = 2;
}

message GetUserRoomsRequest {
    UserRef user = 1;
    int32 page = 2;
    int32 page_size = 3;
    synctv.common.RoomStatus status = 4;
    string search = 5;
    optional bool is_banned = 6;
    RoomListSortBy sort_by = 7;
    SortDirection sort_direction = 8;
}

message BatchBanUsersRequest {
    repeated UserRef users = 1;
    string reason = 2;
}

message BatchDeleteUsersRequest {
    repeated UserRef users = 1;
}

message ListUserRegistrationReviewsRequest {
    int32 page = 1;
    int32 page_size = 2;
    synctv.common.ReviewStatus status = 3;
    string search = 4;
}

message ApproveUserRegistrationReviewRequest {
    string request_id = 1;
}

message RejectUserRegistrationReviewRequest {
    string request_id = 1;
    string reason = 2;
}

message ListRoomCreationReviewsRequest {
    int32 page = 1;
    int32 page_size = 2;
    synctv.common.ReviewStatus status = 3;
    string requested_by = 4;
    string search = 5;
}

message ApproveRoomCreationReviewRequest {
    string request_id = 1;
}

message RejectRoomCreationReviewRequest {
    string request_id = 1;
    string reason = 2;
}

message ListRoomJoinReviewsRequest {
    int32 page = 1;
    int32 page_size = 2;
    synctv.common.ReviewStatus status = 3;
    string room_id = 4;
    string user_id = 5;
}

message ApproveRoomJoinReviewRequest {
    string request_id = 1;
}

message RejectRoomJoinReviewRequest {
    string request_id = 1;
    string reason = 2;
}

message ListBanRecordsRequest {
    int32 page = 1;
    int32 page_size = 2;
    synctv.admin.BanTargetType target_type = 3;
    optional bool active = 4;
    string user_id = 5;
    string room_id = 6;
}

message CreateRoomRequest {
    UserRef actor = 1;
    string name = 2;
    string password = 3;
    string description = 4;
    bytes settings_json = 5;
}

message ListRoomsRequest {
    int32 page = 1;
    int32 page_size = 2;
    synctv.common.RoomStatus status = 3;
    string search = 4;
    UserRef creator = 5;
    optional bool is_banned = 6;
    RoomListSortBy sort_by = 7;
    SortDirection sort_direction = 8;
}

message GetRoomRequest {
    string room_id = 1;
}

message GetRoomMembersRequest {
    string room_id = 1;
    int32 page = 2;
    int32 page_size = 3;
    string search = 4;
    synctv.common.RoomMemberRole role = 5;
    RoomMemberListSortBy sort_by = 7;
    SortDirection sort_direction = 8;
}

message TransferRoomOwnershipRequest {
    string room_id = 1;
    UserRef actor = 2;
    UserRef new_owner = 3;
}

message AddMemberRequest {
    string room_id = 1;
    UserRef user = 2;
    synctv.common.RoomMemberRole role = 3;
    bool notify = 4;
}

message UpdateMemberPermissionsRequest {
    string room_id = 1;
    UserRef user = 2;
    synctv.common.RoomMemberRole role = 3;
    uint64 added_permissions = 4;
    uint64 removed_permissions = 5;
    uint64 admin_added_permissions = 6;
    uint64 admin_removed_permissions = 7;
}

message KickMemberRequest {
    string room_id = 1;
    UserRef user = 2;
    int64 kick_cooldown_seconds = 3;
}

message GetRoomSettingsRequest {
    string room_id = 1;
}

message UpdateRoomSettingsRequest {
    string room_id = 1;
    bytes settings_json = 2;
}

message ResetRoomSettingsRequest {
    string room_id = 1;
}

message UpdateRoomPasswordRequest {
    string room_id = 1;
    optional string new_password = 2;
    bool clear = 3;
}

message BanRoomRequest {
    string room_id = 1;
    string reason = 2;
}

message UnbanRoomRequest {
    string room_id = 1;
}

message DeleteRoomRequest {
    string room_id = 1;
}

message BatchBanRoomsRequest {
    repeated string room_ids = 1;
    string reason = 2;
}

message BatchDeleteRoomsRequest {
    repeated string room_ids = 1;
}

message StartPlaybackRequest {
    string room_id = 1;
    string media_id = 2;
    string playlist_id = 3;
    bytes target_json = 4;
}

message StopPlaybackRequest {
    string room_id = 1;
}

message GetPlaybackRequest {
    string room_id = 1;
    synctv.client.PlaybackClientProfile playback_client_profile = 2;
}

message UpdatePlaybackRequest {
    string room_id = 1;
    synctv.client.UpdatePlaybackRequest update = 2;
}

message CreatePublishKeyRequest {
    UserRef actor = 1;
    string room_id = 2;
    string media_id = 3;
}

message GetStreamInfoRequest {
    string room_id = 1;
    string media_id = 2;
}

message ListRoomStreamsRequest {
    string room_id = 1;
    int32 page = 2;
    int32 page_size = 3;
    string search = 4;
    RoomStreamListSortBy sort_by = 5;
    SortDirection sort_direction = 6;
}

message KickRoomStreamRequest {
    string room_id = 1;
    string media_id = 2;
    string reason = 3;
}

message ListPlaylistsRequest {
    string room_id = 1;
    string parent_id = 2;
    int32 page = 3;
    int32 page_size = 4;
    string search = 5;
    string source_provider = 6;
    string provider_instance_name = 7;
    optional bool dynamic_only = 8;
    PlaylistListSortBy sort_by = 9;
    SortDirection sort_direction = 10;
    synctv.client.ResourceAvailabilityFilter availability = 11;
}

message GetPlaylistRequest {
    string room_id = 1;
    string playlist_id = 2;
}

message CreatePlaylistRequest {
    UserRef actor = 1;
    string room_id = 2;
    string name = 3;
    string parent_id = 4;
    string source_provider = 5;
    bytes source_config_json = 6;
    string provider_instance_name = 7;
}

message CreateAlistPlaylistRequest {
    UserRef actor = 1;
    string room_id = 2;
    string name = 3;
    string parent_id = 4;
    string server_id = 5;
    string path = 6;
    string password = 7;
    string provider_instance_name = 8;
}

message CreateEmbyPlaylistRequest {
    UserRef actor = 1;
    string room_id = 2;
    string name = 3;
    string parent_id = 4;
    string server_id = 5;
    string item_id = 6;
    string provider_instance_name = 7;
}

message UpdatePlaylistRequest {
    string room_id = 1;
    string playlist_id = 2;
    optional string name = 3;
}

message MovePlaylistRequest {
    string room_id = 1;
    string playlist_id = 2;
    oneof anchor {
        string before_playlist_id = 3;
        string after_playlist_id = 4;
    }
}

message DeletePlaylistRequest {
    string room_id = 1;
    string playlist_id = 2;
    bool force = 3;
}

message ListMediaRequest {
    string room_id = 1;
    string playlist_id = 2;
    bytes target_json = 3;
    int32 page = 4;
    int32 page_size = 5;
    string search = 6;
    string source_provider = 7;
    string provider_instance_name = 8;
    MediaListSortBy sort_by = 9;
    SortDirection sort_direction = 10;
    bool refresh = 11;
    synctv.client.ResourceAvailabilityFilter availability = 12;
}

message AddMediaRequest {
    UserRef actor = 1;
    string room_id = 2;
    string playlist_id = 3;
    string source_provider = 4;
    string provider_instance_name = 5;
    bytes source_config_json = 6;
    string name = 7;
}

message AddDirectUrlMediaRequest {
    UserRef actor = 1;
    string room_id = 2;
    string url = 3;
    string playlist_id = 4;
    string name = 5;
}

message AddAlistMediaRequest {
    UserRef actor = 1;
    string room_id = 2;
    string playlist_id = 3;
    string server_id = 4;
    string path = 5;
    string password = 6;
    string provider_instance_name = 7;
    string name = 8;
}

message AddEmbyMediaRequest {
    UserRef actor = 1;
    string room_id = 2;
    string playlist_id = 3;
    string server_id = 4;
    string item_id = 5;
    string provider_instance_name = 6;
    string name = 7;
}

message AddBilibiliVideoMediaRequest {
    UserRef actor = 1;
    string room_id = 2;
    string playlist_id = 3;
    string bvid = 4;
    optional uint64 aid = 5;
    uint64 cid = 6;
    bool shared = 7;
    string provider_instance_name = 8;
    string name = 9;
}

message AddBilibiliPgcMediaRequest {
    UserRef actor = 1;
    string room_id = 2;
    string playlist_id = 3;
    uint64 epid = 4;
    uint64 cid = 5;
    bool shared = 6;
    string provider_instance_name = 7;
    string name = 8;
}

message AddBilibiliLiveMediaRequest {
    UserRef actor = 1;
    string room_id = 2;
    string playlist_id = 3;
    uint64 room_live_id = 4;
    bool shared = 5;
    string provider_instance_name = 6;
    string name = 7;
}

message EditMediaRequest {
    string room_id = 1;
    string media_id = 2;
    string name = 3;
}

message MoveMediaRequest {
    string room_id = 1;
    repeated string media_ids = 2;
    optional string source_playlist_id = 3;
    optional string target_playlist_id = 4;
    bool all_from_scope = 5;
