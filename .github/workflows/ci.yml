name: CI Pipeline

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  schedule:
    # Run security audit daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SYNCTV_LOGGING_BACKTRACE: true
  SQLX_OFFLINE: true

jobs:
  # Check code formatting
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  # Build
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --verbose --locked

  proto-freshness:
    name: Proto Freshness
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Regenerate proto artifacts
        run: scripts/regen-proto.sh

      - name: Check generated proto artifacts
        run: git diff --exit-code -- synctv-proto/src synctv-media-providers/src/proto

  # SQLx offline metadata
  sqlx-offline:
    name: SQLx Offline Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check SQLx offline metadata
        run: cargo check --workspace --all-targets --locked

  feature-check:
    name: Feature Check (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: synctv-no-default-features
            command: cargo check -p synctv --no-default-features --locked
          - name: synctv-tls-aws-lc-webpki
            command: cargo check -p synctv --no-default-features --features "tls-aws-lc,tls-webpki-roots" --locked
          - name: synctv-tls-aws-lc-native
            command: cargo check -p synctv --no-default-features --features "tls-aws-lc,tls-native-roots" --locked
          - name: synctv-tls-ring-webpki
            command: cargo check -p synctv --no-default-features --features "tls-ring,tls-webpki-roots" --locked
          - name: synctv-tls-ring-native
            command: cargo check -p synctv --no-default-features --features "tls-ring,tls-native-roots" --locked
          - name: synctv-production-no-openapi
            command: cargo check -p synctv --no-default-features --features "k8s,mimalloc,tls-aws-lc,tls-webpki-roots,tls-native-roots" --locked
          - name: key-crates-tls-ring-webpki
            command: |
              cargo check -p synctv-core --no-default-features --features "tls-ring,tls-webpki-roots" --locked
              cargo check -p synctv-api --no-default-features --features "tls-ring,tls-webpki-roots" --locked
              cargo check -p synctv-cluster --no-default-features --features "tls-ring,tls-webpki-roots" --locked
              cargo check -p synctv-realtime --no-default-features --features "tls-ring,tls-webpki-roots" --locked
              cargo check -p synctv-livestream --no-default-features --features "tls-ring,tls-webpki-roots" --locked
              cargo check -p synctv-media-providers --no-default-features --features "tls-ring,tls-webpki-roots" --locked
              cargo check -p synctv-proxy --no-default-features --features "tls-ring,tls-webpki-roots" --locked

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run feature check
        run: ${{ matrix.command }}

  # Test non-ignored cases
  test-default:
    name: Test Default (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    env:
      SYNCTV_TEST_DOCKER_STARTUP_TIMEOUT_SECS: 600
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install protobuf compiler on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install protobuf compiler on macOS
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install protobuf compiler on Windows
        if: runner.os == 'Windows'
        run: choco install protoc --yes

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        timeout-minutes: 60
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run non-ignored tests with nextest
        timeout-minutes: 60
        run: |
          cargo nextest run --workspace --locked --run-ignored default --nff

      - name: Run documentation tests
        timeout-minutes: 20
        run: |
          cargo test --workspace --doc --locked

  # Test ignored cases
  test-ignored:
    name: Test Ignored (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
    env:
      SYNCTV_TEST_DOCKER_STARTUP_TIMEOUT_SECS: 600
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install protobuf compiler on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run ignored tests with nextest
        timeout-minutes: 60
        run: |
          cargo nextest run --workspace --locked --run-ignored only --nff

  # Security audit
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run security audit
        run: cargo audit --deny warnings
        # SECURITY: Audit failures should block the build

      - name: Run security audit (advisories)
        run: cargo audit
        continue-on-error: true # Informational output

  # Dependency policy enforcement with cargo-deny
  cargo-deny:
    name: Dependency Policy Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Run cargo-deny check
        run: cargo deny check

      - name: Run cargo-deny check (advisories only - fail on vulnerabilities)
        run: cargo deny check advisories
        continue-on-error: false

      - name: Run cargo-deny check (licenses)
        run: cargo deny check licenses
        continue-on-error: true # Warn but don't fail

      - name: Run cargo-deny check (bans)
        run: cargo deny check bans
        continue-on-error: true # Warn about multiple versions

      - name: Run cargo-deny check (sources)
        run: cargo deny check sources
        continue-on-error: false # Fail on untrusted sources

  # Check for unused dependencies
  udeps:
    name: Unused Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install cargo-udeps
        run: cargo install cargo-udeps --locked

      - name: Check for unused dependencies
        run: cargo +nightly udeps --locked --all-targets
        continue-on-error: true # Don't fail the build, just report
