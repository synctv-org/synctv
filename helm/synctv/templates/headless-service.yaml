{{- if or .Values.headlessService.enabled (and .Values.config.cluster.enabled (eq (.Values.config.cluster.discoveryMode | default "redis") "k8s_dns")) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "synctv.fullname" . }}-headless
  labels:
    {{- include "synctv.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "synctv.selectorLabels" . | nindent 4 }}
  ports:
    - name: api
      port: {{ .Values.config.server.port }}
      targetPort: api
      protocol: TCP
{{- end }}
