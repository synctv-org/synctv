# SyncTV Configuration Example
#
# Copy this file to config.yaml and modify as needed
#
# Configuration priority: defaults < config file < environment variables
#
# Environment variables use SYNCTV_ prefix with double-underscore separator:
#   SYNCTV__SERVER__HOST=0.0.0.0
#   SYNCTV__DATABASE__URL=postgresql://...
#   SYNCTV__OAUTH2__REDIRECT_SCHEME=https

server:
  host: "0.0.0.0"
  grpc_port: 50051
  http_port: 8080
  enable_reflection: true
  # Enable the /metrics Prometheus endpoint
  metrics_enabled: false
  # Trusted proxy IP addresses/CIDRs for X-Forwarded-For validation.
  # If empty, X-Forwarded-For headers are NOT trusted (socket address is used).
  # Example: ["10.0.0.0/8", "192.168.0.0/16"]
  trusted_proxies: []
  # CORS allowed origins for cross-origin requests from web frontends.
  #
  # You MUST set this to your frontend URL(s) or cross-origin
  # requests (fetch, WebSocket upgrades from browsers) will be rejected.
  #
  # Examples:
  #   cors_allowed_origins: ["https://app.example.com"]
  #   cors_allowed_origins: ["https://app.example.com", "https://admin.example.com"]
  #
  # Environment variable:
  #   SYNCTV__SERVER__CORS_ALLOWED_ORIGINS='["https://app.example.com"]'
  #
  # WARNING: An empty list in production means ALL cross-origin requests are denied.
  cors_allowed_origins: []
  # Shared secret for authenticating cluster gRPC calls between nodes.
  # REQUIRED when Redis is configured — startup fails if this is empty and redis.url is set.
  # This prevents unauthorized inter-node gRPC calls in multi-replica deployments.
  # Generate a secret with: openssl rand -hex 32
  # Environment variable: SYNCTV_SERVER_CLUSTER_SECRET
  cluster_secret: ""
  # Advertise host for cluster node registration (address other nodes use to reach this instance).
  # Falls back to POD_IP env var, then system hostname if empty.
  # In Kubernetes, set via SYNCTV__SERVER__ADVERTISE_HOST or downward API (status.podIP).
  advertise_host: ""
  # Maximum time in seconds to wait for active connections to drain during shutdown.
  # Defaults to 30 seconds. Increase for deployments with many long-lived connections.
  shutdown_drain_timeout_seconds: 30
  # Disable the legacy ?token=<jwt> WebSocket query parameter authentication.
  # When true, only Authorization header and ?ticket= are accepted for WebSocket auth.
  # Defaults to true (disabled) for security.
  disable_ws_token_query: true

database:
  url: "postgresql://synctv:synctv@localhost:5432/synctv"
  max_connections: 20
  min_connections: 5
  connect_timeout_seconds: 10
  idle_timeout_seconds: 600
  # Maximum lifetime of a connection in seconds before it is closed and replaced.
  # Defaults to 1800 (30 minutes).
  max_lifetime_seconds: 1800

# ============================================================================
# Redis Configuration
# ============================================================================
#
# Redis provides critical infrastructure for:
#   - Token blacklist (JWT revocation across replicas)
#   - Rate limiting
#   - Username cache
#   - Cache invalidation (Redis Streams with per-node consumer groups)
#   - Cluster coordination (pub/sub for room events, kicks, etc.)
#
# Deployment Modes:
#   - standalone: Single Redis instance (default, OK for development)
#   - sentinel: Redis Sentinel for high availability (recommended for production)
#   - cluster: Redis Cluster (not yet fully supported - requires refactoring)
#
# IMPORTANT: Standalone Redis is a single point of failure (SPOF). For production
# deployments, use sentinel mode with 3+ sentinel nodes monitoring a master-replica setup.

redis:
  url: "redis://localhost:6379"
  pool_size: 10
  connect_timeout_seconds: 5
  key_prefix: "synctv:"

  # Deployment mode: standalone, sentinel, or cluster
  deployment_mode: "standalone"

  # --- Sentinel Mode Configuration (for high availability) ---
  # When deployment_mode is "sentinel", these fields are required:
  # sentinel_master_name: "mymaster"
  # sentinel_addresses:
  #   - "redis://sentinel1:26379"
  #   - "redis://sentinel2:26379"
  #   - "redis://sentinel3:26379"

  # --- Cluster Mode Configuration (experimental) ---
  # Cluster mode is not yet fully supported and will fail at startup.
  # Future implementation will require switching from ConnectionManager to ClusterConnection.
  # cluster_nodes:
  #   - "redis://node1:6379"
  #   - "redis://node2:6379"
  #   - "redis://node3:6379"

jwt:
  # REQUIRED in production. Generate with: openssl rand -base64 32
  # Minimum 32 characters with high entropy (at least 16 unique characters).
  secret: ""
  access_token_duration_hours: 1
  refresh_token_duration_days: 30
  # Duration for guest (anonymous) access tokens
  guest_token_duration_hours: 4
  # Clock skew leeway for token validation (seconds)
  clock_skew_leeway_secs: 60

logging:
  level: "info"
  format: "pretty"
  # file_path: "/var/log/synctv/app.log"

livestream:
  rtmp_port: 1935
  gop_cache_size: 2
  stream_timeout_seconds: 300
  # How often to check for idle streams (seconds)
  cleanup_check_interval_seconds: 60
  # Max retries for pull stream connections
  pull_max_retries: 10
  # Initial backoff for pull retries (milliseconds)
  pull_initial_backoff_ms: 1000
  # Max backoff for pull retries (milliseconds)
  pull_max_backoff_ms: 30000
  # Max FLV tag size to accept in bytes (prevents OOM). Default: 10MB
  max_flv_tag_size_bytes: 10485760
  # Maximum memory (in megabytes) for the GOP cache across all GOPs per stream.
  # When exceeded, the oldest GOP is evicted even if gop_cache_size hasn't
  # been reached. Default: 100 MB. Set to 0 to use the built-in default (50 MB).
  gop_cache_max_memory_mb: 100

# ============================================================================
# Email Configuration (SMTP)
# ============================================================================
#
# Configure SMTP to enable email features (verification, notifications).
# Leave smtp_host empty to disable email functionality.

email:
  smtp_host: ""
  smtp_port: 587
  smtp_username: ""
  smtp_password: ""  # Set via SYNCTV__EMAIL__SMTP_PASSWORD env var
  from_email: ""
  from_name: "SyncTV"
  use_tls: true

# ============================================================================
# Password Complexity Requirements
# ============================================================================
#
# Controls password strength validation for user account passwords.
# These settings do NOT apply to room passwords (which have simpler requirements).

password_complexity:
  # Minimum password length
  min_length: 8
  # Require at least one uppercase letter
  require_uppercase: true
  # Require at least one lowercase letter
  require_lowercase: true
  # Require at least one digit
  require_digit: true
  # Require at least one special character (e.g., !@#$%^&*)
  require_special: false
  # Maximum consecutive repeated characters allowed (prevents "aaaaaa").
  # Set to 0 to disable this check.
  max_repeated_chars: 3

# ============================================================================
# Connection Limits
# ============================================================================
#
# Controls concurrent WebSocket/streaming connection limits.

connection_limits:
  # Maximum concurrent connections per user
  max_per_user: 5
  # Maximum concurrent connections per room
  max_per_room: 200
  # Maximum total concurrent connections
  max_total: 10000
  # Idle timeout in seconds (disconnect if no activity)
  idle_timeout_seconds: 300
  # Maximum connection duration in seconds (24 hours)
  max_duration_seconds: 86400
  # Global per-connection WebSocket message rate limit (messages per second).
  # Prevents abuse from flooding the server with rapid messages.
  ws_message_rate_limit_per_second: 50

# ============================================================================
# Bootstrap Configuration
# ============================================================================
#
# Initial setup options for first startup.
# IMPORTANT: Change root_password in production!

bootstrap:
  # Whether to create root user on first startup
  create_root_user: true
  root_username: "root"
  # Set via SYNCTV__BOOTSTRAP__ROOT_PASSWORD env var.
  # In production, must be >= 12 chars with uppercase, lowercase, and digits.
  root_password: "root"

# ============================================================================
# Cluster Configuration
# ============================================================================
#
# Controls internal channel buffer sizes for cluster communication
# and the discovery mechanism for multi-node deployments.

cluster:
  # Capacity for high-priority critical event channel (KickPublisher, KickUser, etc.)
  # Critical events are never dropped; senders block when full.
  critical_channel_capacity: 1000
  # Capacity for normal-priority Redis publish channel.
  # Normal events are dropped with a warning when full.
  publish_channel_capacity: 10000
  # Discovery mode: "redis" (default) or "k8s_dns" (requires HEADLESS_SERVICE_NAME
  # and POD_NAMESPACE env vars).
  #
  # IMPORTANT: "k8s_dns" mode still requires Redis for health monitoring, load
  # balancing, and cluster pub/sub. DNS only supplements peer discovery by detecting
  # new pods faster. Without Redis, k8s_dns provides DNS resolution only -- no
  # NodeRegistry, HealthMonitor, or LoadBalancer will be created.
  discovery_mode: "redis"

  # --- Static Discovery Configuration ---
  # When discovery_mode is "static", list peers explicitly.
  # Each peer requires a gRPC address; http_address is optional and will be
  # derived from the gRPC address (replacing the port with default_http_port)
  # if not specified.
  #
  # static_peers:
  #   - grpc_address: "node2.example.com:50051"
  #     http_address: "node2.example.com:8080"   # optional
  #   - grpc_address: "node3.example.com:50051"
  #     # http_address omitted: derived as node3.example.com:8080
  # default_http_port: 8080

  # Leader election mode for singleton operations.
  # - "redis": Use Redis-based distributed locks (default, works everywhere)
  # - "k8s_lease": Use Kubernetes coordination.k8s.io/v1 Lease resource
  #   (requires POD_NAME and POD_NAMESPACE env vars, RBAC permissions)
  leader_election_mode: "redis"

  # How far back (in seconds) to replay Redis Stream events when a new node
  # first connects to the cluster.  Replaying recent history prevents events
  # published just before this node subscribed from being silently missed.
  # Increase in clusters with high event rates; decrease to shorten startup
  # replay time.  Default: 300 (5 minutes).
  catchup_window_secs: 300

# ============================================================================
# Media Providers Configuration
# ============================================================================
#
# Stores media provider configurations (Alist, Emby, Jellyfin, Bilibili, etc.)

media_providers:
  # Provider configurations as a dynamic JSON/YAML value.
  # Example:
  # providers:
  #   alist:
  #     base_url: "https://alist.example.com"
  #     token: "your_token"
  #   emby:
  #     base_url: "https://emby.example.com"
  #     api_key: "your_api_key"
  providers: {}

# ============================================================================
# OAuth2/OIDC Configuration
# ============================================================================
#
# Providers are configured as a YAML string that is parsed separately
# to support dynamic provider-specific fields.
#
# Supported Providers:
#   - github:  GitHub OAuth2
#   - google:  Google OAuth2
#   - oidc:    Generic OIDC provider with .well-known discovery
#              Supports issuer, auth_url, token_url, userinfo_url fields
#   - qq, gitee, feishu, wechat: Chinese OAuth2 Providers (not yet implemented)
#   - Any OIDC-compliant provider (Casdoor, Keycloak, Authelia, etc.)
#     requires 'type: oidc' field
#
# Common fields (all providers):
#   client_id: OAuth2 client ID
#   client_secret: OAuth2 client secret
#   redirect_url: (optional, auto-generated if not provided)
#
# Provider-specific fields:
#   logto:
#     endpoint: Logto server URL (e.g., "https://logto.example.com")
#   oidc:
#     issuer: Issuer URL for .well-known discovery
#     auth_url: (optional) Custom authorization endpoint
#     token_url: (optional) Custom token endpoint
#     userinfo_url: (optional) Custom userinfo endpoint
#
# Multiple Provider Instances:
#   Use different instance names (e.g., logto1, logto2) and add 'type' field
#   to specify the provider type.
#
# Callback URLs are automatically generated based on instance name:
#   http://<server.host>/api/oauth2/<instance_name>/callback
#   Examples:
#     http://localhost:8080/api/oauth2/github/callback
#     http://localhost:8080/api/oauth2/logto1/callback
#
# Security Notes:
#   - OAuth2 tokens are only used temporarily during login and then discarded
#   - Only provider-user mappings are stored (for future logins)
#   - Always use HTTPS in production for OAuth2 callbacks

oauth2:
  # URL scheme for OAuth2 redirect URLs ("http" or "https").
  # When behind a reverse proxy terminating TLS, set to "https".
  redirect_scheme: "http"
  # Example configuration (uncomment and modify):
  # providers: |
  #   # Standard OAuth2 Providers
  #   github:
  #     client_id: "your_github_client_id"
  #     client_secret: "your_github_client_secret"
  #
  #   google:
  #     client_id: "your_google_client_id"
  #     client_secret: "your_google_client_secret"
  #
  #   # Multiple instances of same provider (requires 'type' field)
  #   logto1:
  #     type: logto
  #     client_id: "logto1_client_id"
  #     client_secret: "logto1_client_secret"
  #     endpoint: "https://logto1.example.com"
  #
  #   logto2:
  #     type: logto
  #     client_id: "logto2_client_id"
  #     client_secret: "logto2_client_secret"
  #     endpoint: "https://logto2.example.com"
  #
  #   # Generic OIDC provider
  #   custom_oidc:
  #     type: oidc
  #     client_id: "custom_client_id"
  #     client_secret: "custom_client_secret"
  #     issuer: "https://custom.oidc.provider.com"
  providers: ""

# Environment Variables for OAuth2:
#   Format: SYNCTV__OAUTH2__<FIELD>
#   Examples:
#     SYNCTV__OAUTH2__REDIRECT_SCHEME=https

# ============================================================================
# WebRTC Configuration
# ============================================================================
#
# WebRTC supports 2 operation modes:
#   - signaling_only: Pure signaling relay (zero cost, ~70% success rate)
#   - peer_to_peer:   P2P with STUN/TURN (recommended, ~99% success rate)

webrtc:
  mode: "peer_to_peer"

  # --- Built-in STUN Server ---
  enable_builtin_stun: true
  stun_port: 3478
  stun_host: "0.0.0.0"
  # External address for STUN reflexive candidates. In K8s/NAT, set to
  # the pod IP or service IP (e.g., via SYNCTV__WEBRTC__STUN_EXTERNAL_ADDR).
  # If empty, falls back to advertise_host:stun_port.
  # stun_external_addr: ""

  # --- External STUN & TURN Servers ---
  # Configured dynamically via the settings API (no restart required):
  #   "webrtc.external_stun_servers" - JSON array of STUN URLs, e.g.:
  #       ["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302"]
  #   "webrtc.turn_servers" - JSON array of TURN server objects, e.g.:
  #       [{"urls":["turn:turn.example.com:3478"],"username":"user","credential":"pass"}]

# ============================================================================
# Dynamic ICE Servers Configuration
# ============================================================================
#
# External STUN and TURN servers are managed via the settings API at runtime.
#
# Setting key: "webrtc.external_stun_servers"
# Value: JSON array of STUN URL strings
#   Default: ["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302"]
#
# Setting key: "webrtc.turn_servers"
# Value: JSON array of TURN server objects
#   [{"urls":["turn:turn.example.com:3478"],"username":"user","credential":"pass"}]
#   Default: [] (no TURN servers)
#
# Changes take effect immediately without restarting the server.

# ============================================================================
# Buffer Size Tuning
# ============================================================================
#
# Controls internal channel buffer sizes. Larger values provide more resilience
# during traffic spikes but use more memory. Defaults match the original
# hardcoded values for backward compatibility.
#
# Additional buffer sizes are configured in their respective sections:
#   - cluster.critical_channel_capacity (default: 1000)
#   - cluster.publish_channel_capacity (default: 10000)
#   - livestream.stream_hub_event_channel_capacity (default: 4096)

buffer_sizes:
  # Per-connection WebSocket outbound message queue.
  # When full, new messages are dropped (backpressure for slow clients).
  websocket_outbound: 256
  # Audit log event buffer. Events are batched and flushed to the database.
  # When full, new audit events are dropped with a warning.
  audit_buffer: 10000
