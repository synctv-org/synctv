{{- if not .Values.existingSecret -}}
{{- $secretName := include "synctv.secretName" . -}}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $dbPassword := "" -}}
{{- $redisPassword := "" -}}
{{- $jwtSecret := "" -}}
{{- $clusterSecret := "" -}}
{{- $rootPassword := "" -}}
{{- $credentialEncryptionKey := "" -}}
{{- $oauth2EncryptionKey := "" -}}

{{- if $existingSecret -}}
  {{- /* Preserve existing secret values on upgrade.
       Prefer the dedicated _PASSWORD keys (added in this version) which store
       the raw password without URL encoding.  Fall back to regex extraction
       from the URL for upgrades from older chart versions. */ -}}
  {{- if hasKey $existingSecret.data "SYNCTV_DATABASE_PASSWORD" -}}
    {{- $dbPassword = index $existingSecret.data "SYNCTV_DATABASE_PASSWORD" | b64dec -}}
  {{- else -}}
    {{- $dbPassword = index $existingSecret.data "SYNCTV_DATABASE_URL" | b64dec | regexFind "://[^:]*:(.*?)@" | regexReplaceAll "^://[^:]*:" "" | trimSuffix "@" -}}
  {{- end -}}
  {{- if hasKey $existingSecret.data "SYNCTV_REDIS_PASSWORD" -}}
    {{- $redisPassword = index $existingSecret.data "SYNCTV_REDIS_PASSWORD" | b64dec -}}
  {{- else -}}
    {{- $redisPassword = index $existingSecret.data "SYNCTV_REDIS_URL" | b64dec | regexFind "://:(.*?)@" | trimPrefix "://:" | trimSuffix "@" -}}
  {{- end -}}
  {{- $jwtSecret = index $existingSecret.data "SYNCTV_JWT_SECRET" | b64dec -}}
  {{- $clusterSecret = index $existingSecret.data "SYNCTV_SERVER_CLUSTER_SECRET" | b64dec -}}
  {{- if hasKey $existingSecret.data "SYNCTV_BOOTSTRAP_ROOT_PASSWORD" -}}
    {{- $rootPassword = index $existingSecret.data "SYNCTV_BOOTSTRAP_ROOT_PASSWORD" | b64dec -}}
  {{- end -}}
  {{- if hasKey $existingSecret.data "SYNCTV_CREDENTIAL_ENCRYPTION_KEY" -}}
    {{- $credentialEncryptionKey = index $existingSecret.data "SYNCTV_CREDENTIAL_ENCRYPTION_KEY" | b64dec -}}
  {{- end -}}
  {{- if hasKey $existingSecret.data "SYNCTV_OAUTH2_ENCRYPTION_KEY" -}}
    {{- $oauth2EncryptionKey = index $existingSecret.data "SYNCTV_OAUTH2_ENCRYPTION_KEY" | b64dec -}}
  {{- end -}}
{{- else -}}
  {{- /* Generate random passwords on first install */ -}}
  {{- if .Values.secrets.database.password -}}
    {{- $dbPassword = .Values.secrets.database.password -}}
  {{- else -}}
    {{- $dbPassword = randAlphaNum 32 -}}
  {{- end -}}
  {{- if .Values.secrets.redis.password -}}
    {{- $redisPassword = .Values.secrets.redis.password -}}
  {{- else -}}
    {{- $redisPassword = randAlphaNum 32 -}}
  {{- end -}}
  {{- if .Values.secrets.jwt.secret -}}
    {{- $jwtSecret = .Values.secrets.jwt.secret -}}
  {{- else -}}
    {{- $jwtSecret = randAlphaNum 64 -}}
  {{- end -}}
  {{- if .Values.secrets.cluster.grpcSecret -}}
    {{- $clusterSecret = .Values.secrets.cluster.grpcSecret -}}
  {{- else -}}
    {{- $clusterSecret = randAlphaNum 32 -}}
  {{- end -}}
  {{- if .Values.secrets.bootstrap -}}
    {{- if .Values.secrets.bootstrap.rootPassword -}}
      {{- $rootPassword = .Values.secrets.bootstrap.rootPassword -}}
    {{- else -}}
      {{- $rootPassword = randAlphaNum 16 -}}
    {{- end -}}
  {{- else -}}
    {{- $rootPassword = randAlphaNum 16 -}}
  {{- end -}}
  {{- if .Values.secrets.credentialEncryptionKey -}}
    {{- $credentialEncryptionKey = .Values.secrets.credentialEncryptionKey -}}
  {{- else -}}
    {{- $credentialEncryptionKey = randAlphaNum 64 -}}
  {{- end -}}
  {{- if .Values.secrets.oauth2EncryptionKey -}}
    {{- $oauth2EncryptionKey = .Values.secrets.oauth2EncryptionKey -}}
  {{- else -}}
    {{- $oauth2EncryptionKey = randAlphaNum 64 -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "synctv.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Raw passwords stored separately for reliable preservation across upgrades
  # (avoids fragile regex extraction from composed URLs)
  SYNCTV_DATABASE_PASSWORD: {{ $dbPassword | quote }}
  {{- if $redisPassword }}
  SYNCTV_REDIS_PASSWORD: {{ $redisPassword | quote }}
  {{- end }}

  # Database URL (full connection string including credentials)
  SYNCTV_DATABASE_URL: {{ printf "postgresql://%s:%s@%s:%v/%s" .Values.secrets.database.username $dbPassword .Values.config.database.host (int .Values.config.database.port) .Values.config.database.name | quote }}

  # Redis URL (full connection string including password)
  {{- if $redisPassword }}
  SYNCTV_REDIS_URL: {{ printf "redis://:%s@%s:%v" $redisPassword .Values.config.redis.host (int .Values.config.redis.port) | quote }}
  {{- else }}
  SYNCTV_REDIS_URL: {{ printf "redis://%s:%v" .Values.config.redis.host (int .Values.config.redis.port) | quote }}
  {{- end }}

  # JWT Secret
  SYNCTV_JWT_SECRET: {{ $jwtSecret | quote }}

  # Cluster gRPC Auth Secret
  SYNCTV_SERVER_CLUSTER_SECRET: {{ $clusterSecret | quote }}

  # Email SMTP Credentials
  {{- if .Values.config.email.smtpHost }}
  SYNCTV_EMAIL_SMTP_USERNAME: {{ .Values.secrets.email.username | quote }}
  SYNCTV_EMAIL_SMTP_PASSWORD: {{ .Values.secrets.email.password | quote }}
  {{- end }}

  # Credential Encryption Key (AES-256-GCM)
  {{- if $credentialEncryptionKey }}
  SYNCTV_CREDENTIAL_ENCRYPTION_KEY: {{ $credentialEncryptionKey | quote }}
  {{- end }}

  # OAuth2 Encryption Key (AES-256-GCM)
  {{- if $oauth2EncryptionKey }}
  SYNCTV_OAUTH2_ENCRYPTION_KEY: {{ $oauth2EncryptionKey | quote }}
  {{- end }}

  # Bootstrap root password
  {{- if $rootPassword }}
  SYNCTV_BOOTSTRAP_ROOT_PASSWORD: {{ $rootPassword | quote }}
  {{- end }}
{{- end }}
