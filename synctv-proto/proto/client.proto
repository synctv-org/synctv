    int32 page_size = 2;  // Items per page (default 50)
}

message StreamEntry {
    string media_id = 1;
    bool active = 2;
}

message ListRoomStreamsResponse {
    repeated StreamEntry streams = 1;
    int32 total = 2; // Total number of active streams
}

