{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "synctv.fullname" . }}
  labels:
    {{- include "synctv.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "synctv.selectorLabels" . | nindent 6 }}
  policyTypes:
    {{- toYaml .Values.networkPolicy.policyTypes | nindent 4 }}
  {{- if has "Ingress" .Values.networkPolicy.policyTypes }}
  ingress:
    # Allow ingress controller (API + WebSocket)
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: {{ .Values.config.server.port }}
    # Allow internal cluster API traffic (inter-node communication)
    - from:
        - podSelector:
            matchLabels:
              {{- include "synctv.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.config.server.port }}
    # Allow RTMP ingest (external publishers)
    - from:
        {{- if .Values.networkPolicy.rtmpSourceCIDRs }}
        {{- range .Values.networkPolicy.rtmpSourceCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
        {{- else }}
        - ipBlock:
            cidr: 0.0.0.0/0
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.config.livestream.rtmpPort }}
    # Allow STUN traffic (WebRTC NAT traversal, UDP)
    {{- if .Values.config.webrtc.enableBuiltinStun }}
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: UDP
          port: {{ .Values.config.webrtc.stunPort }}
    {{- end }}
    # Allow Prometheus scraping
    {{- if .Values.metrics.enabled }}
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: {{ .Values.config.server.port }}
    {{- end }}
  {{- end }}
  {{- if has "Egress" .Values.networkPolicy.policyTypes }}
  egress:
    # Allow DNS (TCP and UDP)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              {{- range $key, $value := .Values.networkPolicy.postgresSelector }}
              {{ $key }}: {{ $value | quote }}
              {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.config.database.port }}
    # Allow Redis
    - to:
        - podSelector:
            matchLabels:
              {{- range $key, $value := .Values.networkPolicy.redisSelector }}
              {{ $key }}: {{ $value | quote }}
              {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.config.redis.port }}
    # Allow internal cluster traffic (shared API port)
    - to:
        - podSelector:
            matchLabels:
              {{- include "synctv.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.config.server.port }}
    # Allow external HTTPS (for OAuth2, media providers)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
  {{- end }}
{{- end }}
