    option (buf.validate.message).cel = {
        id: "start_playback.single_target"
        message: "media_id and playlist_id cannot both be set"
        expression: "!(this.media_id != '' && this.playlist_id != '')"
    };
    option (buf.validate.message).cel = {
        id: "start_playback.clear_target"
        message: "target must be empty when clearing playback"
        expression: "(this.media_id != '' || this.playlist_id != '') || size(this.target) == 0"
    };
    option (buf.validate.message).cel = {
        id: "start_playback.static_target"
        message: "target must be empty when switching to a static media item"
        expression: "this.media_id == '' || size(this.target) == 0"
    };
    option (buf.validate.message).cel = {
        id: "start_playback.dynamic_target"
        message: "target is required when switching to a dynamic playlist item"
        expression: "this.playlist_id == '' || size(this.target) > 0"
    };
    string media_id = 1; // Static media ID. Mutually exclusive with playlist_id.
    string playlist_id = 2; // Dynamic playlist ID. Requires target. Mutually exclusive with media_id.
    bytes target = 3; // Provider-facing playback target payload. Empty for static media playback.
}

message StartPlaybackResponse {
    // Empty: playback started successfully
    // Use GetPlayback to retrieve current state and info
}

