name: Helm Release

on:
  workflow_call:
    inputs:
      release-tag:
        description: "Release tag, for example v0.2.0"
        required: true
        type: string
    secrets:
      token:
        required: true
      HELM_OCI_REPOSITORY:
        required: false
      HELM_REPOSITORY_URL:
        required: false
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_REPOSITORY:
        required: false
      DOCKERHUB_PASSWORD:
        required: false

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  publish:
    name: Publish Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Configure Git
        run: |
          git config --global user.name "$GITHUB_ACTOR"
          git config --global user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Read chart metadata
        id: chart
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
          GHCR_REPOSITORY: ${{ github.repository }}
          HELM_OCI_REPOSITORY: ${{ vars.HELM_OCI_REPOSITORY || secrets.HELM_OCI_REPOSITORY }}
          HELM_REPOSITORY_BRANCH: ${{ vars.HELM_REPOSITORY_BRANCH || 'helm-charts' }}
          HELM_REPOSITORY_URL: ${{ vars.HELM_REPOSITORY_URL || secrets.HELM_REPOSITORY_URL }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY || secrets.DOCKERHUB_REPOSITORY }}
        run: |
          chart_name="$(ruby -ryaml -e 'puts YAML.load_file(ARGV.fetch(0)).fetch("name")' helm/synctv/Chart.yaml)"
          chart_version="$(ruby -ryaml -e 'puts YAML.load_file(ARGV.fetch(0)).fetch("version")' helm/synctv/Chart.yaml)"
          app_version="$(ruby -ryaml -e 'puts YAML.load_file(ARGV.fetch(0)).fetch("appVersion")' helm/synctv/Chart.yaml)"
          cargo_version="$(cargo metadata --format-version 1 --no-deps | node -e 'const fs = require("fs"); const meta = JSON.parse(fs.readFileSync(0, "utf8")); process.stdout.write(meta.workspace_default_members.length ? meta.packages.find((pkg) => pkg.id === meta.workspace_default_members[0]).version : meta.packages[0].version);')"

          if [ -z "$chart_name" ] || [ -z "$chart_version" ] || [ -z "$app_version" ] || [ -z "$cargo_version" ]; then
            echo "Chart.yaml must define name, version, and appVersion; Cargo.toml must define workspace.package.version." >&2
            exit 1
          fi

          tag_version="${RELEASE_TAG#v}"
          if [ "$chart_version" != "$tag_version" ]; then
            echo "Chart version ($chart_version) must match release tag ($tag_version)." >&2
            exit 1
          fi
          if [ "$app_version" != "$tag_version" ]; then
            echo "Chart appVersion ($app_version) must match release tag ($tag_version)." >&2
            exit 1
          fi
          if [ "$cargo_version" != "$tag_version" ]; then
            echo "Cargo workspace version ($cargo_version) must match release tag ($tag_version)." >&2
            exit 1
          fi

          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          repo="$(printf '%s' "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')"

          if [ -n "$DOCKERHUB_REPOSITORY" ]; then
            case "$DOCKERHUB_REPOSITORY" in
              */*)
                dockerhub_repository="$DOCKERHUB_REPOSITORY"
                ;;
              *)
                dockerhub_repository="$DOCKERHUB_USERNAME/$DOCKERHUB_REPOSITORY"
                ;;
            esac
          elif [ -n "$DOCKERHUB_USERNAME" ]; then
            dockerhub_repository="$DOCKERHUB_USERNAME/$repo"
          fi

          if [ -n "$HELM_REPOSITORY_URL" ]; then
            pages_url="$HELM_REPOSITORY_URL"
          else
            pages_url="https://$owner.github.io/$repo"
          fi

          {
            echo "name=$chart_name"
            echo "version=$chart_version"
            echo "app_version=$app_version"
            echo "pages_url=$pages_url"
            echo "chart_branch=$HELM_REPOSITORY_BRANCH"
            echo "dockerhub_username=$DOCKERHUB_USERNAME"
            echo 'oci_repos<<EOF'
            if [ -n "$HELM_OCI_REPOSITORY" ]; then
              printf '%s\n' "$HELM_OCI_REPOSITORY"
            else
              echo "ghcr.io/$GHCR_REPOSITORY/charts"
              if [ -n "${dockerhub_repository:-}" ]; then
                echo "docker.io/$dockerhub_repository/charts"
              fi
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Validate chart
        run: ./scripts/validate-helm.sh

      - name: Package chart
        run: |
          mkdir -p dist
          helm package ./helm/synctv --destination dist

      - name: Login to GHCR
        run: echo "${{ secrets.token }}" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Login to Docker Hub
        if: steps.chart.outputs.dockerhub_username != ''
        env:
          DOCKERHUB_USERNAME: ${{ steps.chart.outputs.dockerhub_username }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: echo "$DOCKERHUB_PASSWORD" | helm registry login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Push chart to OCI registries
        shell: bash
        run: |
          while IFS= read -r oci_repo; do
            if [ -z "$oci_repo" ]; then
              continue
            fi

            check_dir="$(mktemp -d)"
            if helm pull "oci://$oci_repo/${{ steps.chart.outputs.name }}" \
              --version "${{ steps.chart.outputs.version }}" \
              --destination "$check_dir" >/dev/null 2>&1; then
              echo "OCI chart $oci_repo/${{ steps.chart.outputs.name }}:${{ steps.chart.outputs.version }} already exists; skipping push."
              continue
            fi

            helm push "dist/${{ steps.chart.outputs.name }}-${{ steps.chart.outputs.version }}.tgz" \
              "oci://$oci_repo"
          done <<'EOF'
          ${{ steps.chart.outputs.oci_repos }}
          EOF

      - name: Open chart repository update PR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.token }}
        run: |
          chart_branch="${{ steps.chart.outputs.chart_branch }}"
          update_branch="automation/helm-charts-${{ steps.chart.outputs.version }}"
          chart_repo_dir="$(mktemp -d)"
          changed_file="$RUNNER_TEMP/helm-chart-repo-changed"

          if ! git ls-remote --exit-code origin "refs/heads/$chart_branch" >/dev/null 2>&1; then
            echo "Branch '$chart_branch' does not exist; creating it."
            init_dir="$(mktemp -d)"
            git clone --no-checkout "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$init_dir"
            (
              cd "$init_dir"
              git switch --orphan "$chart_branch"
              git rm -rf . >/dev/null 2>&1 || true
              printf "# SyncTV Helm Charts\n\nThis branch is maintained by the release workflow.\n" > README.md
              git add README.md
              git commit -m "helm: initialize chart repository"
              git push origin "$chart_branch"
            )
          fi

          git clone --branch "$chart_branch" --single-branch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$chart_repo_dir"
          cp "dist/${{ steps.chart.outputs.name }}-${{ steps.chart.outputs.version }}.tgz" "$chart_repo_dir/"

          (
            cd "$chart_repo_dir"
            helm repo index . --url "${{ steps.chart.outputs.pages_url }}"

            if [ -z "$(git status --porcelain)" ]; then
              echo "Chart repository is already up to date."
              exit 0
            fi

            touch "$changed_file"
            git checkout -B "$update_branch"
            git add .
            git commit -m "helm: publish ${{ steps.chart.outputs.name }} ${{ steps.chart.outputs.version }}"
            git push --force-with-lease "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$update_branch"
          )

          if [ ! -f "$changed_file" ]; then
            exit 0
          fi

          if gh pr view "$update_branch" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh pr edit "$update_branch" \
              --repo "$GITHUB_REPOSITORY" \
              --title "helm: publish ${{ steps.chart.outputs.name }} ${{ steps.chart.outputs.version }}" \
              --body "Publishes Helm chart ${{ steps.chart.outputs.name }} version ${{ steps.chart.outputs.version }} to the chart repository branch."
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base "$chart_branch" \
              --head "$update_branch" \
              --title "helm: publish ${{ steps.chart.outputs.name }} ${{ steps.chart.outputs.version }}" \
              --body "Publishes Helm chart ${{ steps.chart.outputs.name }} version ${{ steps.chart.outputs.version }} to the chart repository branch."
          fi
