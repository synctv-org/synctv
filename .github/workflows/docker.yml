name: Docker

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-prepare:
    name: Docker Prepare
    runs-on: ubuntu-slim
    outputs:
      meta_images: ${{ steps.images.outputs.meta_images }}
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - name: Compute image targets
        id: images
        shell: bash
        run: |
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          repo="$(printf '%s' "${GITHUB_EVENT_REPOSITORY_NAME}" | tr '[:upper:]' '[:lower:]')"

          {
            echo "meta_images<<EOF"
            echo "ghcr.io/${owner}/${repo}"

            if [ -n "${DOCKER_USERNAME}" ] && [ -n "${DOCKER_PASSWORD}" ]; then
              dockerhub_user="$(printf '%s' "${DOCKER_USERNAME}" | tr '[:upper:]' '[:lower:]')"
              echo "docker.io/${dockerhub_user}/${repo}"
            fi

            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

  docker-build:
    name: Docker Build
    needs: docker-prepare
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: docker/github-builder/.github/workflows/build.yml@v1
    with:
      output: image
      push: ${{ github.event_name == 'push' }}
      runner: auto
      distribute: true
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-scope: synctv-image
      meta-images: ${{ needs.docker-prepare.outputs.meta_images }}
      meta-tags: |
        type=ref,event=branch
        type=ref,event=pr
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=sha
      set-meta-labels: true
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' && format('- registry: docker.io
          username: {0}
          password: {1}', secrets.DOCKER_USERNAME, secrets.DOCKER_PASSWORD) || '' }}
