services:
  postgres:
    image: postgres:18
    container_name: synctv-postgres
    environment:
      POSTGRES_USER: synctv
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: synctv
    ports:
      - "5432:5432"
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synctv"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - synctv
    restart: unless-stopped

  redis:
    image: redis:8
    container_name: synctv-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - synctv
    restart: unless-stopped

  synctv:
    image: synctvorg/synctv:0.1.0
    container_name: synctv-app
    ports:
      - "8080:8080"
      - "1935:1935"
      - "3478:3478/udp"
    environment:
      SYNCTV_DATABASE_URL: postgresql://synctv:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/synctv
      SYNCTV_REDIS_URL: redis://redis:6379
      SYNCTV_DATA_DIR: /data
      SYNCTV_SERVER_HOST: 0.0.0.0
      SYNCTV_SERVER_PORT: 8080
      SYNCTV_JWT_SECRET: ${SYNCTV_JWT_SECRET:?SYNCTV_JWT_SECRET must be set (min 32 chars)}
      SYNCTV_SERVER_CLUSTER_SECRET: ${SYNCTV_SERVER_CLUSTER_SECRET:?SYNCTV_SERVER_CLUSTER_SECRET must be set (min 32 chars)}
      SYNCTV_SECURITY_CREDENTIAL_ENCRYPTION_KEY: ${SYNCTV_SECURITY_CREDENTIAL_ENCRYPTION_KEY:?SYNCTV_SECURITY_CREDENTIAL_ENCRYPTION_KEY must be set (64 hex chars)}
      SYNCTV_SECURITY_OPAQUE_SERVER_SETUP_SECRET: ${SYNCTV_SECURITY_OPAQUE_SERVER_SETUP_SECRET:?SYNCTV_SECURITY_OPAQUE_SERVER_SETUP_SECRET must be set (min 32 chars)}
      SYNCTV_BOOTSTRAP_CREATE_ROOT_USER: "true"
      SYNCTV_BOOTSTRAP_ROOT_PASSWORD: ${SYNCTV_BOOTSTRAP_ROOT_PASSWORD:?SYNCTV_BOOTSTRAP_ROOT_PASSWORD
        must be set (min 12 chars, mixed case + digit)}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - synctv
    volumes:
      - synctv_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3

volumes:
  postgres18_data:
    driver: local
  redis_data:
    driver: local
  synctv_data:
    driver: local

networks:
  synctv:
    driver: bridge
