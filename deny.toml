[advisories]
unmaintained = "all"
unsound = "all"
yanked = "warn"
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa is only reached transitively and the advisory has no upstream fixed version yet" },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml is only reached through the intentionally pinned serde_yaml and has no maintained drop-in replacement" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile is still required for PEM parsing and the advisory has no replacement release to upgrade to" },
    { id = "RUSTSEC-2025-0141", reason = "bincode 2 is still required by the on-disk cache format and the advisory is maintenance-only with no fixed successor release" },
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 is forced by the exactly-pinned opaque-ke via elliptic-curve 0.13; the fix (crypto-bigint >=0.7.6) requires the elliptic-curve 0.14 line, which no opaque-ke release supports yet" },
]

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "OpenSSL",
    "NCSA",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "allow"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
