syntax = "proto3";

package synctv.playback_provider.nextcloud;

import "proto/buf/validate/validate.proto";
import "proto/playback_provider/common.proto";

enum NextcloudHlsResourceKind {
  NEXTCLOUD_HLS_RESOURCE_KIND_UNSPECIFIED = 0;
  NEXTCLOUD_HLS_RESOURCE_KIND_MEDIA = 1;
  NEXTCLOUD_HLS_RESOURCE_KIND_MANIFEST = 2;
}

message GetNextcloudResourceRequest {
  string version = 1 [(buf.validate.field).string.min_len = 1];
  string mode_name = 2 [(buf.validate.field).string.min_len = 1];
  uint32 media_index = 3;
  string sig = 4 [(buf.validate.field).string.min_len = 1];
  string uid = 5 [(buf.validate.field).string.min_len = 1];
  string rid = 6 [(buf.validate.field).string.min_len = 1];
  int64 exp = 7;
  optional string range = 8;
  bool head = 9;
}

message NextcloudResourceResponse {
  synctv.playback_provider.common.StreamChunk chunk = 1;
}

message GetNextcloudHlsManifestRequest {
  string version = 1 [(buf.validate.field).string.min_len = 1];
  string mode_name = 2 [(buf.validate.field).string.min_len = 1];
  uint32 media_index = 3;
  string sig = 4 [(buf.validate.field).string.min_len = 1];
  string uid = 5 [(buf.validate.field).string.min_len = 1];
  string rid = 6 [(buf.validate.field).string.min_len = 1];
  int64 exp = 7;
  bool head = 8;
}

message NextcloudHlsManifestResponse {
  synctv.playback_provider.common.StreamChunk chunk = 1;
}

message GetNextcloudHlsResourceRequest {
  string version = 1 [(buf.validate.field).string.min_len = 1];
  string target_url = 2 [(buf.validate.field).string.min_len = 1];
  string sig = 3 [(buf.validate.field).string.min_len = 1];
  string uid = 4 [(buf.validate.field).string.min_len = 1];
  string rid = 5 [(buf.validate.field).string.min_len = 1];
  int64 exp = 6;
  optional string range = 7;
  bool head = 8;
  string mode_name = 9 [(buf.validate.field).string.min_len = 1];
  uint32 media_index = 10;
  NextcloudHlsResourceKind resource_kind = 11 [(buf.validate.field).enum.defined_only = true];
}

message NextcloudHlsResourceResponse {
  synctv.playback_provider.common.StreamChunk chunk = 1;
}

message GetNextcloudSubtitleRequest {
  string version = 1 [(buf.validate.field).string.min_len = 1];
  string mode_name = 2 [(buf.validate.field).string.min_len = 1];
  uint32 subtitle_index = 3;
  string sig = 4 [(buf.validate.field).string.min_len = 1];
  string uid = 5 [(buf.validate.field).string.min_len = 1];
  string rid = 6 [(buf.validate.field).string.min_len = 1];
  int64 exp = 7;
}

message NextcloudSubtitleResponse {
  synctv.playback_provider.common.StreamChunk chunk = 1;
}

message GetNextcloudPreviewResourceRequest {
  string server_id = 1 [(buf.validate.field).string.min_len = 1];
  string credential_owner_id = 2 [(buf.validate.field).string.min_len = 1];
  uint64 file_id = 3 [(buf.validate.field).uint64.gt = 0];
  uint32 width = 4 [(buf.validate.field).uint32 = {gte: 1, lte: 2048}];
  uint32 height = 5 [(buf.validate.field).uint32 = {gte: 1, lte: 2048}];
  bool crop = 6;
  string sig = 7 [(buf.validate.field).string.min_len = 1];
  string uid = 8 [(buf.validate.field).string.min_len = 1];
  string rid = 9 [(buf.validate.field).string.min_len = 1];
  int64 exp = 10;
}

message NextcloudPreviewResourceResponse {
  synctv.playback_provider.common.StreamChunk chunk = 1;
}

service NextcloudPlaybackProviderService {
  rpc GetResource(GetNextcloudResourceRequest) returns (stream NextcloudResourceResponse);
  rpc GetHlsManifest(GetNextcloudHlsManifestRequest) returns (stream NextcloudHlsManifestResponse);
  rpc GetHlsResource(GetNextcloudHlsResourceRequest) returns (stream NextcloudHlsResourceResponse);
  rpc GetSubtitle(GetNextcloudSubtitleRequest) returns (stream NextcloudSubtitleResponse);
  rpc GetPreviewResource(GetNextcloudPreviewResourceRequest) returns (stream NextcloudPreviewResourceResponse);
}
