{{- if not .Values.existingSecret -}}
{{- $secretName := include "synctv.secretName" . -}}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $dbPassword := "" -}}
{{- $dbReadUrl := "" -}}
{{- $redisPassword := "" -}}
{{- $jwtSecret := "" -}}
{{- $clusterSecret := "" -}}
{{- $rootPassword := "" -}}
{{- $credentialEncryptionKey := "" -}}
{{- $opaqueServerSetupSecret := "" -}}
{{- $metricsBearerToken := "" -}}
{{- $metricsBasicUsername := "" -}}
{{- $metricsBasicPassword := "" -}}
{{- $managementAuthToken := "" -}}
{{- $hlsStorageAccessKeyId := "" -}}
{{- $hlsStorageSecretAccessKey := "" -}}
{{- $securitySecrets := .Values.secrets.security | default dict -}}
{{- $livestreamSecrets := .Values.secrets.livestream | default dict -}}
{{- $hlsStorageSecrets := $livestreamSecrets.hlsStorage | default dict -}}
{{- $hlsStorageConfig := .Values.config.livestream.hlsStorage | default dict -}}

{{- if $existingSecret -}}
  {{- if hasKey $existingSecret.data "SYNCTV_DATABASE_PASSWORD" -}}
    {{- $dbPassword = index $existingSecret.data "SYNCTV_DATABASE_PASSWORD" | b64dec -}}
  {{- end -}}
  {{- if hasKey $existingSecret.data "SYNCTV_DATABASE_READ_URL" -}}
    {{- $dbReadUrl = index $existingSecret.data "SYNCTV_DATABASE_READ_URL" | b64dec -}}
  {{- end -}}
  {{- if hasKey $existingSecret.data "SYNCTV_REDIS_PASSWORD" -}}
    {{- $redisPassword = index $existingSecret.data "SYNCTV_REDIS_PASSWORD" | b64dec -}}
  {{- end -}}
  {{- $jwtSecret = index $existingSecret.data "SYNCTV_JWT_SECRET" | b64dec -}}
  {{- $clusterSecret = index $existingSecret.data "SYNCTV_CLUSTER_SECRET" | b64dec -}}
  {{- if hasKey $existingSecret.data "SYNCTV_BOOTSTRAP_ROOT_PASSWORD" -}}
    {{- $rootPassword = index $existingSecret.data "SYNCTV_BOOTSTRAP_ROOT_PASSWORD" | b64dec -}}
  {{- end -}}
  {{- if hasKey $existingSecret.data "SYNCTV_SECURITY_CREDENTIAL_ENCRYPTION_KEY" -}}
    {{- $credentialEncryptionKey = index $existingSecret.data "SYNCTV_SECURITY_CREDENTIAL_ENCRYPTION_KEY" | b64dec -}}
  {{- end -}}
  {{- if hasKey $existingSecret.data "SYNCTV_SECURITY_OPAQUE_SERVER_SETUP_SECRET" -}}
    {{- $opaqueServerSetupSecret = index $existingSecret.data "SYNCTV_SECURITY_OPAQUE_SERVER_SETUP_SECRET" | b64dec -}}
  {{- end -}}
  {{- if hasKey $existingSecret.data "SYNCTV_METRICS_AUTH_BEARER_TOKEN" -}}
    {{- $metricsBearerToken = index $existingSecret.data "SYNCTV_METRICS_AUTH_BEARER_TOKEN" | b64dec -}}
  {{- end -}}
  {{- if hasKey $existingSecret.data "SYNCTV_METRICS_AUTH_BASIC_USERNAME" -}}
    {{- $metricsBasicUsername = index $existingSecret.data "SYNCTV_METRICS_AUTH_BASIC_USERNAME" | b64dec -}}
  {{- end -}}
  {{- if hasKey $existingSecret.data "SYNCTV_METRICS_AUTH_BASIC_PASSWORD" -}}
    {{- $metricsBasicPassword = index $existingSecret.data "SYNCTV_METRICS_AUTH_BASIC_PASSWORD" | b64dec -}}
  {{- end -}}
  {{- if hasKey $existingSecret.data "SYNCTV_MANAGEMENT_AUTH_TOKEN" -}}
    {{- $managementAuthToken = index $existingSecret.data "SYNCTV_MANAGEMENT_AUTH_TOKEN" | b64dec -}}
  {{- end -}}
  {{- if hasKey $existingSecret.data "SYNCTV_LIVESTREAM_HLS_STORAGE_ACCESS_KEY_ID" -}}
    {{- $hlsStorageAccessKeyId = index $existingSecret.data "SYNCTV_LIVESTREAM_HLS_STORAGE_ACCESS_KEY_ID" | b64dec -}}
  {{- end -}}
  {{- if hasKey $existingSecret.data "SYNCTV_LIVESTREAM_HLS_STORAGE_SECRET_ACCESS_KEY" -}}
    {{- $hlsStorageSecretAccessKey = index $existingSecret.data "SYNCTV_LIVESTREAM_HLS_STORAGE_SECRET_ACCESS_KEY" | b64dec -}}
  {{- end -}}
  {{- if not $managementAuthToken -}}
    {{- if .Values.secrets.management.authToken -}}
      {{- $managementAuthToken = .Values.secrets.management.authToken -}}
    {{- else if eq (.Values.config.management.transport | default "unix") "tcp" -}}
      {{- $managementAuthToken = randAlphaNum 32 -}}
    {{- end -}}
  {{- end -}}
{{- else -}}
  {{- /* Generate random passwords on first install */ -}}
  {{- if .Values.secrets.database.password -}}
    {{- $dbPassword = .Values.secrets.database.password -}}
  {{- else -}}
    {{- $dbPassword = randAlphaNum 32 -}}
  {{- end -}}
  {{- $dbReadUrl = .Values.secrets.database.readUrl | default "" -}}
  {{- if .Values.secrets.redis.password -}}
    {{- $redisPassword = .Values.secrets.redis.password -}}
  {{- else if ne (include "synctv.redis.mode" .) "external" -}}
    {{- $redisPassword = randAlphaNum 32 -}}
  {{- end -}}
  {{- if .Values.secrets.jwt.secret -}}
    {{- $jwtSecret = .Values.secrets.jwt.secret -}}
  {{- else -}}
    {{- $jwtSecret = randAlphaNum 64 -}}
  {{- end -}}
  {{- if .Values.secrets.cluster.grpcSecret -}}
    {{- $clusterSecret = .Values.secrets.cluster.grpcSecret -}}
  {{- else -}}
    {{- $clusterSecret = randAlphaNum 32 -}}
  {{- end -}}
  {{- if .Values.secrets.bootstrap -}}
    {{- if .Values.secrets.bootstrap.rootPassword -}}
      {{- $rootPassword = .Values.secrets.bootstrap.rootPassword -}}
    {{- else -}}
      {{- $rootPassword = printf "Root%s1" (randAlphaNum 20) -}}
    {{- end -}}
  {{- else -}}
    {{- $rootPassword = printf "Root%s1" (randAlphaNum 20) -}}
  {{- end -}}
  {{- if $securitySecrets.credentialEncryptionKey -}}
    {{- $credentialEncryptionKey = $securitySecrets.credentialEncryptionKey -}}
  {{- else -}}
    {{- $credentialEncryptionKey = printf "%s%s" (randAlphaNum 64) (randAlphaNum 64) | sha256sum -}}
  {{- end -}}
  {{- if $securitySecrets.opaqueServerSetupSecret -}}
    {{- $opaqueServerSetupSecret = $securitySecrets.opaqueServerSetupSecret -}}
  {{- else -}}
    {{- $opaqueServerSetupSecret = randAlphaNum 64 -}}
  {{- end -}}
  {{- if eq (.Values.metrics.auth.mode | default "bearer_token") "bearer_token" -}}
    {{- if .Values.secrets.metrics.bearerToken -}}
      {{- $metricsBearerToken = .Values.secrets.metrics.bearerToken -}}
    {{- else -}}
      {{- $metricsBearerToken = randAlphaNum 32 -}}
    {{- end -}}
  {{- end -}}
  {{- if eq (.Values.metrics.auth.mode | default "bearer_token") "basic" -}}
    {{- $metricsBasicUsername = .Values.secrets.metrics.basicUsername | default "metrics" -}}
    {{- if .Values.secrets.metrics.basicPassword -}}
      {{- $metricsBasicPassword = .Values.secrets.metrics.basicPassword -}}
    {{- else -}}
      {{- $metricsBasicPassword = randAlphaNum 24 -}}
    {{- end -}}
  {{- end -}}
  {{- if .Values.secrets.management.authToken -}}
    {{- $managementAuthToken = .Values.secrets.management.authToken -}}
{{- else if eq (.Values.config.management.transport | default "unix") "tcp" -}}
    {{- $managementAuthToken = randAlphaNum 32 -}}
  {{- end -}}
  {{- $hlsStorageAccessKeyId = $hlsStorageSecrets.accessKeyId | default "" -}}
  {{- $hlsStorageSecretAccessKey = $hlsStorageSecrets.secretAccessKey | default "" -}}
{{- end -}}
{{- if not $credentialEncryptionKey -}}
  {{- if $securitySecrets.credentialEncryptionKey -}}
    {{- $credentialEncryptionKey = $securitySecrets.credentialEncryptionKey -}}
  {{- else -}}
    {{- $credentialEncryptionKey = printf "%s%s" (randAlphaNum 64) (randAlphaNum 64) | sha256sum -}}
  {{- end -}}
{{- end -}}
{{- if not $opaqueServerSetupSecret -}}
  {{- if $securitySecrets.opaqueServerSetupSecret -}}
    {{- $opaqueServerSetupSecret = $securitySecrets.opaqueServerSetupSecret -}}
  {{- else -}}
    {{- $opaqueServerSetupSecret = randAlphaNum 64 -}}
  {{- end -}}
{{- end -}}
{{- if not $dbPassword -}}
  {{- if .Values.secrets.database.password -}}
    {{- $dbPassword = .Values.secrets.database.password -}}
  {{- else -}}
    {{- $dbPassword = randAlphaNum 32 -}}
  {{- end -}}
{{- end -}}
{{- if not $hlsStorageAccessKeyId -}}
  {{- $hlsStorageAccessKeyId = $hlsStorageSecrets.accessKeyId | default "" -}}
{{- end -}}
{{- if not $hlsStorageSecretAccessKey -}}
  {{- $hlsStorageSecretAccessKey = $hlsStorageSecrets.secretAccessKey | default "" -}}
{{- end -}}
{{- if and (not $dbReadUrl) .Values.secrets.database.readUrl -}}
  {{- $dbReadUrl = .Values.secrets.database.readUrl -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "synctv.labels" . | nindent 4 }}
type: Opaque
stringData:
  SYNCTV_DATABASE_PASSWORD: {{ $dbPassword | quote }}
  {{- if $dbReadUrl }}
  SYNCTV_DATABASE_READ_URL: {{ $dbReadUrl | quote }}
  {{- end }}
  {{- if and (ne (include "synctv.redis.mode" .) "kubeblocks") $redisPassword }}
  SYNCTV_REDIS_PASSWORD: {{ $redisPassword | quote }}
  {{- end }}

  SYNCTV_JWT_SECRET: {{ $jwtSecret | quote }}
  SYNCTV_CLUSTER_SECRET: {{ $clusterSecret | quote }}

  {{- if $credentialEncryptionKey }}
  SYNCTV_SECURITY_CREDENTIAL_ENCRYPTION_KEY: {{ $credentialEncryptionKey | quote }}
  {{- end }}

  {{- if $opaqueServerSetupSecret }}
  SYNCTV_SECURITY_OPAQUE_SERVER_SETUP_SECRET: {{ $opaqueServerSetupSecret | quote }}
  {{- end }}

  {{- if $rootPassword }}
  SYNCTV_BOOTSTRAP_ROOT_PASSWORD: {{ $rootPassword | quote }}
  {{- end }}

  {{- if $metricsBearerToken }}
  SYNCTV_METRICS_AUTH_BEARER_TOKEN: {{ $metricsBearerToken | quote }}
  {{- end }}
  {{- if $metricsBasicUsername }}
  SYNCTV_METRICS_AUTH_BASIC_USERNAME: {{ $metricsBasicUsername | quote }}
  {{- end }}
  {{- if $metricsBasicPassword }}
  SYNCTV_METRICS_AUTH_BASIC_PASSWORD: {{ $metricsBasicPassword | quote }}
  {{- end }}
  {{- if $managementAuthToken }}
  SYNCTV_MANAGEMENT_AUTH_TOKEN: {{ $managementAuthToken | quote }}
  {{- end }}
  {{- if eq ($hlsStorageConfig.type | default "memory") "oss" }}
  SYNCTV_LIVESTREAM_HLS_STORAGE_ACCESS_KEY_ID: {{ $hlsStorageAccessKeyId | quote }}
  SYNCTV_LIVESTREAM_HLS_STORAGE_SECRET_ACCESS_KEY: {{ $hlsStorageSecretAccessKey | quote }}
  {{- end }}
{{- end }}
