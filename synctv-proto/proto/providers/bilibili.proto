// Bilibili Provider Client API
//
// This is the client-facing gRPC API for Bilibili provider
//
// SECURITY: This service transmits Bilibili session cookies during login only.
// After login, credentials are stored server-side and referenced by server_id.
// Deployments MUST use TLS for all connections to this service.

syntax = "proto3";

package synctv.provider.bilibili;

// Bilibili Provider Service
//
// Client-facing API for Bilibili video parsing, login, and user management
service BilibiliProviderService {
  // Parse Bilibili URL (video, anime, live) - uses stored credential via server_id
  rpc Parse(ParseRequest) returns (ParseResponse);

  // Generate QR code for login
  rpc LoginQR(LoginQRRequest) returns (QRCodeResponse);

  // Check QR code login status (persists credential on success)
  rpc CheckQR(CheckQRRequest) returns (QRStatusResponse);

  // Get captcha for SMS login
  rpc GetCaptcha(GetCaptchaRequest) returns (CaptchaResponse);

  // Send SMS verification code
  rpc SendSMS(SendSMSRequest) returns (SendSMSResponse);

  // Login with SMS code (persists credential on success)
  rpc LoginSMS(LoginSMSRequest) returns (LoginSMSResponse);

  // Get user info (uses stored credential via server_id)
  rpc GetUserInfo(UserInfoRequest) returns (UserInfoResponse);

  // Logout (delete stored credential)
  rpc Logout(LogoutRequest) returns (LogoutResponse);
}

// Parse video URL request
message ParseRequest {
  string url = 1;
  string server_id = 2; // Stored credential identifier (use stored cookies)
  string instance_name = 3; // Optional provider instance name
}

// Parse video URL response
message ParseResponse {
  string title = 1;
  repeated string actors = 2;
  repeated VideoInfo videos = 3;
}

// Video information
message VideoInfo {
  string bvid = 1;
  int64 cid = 2;
  int64 epid = 3;
  string name = 4;
  string cover = 5;
  bool is_live = 6;
}

// QR code login request
message LoginQRRequest {
  string instance_name = 1; // Optional provider instance name
}

// QR code response
message QRCodeResponse {
  string url = 1;
  string key = 2;
}

// Check QR status request
message CheckQRRequest {
  string key = 1;
  string instance_name = 2; // Optional provider instance name
}

// QR login status enum
// Values match synctv-media-providers QRCodeStatus for compatibility
enum QRLoginStatus {
  QR_LOGIN_STATUS_UNSPECIFIED = 0;
  QR_LOGIN_STATUS_EXPIRED = 1;
  QR_LOGIN_STATUS_NOT_SCANNED = 2;
  QR_LOGIN_STATUS_SCANNED = 3;
  QR_LOGIN_STATUS_SUCCESS = 4;
}

// QR status response
message QRStatusResponse {
  QRLoginStatus status = 1;
  string server_id = 2; // Stored credential identifier returned after successful login
}

// Get captcha request
message GetCaptchaRequest {
  string instance_name = 1; // Optional provider instance name
}

// Captcha response
message CaptchaResponse {
  string token = 1;
  string gt = 2;
  string challenge = 3;
}

// Send SMS request
message SendSMSRequest {
  string phone = 1;
  string token = 2;
  string challenge = 3;
  string validate = 4;
  string instance_name = 5; // Optional provider instance name
}

// Send SMS response
message SendSMSResponse {
  string captcha_key = 1;
}

// Login with SMS request
message LoginSMSRequest {
  string phone = 1;
  string code = 2;
  string captcha_key = 3;
  string instance_name = 4; // Optional provider instance name
}

// Login with SMS response
message LoginSMSResponse {
  string server_id = 1; // Stored credential identifier returned after successful login
}

// User info request
message UserInfoRequest {
  string server_id = 1; // Stored credential identifier
  string instance_name = 2; // Optional provider instance name
}

// User info response
message UserInfoResponse {
  bool is_login = 1;
  string username = 2;
  string face = 3;
  bool is_vip = 4;
}

// Logout request
message LogoutRequest {
  string server_id = 1; // Which credential to unbind
  string instance_name = 2; // Optional provider instance name
}

// Logout response
message LogoutResponse {
  string message = 1;
}
