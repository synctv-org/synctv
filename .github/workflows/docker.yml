name: Docker

on:
  push:
    branches: ['**']
    tags:
      - "v*"
    paths-ignore:
      - ".github/workflows/docs.yml"
      - "docs/**"
  pull_request:
    branches: ['**']
    paths-ignore:
      - ".github/workflows/docs.yml"
      - "docs/**"
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-prepare:
    name: Docker Prepare
    runs-on: ubuntu-latest
    outputs:
      meta-images: ${{ steps.meta-images.outputs.value }}
      image-tag: ${{ steps.meta-images.outputs.image-tag }}
    steps:
      - name: Build image metadata inputs
        id: meta-images
        env:
          GHCR_REPOSITORY: ${{ github.repository }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
          DEFAULT_REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          image_tag="sha-${GITHUB_SHA::7}"
          if [ -n "$DOCKERHUB_REPOSITORY" ]; then
            case "$DOCKERHUB_REPOSITORY" in
              */*)
                dockerhub_repository="$DOCKERHUB_REPOSITORY"
                ;;
              *)
                dockerhub_repository="$DOCKERHUB_USERNAME/$DOCKERHUB_REPOSITORY"
                ;;
            esac
          elif [ -n "$DOCKERHUB_USERNAME" ]; then
            dockerhub_repository="$DOCKERHUB_USERNAME/$DEFAULT_REPOSITORY_NAME"
          fi
          {
            echo "image-tag=$image_tag"
            echo 'value<<EOF'
            echo "ghcr.io/$GHCR_REPOSITORY"
            if [ -n "$dockerhub_repository" ]; then
              echo "docker.io/$dockerhub_repository"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  web-ui:
    name: Build Web UI
    runs-on: ubuntu-24.04
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/web-ui-cargo
      SYNCTV_WEB_CACHE_DIR: ${{ github.workspace }}/target/web-ui-cache
      SYNCTV_WEB_CONFIG: synctv-web-ui/web-ui.production.toml
      WEB_UI_EXPORT_DIR: ${{ github.workspace }}/synctv-web-ui/dist
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-03

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Cache Web build inputs
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            target/web-ui-cache
          key: web-ui-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'synctv-web-ui/build.rs', 'synctv-web-ui/src/build_support.rs', 'synctv-web-ui/web-ui.production.toml') }}
          restore-keys: |
            web-ui-${{ runner.os }}-

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/web-ui-cargo"

      - name: Build Web distribution
        run: |
          cargo clean -p synctv-web-ui
          make web-ui-build
          test -f synctv-web-ui/dist/index.html

      - name: Upload Web distribution
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synctv-web-ui
          path: synctv-web-ui/dist
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  docker-build:
    name: Docker Build
    needs:
      - docker-prepare
      - web-ui
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
    uses: docker/github-builder/.github/workflows/build.yml@v1
    with:
      runner: |
        default=ubuntu-24.04
        linux/arm=ubuntu-24.04-arm
        linux/arm64=ubuntu-24.04-arm
      distribute: true
      platforms: linux/amd64,linux/arm64
      # The local export stalls on current runner images; pull requests keep
      # push disabled so the image only lands in the builder store.
      output: image
      push: ${{ github.event_name == 'push' }}
      artifact-upload: false
      # Signed after the eStargz conversion job, which republishes every tag
      # under a new index digest.
      sign: false
      cache: false
      cache-mode: min
      cache-scope: synctv-image
      build-args: |
        SYNCTV_CARGO_BUILD_PROFILE=${{ github.event_name == 'pull_request' && 'dev' || 'release' }}
        SYNCTV_BUILD_FEATURES=k8s,mimalloc,openapi,web-ui
        SYNCTV_WEB_ARTIFACT_URL=https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${{ needs.web-ui.outputs.artifact-id }}/zip
        SYNCTV_WEB_ARTIFACT_DIGEST=${{ needs.web-ui.outputs.artifact-digest }}
        CARGO_INCREMENTAL=0
        CARGO_TERM_COLOR=always
      set-meta-annotations: true
      set-meta-labels: true
      meta-images: ${{ needs.docker-prepare.outputs.meta-images }}
      meta-tags: |
        type=ref,event=branch
        type=ref,event=pr
        type=ref,event=tag
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=raw,value=${{ needs.docker-prepare.outputs.image-tag }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
        ${{ vars.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_PASSWORD != '' && format('- registry: docker.io
          username: {0}
          password: {1}', vars.DOCKERHUB_USERNAME, secrets.DOCKERHUB_PASSWORD) || '' }}

  estargz:
    name: eStargz conversion
    needs: [docker-prepare, docker-build]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    env:
      HAS_DOCKERHUB: ${{ vars.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_PASSWORD != '' }}
    steps:
      # Mirrors the meta-tags list of the build job so the converted index is
      # published under the exact same tags.
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.docker-prepare.outputs.meta-images }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ needs.docker-prepare.outputs.image-tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # Re-exports the already-pushed multi-platform image with every layer
      # converted to eStargz (lazy-pullable on containerd/CRI-O). A FROM-only
      # build reuses the original layers and config; force-compression
      # recompresses cached and base layers as well.
      - name: Convert image layers to eStargz
        env:
          IMAGES: ${{ needs.docker-prepare.outputs.meta-images }}
          SOURCE_DIGEST: ${{ needs.docker-build.outputs.digest }}
        run: |
          primary_image=$(printf '%s\n' "$IMAGES" | head -1)
          image_names=$(printf '%s\n' "$IMAGES" | paste -sd, -)
          mkdir /tmp/estargz-context
          printf 'FROM %s@%s\n' "$primary_image" "$SOURCE_DIGEST" > /tmp/estargz-context/Dockerfile
          docker buildx build \
            --file /tmp/estargz-context/Dockerfile \
            --platform linux/amd64,linux/arm64 \
            --provenance=false \
            --sbom=false \
            --output "type=image,name=${image_names},push-by-digest=true,compression=estargz,oci-mediatypes=true,force-compression=true" \
            --metadata-file /tmp/estargz-metadata.json \
            /tmp/estargz-context
          jq -r '."containerimage.digest"' /tmp/estargz-metadata.json > /tmp/estargz-digest

      - name: Publish tags
        id: publish
        env:
          IMAGES: ${{ needs.docker-prepare.outputs.meta-images }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          source_digest=$(cat /tmp/estargz-digest)
          primary_image=$(printf '%s\n' "$IMAGES" | head -1)
          tag_args=()
          while IFS= read -r tag; do
            tag_args+=(-t "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create "${tag_args[@]}" "${primary_image}@${source_digest}"
          echo "digest=${source_digest}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign converted image
        env:
          IMAGES: ${{ needs.docker-prepare.outputs.meta-images }}
        run: |
          source_digest=$(cat /tmp/estargz-digest)
          while IFS= read -r image; do
            cosign sign --yes "${image}@${source_digest}"
          done <<< "$IMAGES"

  publish-image-digest:
    name: Publish image digest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [docker-build, estargz]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Wait for component release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          for attempt in {1..60}; do
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              exit 0
            fi
            echo "Waiting for GitHub Release $RELEASE_TAG (attempt $attempt/60)."
            sleep 10
          done
          echo "Timed out waiting for GitHub Release $RELEASE_TAG." >&2
          exit 1

      - name: Upload image digest asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ needs.estargz.outputs.digest || needs.docker-build.outputs.digest }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Docker builder returned an invalid image digest: $IMAGE_DIGEST" >&2
            exit 1
          }
          printf '%s\n' "$IMAGE_DIGEST" > image-digest.txt
          gh release upload "$RELEASE_TAG" image-digest.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
