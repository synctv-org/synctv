name: Docker

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-prepare:
    name: Docker Prepare
    runs-on: ubuntu-latest
    outputs:
      meta-images: ${{ steps.meta-images.outputs.value }}
    steps:
      - name: Build image metadata inputs
        id: meta-images
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          {
            echo 'value<<EOF'
            echo "ghcr.io/$REPOSITORY"
            if [ -n "$DOCKER_USERNAME" ]; then
              echo "docker.io/$DOCKER_USERNAME/$REPOSITORY_NAME"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  docker-build:
    name: Docker Build
    needs: docker-prepare
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: docker/github-builder/.github/workflows/build.yml@v1
    with:
      output: image
      push: ${{ github.event_name == 'push' }}
      runner: auto
      distribute: true
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-scope: synctv-image
      meta-images: ${{ needs.docker-prepare.outputs.meta-images }}
      meta-tags: |
        type=ref,event=branch
        type=ref,event=pr
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=sha
      set-meta-labels: true
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
        ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' && format('- registry: docker.io
          username: {0}
          password: {1}', secrets.DOCKER_USERNAME, secrets.DOCKER_PASSWORD) || '' }}
