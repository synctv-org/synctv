{{- if eq (include "synctv.redis.mode" .) "standard" }}
{{- if .Values.redis.standard.auth.username }}
{{- fail "redis.standard.auth.username is not supported when redis.mode=standard because the chart-managed Redis StatefulSet only creates the default user; leave it empty or use kubeblocks/external Redis with ACL users" }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "synctv.redis.fullname" . }}
  labels:
    {{- include "synctv.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: {{ .Values.redis.standard.service.port | default 6379 }}
      targetPort: redis
      protocol: TCP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: {{ include "synctv.name" . }}
    app.kubernetes.io/component: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "synctv.redis.fullname" . }}
  labels:
    {{- include "synctv.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  serviceName: {{ include "synctv.redis.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: {{ include "synctv.name" . }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: {{ include "synctv.name" . }}
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: {{ include "synctv.managedImage" (list . .Values.redis.standard.image "redis" "8.4.0-bookworm") | quote }}
          imagePullPolicy: {{ .Values.redis.standard.image.pullPolicy | default "IfNotPresent" }}
          command: ["sh", "-ec"]
          args:
            - exec redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"
          ports:
            - name: redis
              containerPort: {{ .Values.redis.standard.service.port | default 6379 }}
              protocol: TCP
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "synctv.secretName" . }}
                  key: SYNCTV_REDIS_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            exec:
              command: ["sh", "-ec", "redis-cli -a \"$REDIS_PASSWORD\" ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["sh", "-ec", "redis-cli -a \"$REDIS_PASSWORD\" ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          {{- with .Values.redis.standard.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with (.Values.redis.standard.persistence.storageClass | default .Values.global.storageClass) }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.redis.standard.persistence.size | default "8Gi" }}
{{- end }}
