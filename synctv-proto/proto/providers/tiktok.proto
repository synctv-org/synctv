syntax = "proto3";

package synctv.provider.tiktok;

import "proto/buf/validate/validate.proto";
import "proto/providers/common.proto";

message BindRequest {
  string label = 1 [(buf.validate.field).string.min_len = 1];
  string cookie = 2 [(buf.validate.field).string.min_len = 1];
  string instance_name = 3;
}

message BindResponse { string server_id = 1; }

message GetBindsRequest { string instance_name = 1; }

message GetBindsResponse { repeated BindInfo binds = 1; }

message BindInfo {
  string id = 1;
  string server_id = 2;
  string label = 3;
  bool has_cookie = 4;
  int64 created_at = 5;
  string provider_instance_name = 6;
}

message UnbindRequest {
  string server_id = 1 [(buf.validate.field).string.min_len = 1];
}

message UnbindResponse { bool removed = 1; }

message ResolveRequest {
  string resource = 1 [(buf.validate.field).string.min_len = 1];
  string instance_name = 2;
  bool shared = 3;
}

message Image {
  string url = 1;
  optional uint32 width = 2;
  optional uint32 height = 3;
}

message Author {
  string id = 1;
  string sec_uid = 2;
  string unique_id = 3;
  string nickname = 4;
  optional Image avatar = 5;
}

enum MediaKind {
  MEDIA_KIND_UNSPECIFIED = 0;
  MEDIA_KIND_VIDEO = 1;
  MEDIA_KIND_LIVE = 2;
}

enum StreamFormat {
  STREAM_FORMAT_UNSPECIFIED = 0;
  STREAM_FORMAT_MP4 = 1;
  STREAM_FORMAT_FLV = 2;
  STREAM_FORMAT_HLS = 3;
  STREAM_FORMAT_AUDIO = 4;
}

message Metadata {
  string id = 1;
  MediaKind kind = 2;
  string title = 3;
  string description = 4;
  Author author = 5;
  optional Image cover = 6;
  optional Image dynamic_cover = 7;
  optional uint64 duration_ms = 8;
  optional int64 created_at = 9;
  bool is_live = 10;
  optional uint64 view_count = 11;
  optional uint64 like_count = 12;
  optional uint64 comment_count = 13;
  optional uint64 share_count = 14;
  optional uint64 collect_count = 15;
  optional uint64 concurrent_viewers = 16;
  optional string music_title = 17;
  optional string music_author = 18;
  uint32 subtitle_count = 19;
}

message Variant {
  StreamFormat format = 1;
  string quality = 2;
  optional string codec = 3;
  optional uint32 width = 4;
  optional uint32 height = 5;
  optional uint64 bitrate = 6;
  bool audio_only = 7;
  bool watermarked = 8;
  bool headers_required = 9;
}

message ResolveResponse {
  Metadata metadata = 1;
  repeated Variant variants = 2;
  synctv.provider.common.DiscoveredSource source = 3;
}

message GetUserRequest {
  string resource = 1 [(buf.validate.field).string = {
    min_len: 1,
    max_len: 512
  }];
  string instance_name = 2;
  bool shared = 3;
}

message GetUserResponse {
  string sec_uid = 1;
  synctv.provider.common.DiscoveredSource source = 2;
}

message ListUserPostsRequest {
  string sec_uid = 1 [(buf.validate.field).string = {
    min_len: 1,
    max_len: 256
  }];
  optional string cursor = 2;
  uint32 page_size = 3 [(buf.validate.field).uint32.lte = 35];
  string instance_name = 4;
  bool shared = 5;
}

message ListItem {
  string video_id = 1;
  string title = 2;
  Author author = 3;
  optional Image cover = 4;
  optional uint64 duration_ms = 5;
  optional int64 created_at = 6;
  synctv.provider.common.DiscoveredSource source = 7;
}

message ListUserPostsResponse {
  repeated ListItem items = 1;
  optional string cursor = 2;
  bool has_more = 3;
  synctv.provider.common.DiscoveredSource source = 4;
}
