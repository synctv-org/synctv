// ==================== WebRTC Signaling Messages ====================

// WebRTC Offer (SDP offer from initiator)
// Client sends this to another specific peer through the server
message WebRTCOffer {
    string to = 1;          // Target: "user_id" or "user_id:conn_id"
    string from = 2;        // Sender: Set by server, format: "user_id:conn_id"
    string data = 3;        // SDP offer (JSON string, opaque to server)
}

// WebRTC Answer (SDP answer from receiver)
// Response to an offer
message WebRTCAnswer {
    string to = 1;          // Target: "user_id" or "user_id:conn_id"
    string from = 2;        // Sender: Set by server, format: "user_id:conn_id"
    string data = 3;        // SDP answer (JSON string, opaque to server)
}

// WebRTC ICE Candidate
// Sent repeatedly during ICE negotiation
message WebRTCIceCandidate {
    string to = 1;          // Target: "user_id" or "user_id:conn_id"
    string from = 2;        // Sender: Set by server, format: "user_id:conn_id"
    string data = 3;        // ICE candidate (JSON string, opaque to server)
}

// WebRTC Join (user joins WebRTC session)
// Broadcast to all users who already joined RTC in the room
message WebRTCJoin {
    string user_id = 1;     // Joiner's user ID
    string conn_id = 2;     // Joiner's connection ID
    string username = 3;    // Joiner's display name (for UI)
}

// WebRTC Leave (user leaves WebRTC session)
// Broadcast to all users in the WebRTC session
message WebRTCLeave {
    string user_id = 1;     // Leaver's user ID
    string conn_id = 2;     // Leaver's connection ID
}

// ==================== SFU Migration Messages ====================
// When the room crosses the SFU threshold, the server sends migration offers
// to existing P2P peers so they transition to SFU-routed media.

// Migration state for status updates
enum SfuMigrationState {
    SFU_MIGRATION_STATE_UNSPECIFIED = 0;
    SFU_MIGRATION_STATE_STARTED = 1;     // Migration has begun
    SFU_MIGRATION_STATE_COMPLETED = 2;   // All peers migrated successfully
    SFU_MIGRATION_STATE_FAILED = 3;      // Migration failed for one or more peers
}

// Server -> Client: SFU migration offer for an existing P2P peer
// The server creates a server-side PeerConnection and sends an SDP offer
// so the client can renegotiate its media routing through the SFU.
message SfuMigrationOffer {
    string migration_id = 1;   // Unique ID for this migration batch
    string data = 2;           // SDP offer (JSON string)
}

// Client -> Server: SFU migration answer from peer
// The client responds with an SDP answer to complete the renegotiation.
message SfuMigrationAnswer {
    string migration_id = 1;   // Must match the migration_id from the offer
    string data = 2;           // SDP answer (JSON string)
}

// Server -> Client: Broadcast migration status to all peers in the room
message SfuMigrationStatus {
    string migration_id = 1;            // Migration batch ID
    SfuMigrationState state = 2;        // Current migration state
    int32 total_peers = 3;              // Total peers being migrated
    int32 completed_peers = 4;          // Peers that completed migration
    int32 failed_peers = 5;             // Peers that failed migration
}

// ICE Servers Configuration
// Server sends this to client upon request or connection
// Contains STUN/TURN server URLs for NAT traversal
message IceServersConfig {
    repeated IceServer servers = 1;
}

message IceServer {
    repeated string urls = 1;     // ["stun:stun.example.com:3478", "turn:turn.example.com:3478"]
    optional string username = 2;  // For TURN authentication
    optional string credential = 3; // For TURN authentication (temporary password)
    int64 expiry_time = 4;        // Unix timestamp (seconds) when TURN credentials expire. 0 = no expiry (STUN-only).
                                   // Clients MUST request fresh credentials before this time.
}

// Request/Response for GetIceServers RPC
message GetIceServersRequest {}

message GetIceServersResponse {
    repeated IceServer servers = 1;
}

// ==================== Network Quality Monitoring ====================
// Real-time network quality monitoring for WebRTC connections

message GetNetworkQualityRequest {}

message GetNetworkQualityResponse {
    // Quality stats for each peer in the room
    repeated PeerNetworkQuality peers = 1;
}

// Suggested action based on network quality assessment
enum QualityAction {
    QUALITY_ACTION_UNSPECIFIED = 0;
    QUALITY_ACTION_NONE = 1;             // No change needed
    QUALITY_ACTION_REDUCE_QUALITY = 2;   // Lower video resolution/bitrate
    QUALITY_ACTION_REDUCE_FRAMERATE = 3; // Lower framerate
    QUALITY_ACTION_AUDIO_ONLY = 4;       // Drop video, audio only
}

message PeerNetworkQuality {
    string peer_id = 1;
    // Round-trip time in milliseconds
    uint32 rtt_ms = 2;
    // Packet loss rate (0.0 - 1.0)
    float packet_loss_rate = 3;
    // Jitter in milliseconds
    uint32 jitter_ms = 4;
    // Available bandwidth in kbps
    uint32 available_bandwidth_kbps = 5;
    // Quality score (0-5, where 5 is excellent)
    uint32 quality_score = 6;
    // Suggested quality action based on current network conditions
    QualityAction quality_action = 7;
}

// ==================== Notification Messages ====================

enum NotificationType {
    NOTIFICATION_TYPE_UNSPECIFIED = 0;
    NOTIFICATION_TYPE_ROOM_INVITATION = 1;
    NOTIFICATION_TYPE_SYSTEM_ANNOUNCEMENT = 2;
    NOTIFICATION_TYPE_ROOM_EVENT = 3;
    NOTIFICATION_TYPE_PASSWORD_RESET = 4;
    NOTIFICATION_TYPE_EMAIL_VERIFICATION = 5;
}

message NotificationProto {
    string id = 1;
