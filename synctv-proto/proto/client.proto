// Client -> Server: periodic playback progress heartbeat
// Sent every few seconds by clients that are actively playing media.
// The server uses these reports to track actual client playback positions,
// detect drift between clients, and provide accurate positions to new joiners.
message PlaybackProgressReport {
  double position = 1; // Playback position in seconds
  bool is_playing = 2; // Whether the client is currently playing
  // Optional source guard. When any expected_* field is supplied, all expected_* fields are required.
  // Empty string means the current source has no media id.
  optional string expected_media_id = 3;
  // Empty string means the current source has no playlist id.
  optional string expected_playlist_id = 4;
  // SHA-256 hex of PlaybackState.target.
  optional string expected_target_hash = 5;
}

message ServerMessage {
  oneof message {
    ChatMessageReceive chat = 1;
    PlaybackStateChanged playback_state = 2;
    UserJoinedRoom user_joined = 3;
    UserLeftRoom user_left = 4;
    RoomSettingsChanged room_settings = 5;
    HeartbeatAck heartbeat_ack = 6;
    ErrorMessage error = 7;
    MediaAdded media_added = 8;
    MediaRemoved media_removed = 9;
    MediaRemovedBatch media_removed_batch = 10;
    PermissionChanged permission_changed = 11;
    PlaylistCreated playlist_created = 12;
    PlaylistUpdated playlist_updated = 13;
    PlaylistDeleted playlist_deleted = 14;
    PlaylistReordered playlist_reordered = 15;
    PlayingChanged playing_changed = 16;
    // WebRTC signaling messages (forwarded from other peers)
    WebRTCOffer webrtc_offer = 17;
    WebRTCAnswer webrtc_answer = 18;
    WebRTCIceCandidate webrtc_ice_candidate = 19;
    WebRTCJoin webrtc_join = 20;
    WebRTCLeave webrtc_leave = 21;
    // User notification push (replaces NOTIFICATION_PUSH error code abuse)
    UserNotification notification = 24;
    MediaUpdated media_updated = 25;
    PlaybackChanged playback = 26;
    PlaylistItemsChanged playlist_items = 27;
    RoomMembersChanged room_members = 28;
    ResourceObserved resource_observed = 29;
    ResourceChanged resource_changed = 30;
    ResourceObserveError resource_observe_error = 31;
  }
}

message ResourceObserved {
  string observe_id = 1;
  bool changed = 3;
  EventCursor event_cursor = 4;
}

message ResourceChangedOnly {}

message ResourceChanged {
  string observe_id = 1;
  oneof payload {
