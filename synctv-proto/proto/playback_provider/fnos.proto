syntax = "proto3";

package synctv.playback_provider.fnos;

import "proto/buf/validate/validate.proto";
import "proto/playback_provider/common.proto";

message GetFnosResourceRequest {
  string version = 1 [(buf.validate.field).string.min_len = 1];
  string mode_name = 2 [(buf.validate.field).string.min_len = 1];
  uint32 media_index = 3;
  string sig = 4 [(buf.validate.field).string.min_len = 1];
  string uid = 5 [(buf.validate.field).string.min_len = 1];
  string rid = 6 [(buf.validate.field).string.min_len = 1];
  int64 exp = 7;
  optional string range = 8;
  bool head = 9;
}

message FnosResourceResponse {
  synctv.playback_provider.common.StreamChunk chunk = 1;
}

message GetFnosSegmentRequest {
  string version = 1 [(buf.validate.field).string.min_len = 1];
  string target_url = 2 [(buf.validate.field).string.min_len = 1];
  string sig = 3 [(buf.validate.field).string.min_len = 1];
  string uid = 4 [(buf.validate.field).string.min_len = 1];
  string rid = 5 [(buf.validate.field).string.min_len = 1];
  int64 exp = 6;
  optional string range = 7;
  bool head = 8;
}

message FnosSegmentResponse {
  synctv.playback_provider.common.StreamChunk chunk = 1;
}

message GetFnosSubtitleRequest {
  string version = 1 [(buf.validate.field).string.min_len = 1];
  string mode_name = 2 [(buf.validate.field).string.min_len = 1];
  uint32 subtitle_index = 3;
  string sig = 4 [(buf.validate.field).string.min_len = 1];
  string uid = 5 [(buf.validate.field).string.min_len = 1];
  string rid = 6 [(buf.validate.field).string.min_len = 1];
  int64 exp = 7;
}

message FnosSubtitleResponse {
  synctv.playback_provider.common.StreamChunk chunk = 1;
}

message GetFnosThumbnailRequest {
  string version = 1 [(buf.validate.field).string.min_len = 1];
  string sig = 2 [(buf.validate.field).string.min_len = 1];
  string uid = 3 [(buf.validate.field).string.min_len = 1];
  string rid = 4 [(buf.validate.field).string.min_len = 1];
  int64 exp = 5;
}

message FnosThumbnailResponse {
  synctv.playback_provider.common.StreamChunk chunk = 1;
}

service FnosPlaybackProviderService {
  rpc GetResource(GetFnosResourceRequest) returns (stream FnosResourceResponse);
  rpc GetSegment(GetFnosSegmentRequest) returns (stream FnosSegmentResponse);
  rpc GetSubtitle(GetFnosSubtitleRequest) returns (stream FnosSubtitleResponse);
  rpc GetThumbnail(GetFnosThumbnailRequest) returns (stream FnosThumbnailResponse);
}
