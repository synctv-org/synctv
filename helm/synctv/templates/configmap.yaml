apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "synctv.configMapName" . }}
  labels:
    {{- include "synctv.labels" . | nindent 4 }}
{{- $connectionLimits := .Values.config.connectionLimits | default dict }}
{{- $messagingRateLimits := .Values.config.messagingRateLimits | default dict }}
{{- $httpRateLimits := .Values.config.httpRateLimits | default dict }}
{{- $grpcRateLimits := .Values.config.grpcRateLimits | default dict }}
{{- $passwordComplexity := .Values.config.passwordComplexity | default dict }}
{{- $bufferSizes := .Values.config.bufferSizes | default dict }}
{{- $mediaProviders := .Values.config.mediaProviders | default dict }}
{{- $mediaProviderAlist := $mediaProviders.alist | default dict }}
{{- $mediaProviderBilibili := $mediaProviders.bilibili | default dict }}
{{- $mediaProviderEmby := $mediaProviders.emby | default dict }}
{{- $webauthn := .Values.config.webauthn | default dict }}
{{- $cache := .Values.config.cache | default dict }}
{{- $proxySliceCache := .Values.config.proxySliceCache | default dict }}
data:
  synctv.yaml: |
    {{ if .Values.config.dataDir }}
    data_dir: {{ .Values.config.dataDir | quote }}
    {{ end }}

    time:
      timezone: {{ .Values.config.time.timezone | default "" | quote }}

    server:
      host: {{ .Values.config.server.host | quote }}
      port: {{ .Values.config.server.port }}
      enable_reflection: {{ .Values.config.server.enableReflection | default false }}
      shutdown_drain_timeout_seconds: {{ .Values.config.server.shutdownDrainTimeoutSeconds | default 30 }}
      grpc_max_message_size_bytes: {{ printf "%d" (int64 (.Values.config.server.grpcMaxMessageSizeBytes | default 16777216)) }}
      {{- if .Values.config.server.trustedProxies }}
      trusted_proxies:
        {{- range .Values.config.server.trustedProxies }}
        - {{ . | quote }}
        {{- end }}
      {{- end }}
      {{- if .Values.config.server.corsAllowedOrigins }}
      cors_allowed_origins:
        {{- range .Values.config.server.corsAllowedOrigins }}
        - {{ . | quote }}
        {{- end }}
      {{- end }}

    {{- if and .Values.config.publicIds .Values.config.publicIds.sqids .Values.config.publicIds.sqids.enabled }}
    public_ids:
      sqids:
        {{- if .Values.config.publicIds.sqids.alphabet }}
        alphabet: {{ .Values.config.publicIds.sqids.alphabet | quote }}
        {{- else }}
        alphabet: null
        {{- end }}
        min_length: {{ .Values.config.publicIds.sqids.minLength | default 12 }}
    {{- end }}

    metrics:
      enabled: {{ .Values.metrics.enabled | default false }}
      host: {{ .Values.metrics.host | default .Values.config.server.host | quote }}
      port: {{ .Values.metrics.port | default 9090 }}
      tls:
        enabled: {{ .Values.metrics.tls.enabled | default false }}
        {{- if .Values.metrics.tls.enabled }}
        cert_path: "/etc/synctv/metrics/tls/tls.crt"
        key_path: "/etc/synctv/metrics/tls/tls.key"
        {{- end }}
      auth:
        mode: {{ .Values.metrics.auth.mode | default "bearer_token" | quote }}
        {{- if eq (.Values.metrics.auth.mode | default "bearer_token") "basic" }}
        basic_username: {{ .Values.secrets.metrics.basicUsername | default "metrics" | quote }}
        {{- end }}
        {{- if eq (.Values.metrics.auth.mode | default "bearer_token") "kubernetes" }}
        kubernetes:
          audience: {{ .Values.metrics.auth.kubernetes.audience | default "" | quote }}
          authentication_cache_ttl_seconds: {{ .Values.metrics.auth.kubernetes.authenticationCacheTtlSeconds | default 60 }}
          authorization_cache_ttl_seconds: {{ .Values.metrics.auth.kubernetes.authorizationCacheTtlSeconds | default 60 }}
        {{- end }}

    management:
      enabled: {{ .Values.config.management.enabled }}
      transport: {{ .Values.config.management.transport | default "unix" | quote }}
      unix_socket_path: {{ .Values.config.management.unixSocketPath | default "/run/synctv/synctv.sock" | quote }}
      port: {{ .Values.config.management.port | default 50052 }}
      enable_reflection: {{ .Values.config.management.enableReflection | default false }}

    database:
      max_connections: {{ .Values.config.database.maxConnections | default 20 }}
      min_connections: {{ .Values.config.database.minConnections | default 5 }}
      connect_timeout_seconds: {{ .Values.config.database.connectTimeoutSeconds | default 10 }}
      idle_timeout_seconds: {{ .Values.config.database.idleTimeoutSeconds | default 600 }}
      max_lifetime_seconds: {{ .Values.config.database.maxLifetimeSeconds | default 1800 }}

    redis:
      connect_timeout_seconds: {{ .Values.config.redis.connectTimeoutSeconds | default 5 }}
      key_prefix: {{ .Values.config.redis.keyPrefix | default "synctv:" | quote }}
      deployment_mode: {{ .Values.config.redis.deploymentMode | default "standalone" | quote }}
      {{- if .Values.config.redis.sentinelMasterName }}
      sentinel_master_name: {{ .Values.config.redis.sentinelMasterName | quote }}
      {{- end }}
      {{- if .Values.config.redis.sentinelAddresses }}
      sentinel_addresses:
        {{- range .Values.config.redis.sentinelAddresses }}
        - {{ . | quote }}
        {{- end }}
      {{- end }}

    jwt:
      access_token_duration_hours: {{ .Values.config.jwt.accessTokenDurationHours | default 1 }}
      refresh_token_duration_days: {{ .Values.config.jwt.refreshTokenDurationDays | default 30 }}
      guest_token_duration_hours: {{ .Values.config.jwt.guestTokenDurationHours | default 4 }}
      clock_skew_leeway_secs: {{ .Values.config.jwt.clockSkewLeewaySecs | default 60 }}

    logging:
      level: {{ .Values.config.logging.level | quote }}
      format: {{ .Values.config.logging.format | quote }}
      {{- if .Values.config.logging.filePath }}
      file_path: {{ .Values.config.logging.filePath | quote }}
      {{- end }}
      {{- if .Values.config.logging.filter }}
      filter: {{ .Values.config.logging.filter | quote }}
      {{- end }}
      backtrace: {{ .Values.config.logging.backtrace | default false }}

    cache:
      l1_capacity: {{ $cache.l1Capacity | default 500 }}
      l1_ttl_seconds: {{ $cache.l1TtlSeconds | default 300 }}
      l2_ttl_seconds: {{ $cache.l2TtlSeconds | default 300 }}
      username_cache_capacity: {{ $cache.usernameCacheCapacity | default 1000 }}
      username_cache_ttl_seconds: {{ $cache.usernameCacheTtlSeconds | default 3600 }}
      permission_cache_capacity: {{ $cache.permissionCacheCapacity | default 1000 }}
      permission_cache_ttl_seconds: {{ $cache.permissionCacheTtlSeconds | default 300 }}

    proxy_slice_cache:
      enabled: {{ if hasKey $proxySliceCache "enabled" }}{{ $proxySliceCache.enabled }}{{ else }}true{{ end }}
      file_backend_enabled: {{ $proxySliceCache.fileBackendEnabled | default false }}
      {{- if $proxySliceCache.fileCacheDir }}
      file_cache_dir: {{ $proxySliceCache.fileCacheDir | quote }}
      {{- end }}

    livestream:
      rtmp_port: {{ .Values.config.livestream.rtmpPort }}
      public_rtmp_host: {{ .Values.config.livestream.publicRtmpHost | default "" | quote }}
      gop_cache_size: {{ .Values.config.livestream.gopCacheSize }}
      stream_timeout_seconds: {{ .Values.config.livestream.streamTimeoutSeconds }}
      cleanup_check_interval_seconds: {{ .Values.config.livestream.cleanupCheckIntervalSeconds }}
      pull_max_retries: {{ .Values.config.livestream.pullMaxRetries | default 10 }}
      pull_initial_backoff_ms: {{ .Values.config.livestream.pullInitialBackoffMs | default 1000 }}
      pull_max_backoff_ms: {{ .Values.config.livestream.pullMaxBackoffMs | default 30000 }}
      max_flv_tag_size_bytes: {{ printf "%d" (int64 (.Values.config.livestream.maxFlvTagSizeBytes | default 10485760)) }}
      gop_cache_max_memory_mb: {{ printf "%d" (int64 (.Values.config.livestream.gopCacheMaxMemoryMb | default 100)) }}
      hls_memory_max_mb: {{ printf "%d" (int64 (.Values.config.livestream.hlsMemoryMaxMb | default 0)) }}
      hls_storage_backend: {{ .Values.config.livestream.hlsStorageBackend | default "memory" | quote }}
      hls_shared_storage: {{ .Values.config.livestream.hlsSharedStorage | default false }}
      hls_storage_path: {{ .Values.config.livestream.hlsStoragePath | default "" | quote }}
      {{- if eq (.Values.config.livestream.hlsStorageBackend | default "memory") "oss" }}
      hls_oss:
        endpoint: {{ .Values.config.livestream.hlsOss.endpoint | default "" | quote }}
        bucket: {{ .Values.config.livestream.hlsOss.bucket | default "" | quote }}
        {{- if .Values.config.livestream.hlsOss.region }}
        region: {{ .Values.config.livestream.hlsOss.region | quote }}
        {{- else }}
        region: null
        {{- end }}
        base_path: {{ .Values.config.livestream.hlsOss.basePath | default "hls/" | quote }}
      {{- end }}
      flv_max_connection_duration_seconds: {{ .Values.config.livestream.flvMaxConnectionDurationSeconds | default 86400 }}
      flv_write_timeout_seconds: {{ .Values.config.livestream.flvWriteTimeoutSeconds | default 30 }}

    cluster:
      enabled: {{ .Values.config.cluster.enabled }}
      critical_channel_capacity: {{ .Values.config.cluster.criticalChannelCapacity }}
      publish_channel_capacity: {{ .Values.config.cluster.publishChannelCapacity }}
      discovery_mode: {{ .Values.config.cluster.discoveryMode | default "redis" | quote }}
      leader_election_mode: {{ .Values.config.cluster.leaderElectionMode | default "redis" | quote }}
      {{- if .Values.config.cluster.peers }}
      peers:
        {{- range .Values.config.cluster.peers }}
        - {{ . | quote }}
        {{- end }}
      {{- end }}
      catchup_window_secs: {{ .Values.config.cluster.catchupWindowSecs | default 300 }}
      stream_max_length: {{ .Values.config.cluster.streamMaxLength | default 10000 }}

    webrtc:
      mode: {{ .Values.config.webrtc.mode | default "peer_to_peer" | quote }}
      enable_builtin_stun: {{ .Values.config.webrtc.enableBuiltinStun }}
      stun_port: {{ .Values.config.webrtc.stunPort | default 3478 }}
      stun_host: {{ .Values.config.webrtc.stunHost | default "0.0.0.0" | quote }}
      {{- if .Values.config.webrtc.stunExternalAddr }}
      stun_external_addr: {{ .Values.config.webrtc.stunExternalAddr | quote }}
      {{- end }}
      filter_private_ice_candidates: {{ .Values.config.webrtc.filterPrivateIceCandidates }}

    connection_limits:
      max_per_user: {{ $connectionLimits.maxPerUser | default 5 }}
      max_per_room: {{ $connectionLimits.maxPerRoom | default 200 }}
      max_total: {{ $connectionLimits.maxTotal | default 10000 }}
      idle_timeout_seconds: {{ $connectionLimits.idleTimeoutSeconds | default 300 }}
      max_duration_seconds: {{ $connectionLimits.maxDurationSeconds | default 86400 }}
      ws_message_rate_limit_per_second: {{ $connectionLimits.wsMessageRateLimitPerSecond | default 50 }}

    messaging_rate_limits:
      chat_per_second: {{ $messagingRateLimits.chatPerSecond | default 10 }}
      danmaku_per_second: {{ $messagingRateLimits.danmakuPerSecond | default 3 }}
      window_seconds: {{ $messagingRateLimits.windowSeconds | default 1 }}

    http_rate_limits:
      auth_max_requests: {{ $httpRateLimits.authMaxRequests | default 5 }}
      auth_window_seconds: {{ $httpRateLimits.authWindowSeconds | default 60 }}
      write_max_requests: {{ $httpRateLimits.writeMaxRequests | default 30 }}
      write_window_seconds: {{ $httpRateLimits.writeWindowSeconds | default 60 }}
      read_max_requests: {{ $httpRateLimits.readMaxRequests | default 100 }}
      read_window_seconds: {{ $httpRateLimits.readWindowSeconds | default 60 }}
      media_max_requests: {{ $httpRateLimits.mediaMaxRequests | default 20 }}
      media_window_seconds: {{ $httpRateLimits.mediaWindowSeconds | default 60 }}
      admin_max_requests: {{ $httpRateLimits.adminMaxRequests | default 30 }}
      admin_window_seconds: {{ $httpRateLimits.adminWindowSeconds | default 60 }}
      streaming_max_requests: {{ $httpRateLimits.streamingMaxRequests | default 200 }}
      streaming_window_seconds: {{ $httpRateLimits.streamingWindowSeconds | default 60 }}
      websocket_max_requests: {{ $httpRateLimits.websocketMaxRequests | default 10 }}
      websocket_window_seconds: {{ $httpRateLimits.websocketWindowSeconds | default 60 }}

    grpc_rate_limits:
      auth_max_requests: {{ $grpcRateLimits.authMaxRequests | default 5 }}
      auth_window_seconds: {{ $grpcRateLimits.authWindowSeconds | default 60 }}
      email_max_requests: {{ $grpcRateLimits.emailMaxRequests | default 5 }}
      email_window_seconds: {{ $grpcRateLimits.emailWindowSeconds | default 60 }}
      media_max_requests: {{ $grpcRateLimits.mediaMaxRequests | default 20 }}
      media_window_seconds: {{ $grpcRateLimits.mediaWindowSeconds | default 60 }}
      write_max_requests: {{ $grpcRateLimits.writeMaxRequests | default 30 }}
      write_window_seconds: {{ $grpcRateLimits.writeWindowSeconds | default 60 }}
      admin_max_requests: {{ $grpcRateLimits.adminMaxRequests | default 30 }}
      admin_window_seconds: {{ $grpcRateLimits.adminWindowSeconds | default 60 }}
      read_max_requests: {{ $grpcRateLimits.readMaxRequests | default 100 }}
      read_window_seconds: {{ $grpcRateLimits.readWindowSeconds | default 60 }}

    password_complexity:
      min_length: {{ $passwordComplexity.minLength | default 8 }}
      require_uppercase: {{ if hasKey $passwordComplexity "requireUppercase" }}{{ $passwordComplexity.requireUppercase }}{{ else }}true{{ end }}
      require_lowercase: {{ if hasKey $passwordComplexity "requireLowercase" }}{{ $passwordComplexity.requireLowercase }}{{ else }}true{{ end }}
      require_digit: {{ if hasKey $passwordComplexity "requireDigit" }}{{ $passwordComplexity.requireDigit }}{{ else }}true{{ end }}
      require_special: {{ $passwordComplexity.requireSpecial | default false }}
      max_repeated_chars: {{ $passwordComplexity.maxRepeatedChars | default 3 }}

    buffer_sizes:
      websocket_outbound: {{ $bufferSizes.websocketOutbound | default 256 }}
      audit_buffer: {{ $bufferSizes.auditBuffer | default 10000 }}

    bootstrap:
      create_root_user: {{ .Values.config.bootstrap.createRootUser | default false }}
      root_username: {{ .Values.config.bootstrap.rootUsername | default "root" | quote }}
      root_email: {{ .Values.config.bootstrap.rootEmail | default "" | quote }}

    {{- if .Values.config.email.smtpHost }}
    email:
      smtp_host: {{ .Values.config.email.smtpHost | quote }}
      smtp_port: {{ .Values.config.email.smtpPort | default 587 }}
      from_email: {{ .Values.config.email.fromEmail | quote }}
      from_name: {{ .Values.config.email.fromName | default "SyncTV" | quote }}
      use_tls: {{ .Values.config.email.useTls }}
    {{- end }}

    media_providers:
      alist:
        request_timeout_seconds: {{ $mediaProviderAlist.requestTimeoutSeconds | default 30 }}
        connect_timeout_seconds: {{ $mediaProviderAlist.connectTimeoutSeconds | default 10 }}
      bilibili:
        request_timeout_seconds: {{ $mediaProviderBilibili.requestTimeoutSeconds | default 30 }}
        connect_timeout_seconds: {{ $mediaProviderBilibili.connectTimeoutSeconds | default 10 }}
      emby:
        request_timeout_seconds: {{ $mediaProviderEmby.requestTimeoutSeconds | default 30 }}
        connect_timeout_seconds: {{ $mediaProviderEmby.connectTimeoutSeconds | default 10 }}

    webauthn:
      enabled: {{ $webauthn.enabled | default false }}
      rp_id: {{ $webauthn.rpId | default "" | quote }}
      rp_origin: {{ $webauthn.rpOrigin | default "" | quote }}
      rp_name: {{ $webauthn.rpName | default "SyncTV" | quote }}
      allowed_origins: {{ $webauthn.allowedOrigins | default list | toJson }}
      allow_subdomains: {{ $webauthn.allowSubdomains | default false }}
      allow_any_port: {{ $webauthn.allowAnyPort | default false }}
      timeout_seconds: {{ $webauthn.timeoutSeconds | default 300 }}
