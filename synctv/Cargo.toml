[package]
name = "synctv"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "synctv"
path = "src/main.rs"

[features]
default = ["k8s"]
# Enable Kubernetes support (K8s DNS discovery, K8s Lease leader election).
# Disable to reduce binary size for non-K8s deployments:
#   cargo build --no-default-features
k8s = ["synctv-cluster/k8s"]

[lints]
workspace = true

[dependencies]
# Internal workspace libraries
synctv-core.workspace = true
synctv-api.workspace = true
synctv-livestream.workspace = true
synctv-cluster = { workspace = true, default-features = false }

# Async
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true

# HTTP Framework
axum.workspace = true

# Database
sqlx.workspace = true

# Redis
redis.workspace = true

# Utilities
anyhow.workspace = true
chrono.workspace = true
dashmap.workspace = true
hostname.workspace = true
nanoid.workspace = true
parking_lot.workspace = true
serde_json.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
synctv-media-providers.workspace = true
